<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>江湖歷程 - 關卡地圖</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
        html, body { width: 100vw; height: 100vh; overflow: hidden; background-color: #08090c; color: #fff; position: relative; }

        .page-bg { 
            position: absolute; inset: 0; width: 100%; height: 100%; 
            background-size: cover; background-position: center; background-repeat: no-repeat;
            filter: brightness(0.5); z-index: 1; 
        }

        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 2; }

        #map-canvas-container {
            position: absolute; top: 0; left: 0; width: 1280px; height: 720px;
            transform-origin: 0 0; z-index: 10; overflow: hidden;
        }

        .top-nav { position: absolute; top: 20px; left: 30px; z-index: 20; display: flex; align-items: center; gap: 20px; }
        .nav-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; padding: 8px 18px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; backdrop-filter: blur(4px); }
        .nav-btn:hover { background: rgba(54, 153, 255, 0.4); border-color: #3699ff; }
        .chapter-title { font-size: 28px; font-weight: bold; text-shadow: 0 2px 8px rgba(0,0,0,0.8); color: #f1c40f; }

        /* 沉浸式關卡節點樣式 */
        .stage-node {
            position: absolute; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 5px 25px rgba(0,0,0,0.8); transition: transform 0.2s, border-color 0.2s;
            z-index: 15; text-align: center; padding: 5px;
        }
        .stage-node:hover:not(.locked) { transform: translate(-50%, -50%) scale(1.12); }
        .stage-node.locked { filter: grayscale(100%) brightness(0.4); cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="page-bg" id="map-bg"></div>
    <div class="bg-grid"></div>

    <div id="map-canvas-container">
        <div class="top-nav">
            <button class="nav-btn" onclick="window.location.href='story_menu.html'">◀ 返回章節選單</button>
            <div class="chapter-title" id="map-title">載入中...</div>
        </div>
        <div id="nodes-container" style="position: absolute; inset: 0;"></div>
    </div>

    <script>
        function autoScaleUI() {
            const container = document.getElementById('map-canvas-container');
            const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
            container.style.transform = `scale(${scale})`;
            container.style.left = (window.innerWidth - 1280 * scale) / 2 + 'px';
            container.style.top = (window.innerHeight - 720 * scale) / 2 + 'px';
        }
        window.addEventListener('resize', autoScaleUI);

        function initChapterMap() {
            autoScaleUI();
            const params = new URLSearchParams(window.location.search);
            const chapterId = params.get('chapterId') || 'book_01';

            // 1. 讀取地圖編輯器存的設定
            let mapsConfig = {};
            try { mapsConfig = JSON.parse(localStorage.getItem('my_game_chapter_maps_config')) || {}; } catch(e){}
            let mapData = mapsConfig[chapterId] || null;

            // 2. 讀取劇本資料來對應章節標題
            let storyData = JSON.parse(localStorage.getItem('my_game_story_data')) || { books: [] };
            let book = storyData.books.find(b => b.id === chapterId) || storyData.books[0];

            document.getElementById('map-title').innerText = book ? book.title : '江湖關卡';
            if (mapData && mapData.bgUrl) {
                document.getElementById('map-bg').style.backgroundImage = `url('${mapData.bgUrl}')`;
            } else if (book && book.cover) {
                document.getElementById('map-bg').style.backgroundImage = `url('${book.cover}')`;
            }

            // 3. 讀取玩家通關進度 (紀錄解鎖到第幾個 nodeIndex)
            let progressMap = {};
            try { progressMap = JSON.parse(localStorage.getItem('my_game_chapter_progress')) || {}; } catch(e){}
            let maxUnlockedIndex = progressMap[chapterId] !== undefined ? progressMap[chapterId] : 0;

            const nodesContainer = document.getElementById('nodes-container');
            nodesContainer.innerHTML = '';

            // 4. 取得節點列表 (優先使用地圖編輯器設定的節點，若無則給預設)
            let stages = (mapData && mapData.nodes && mapData.nodes.length > 0) ? mapData.nodes : [
                { id: 1, name: '1-1 前哨', x: 220, y: 380, nodeIndex: 0, shape: 'circle', size: 90 },
                { id: 2, name: '1-2 密林', x: 500, y: 220, nodeIndex: 1, shape: 'circle', size: 90 },
                { id: 3, name: '1-3 決戰', x: 800, y: 450, nodeIndex: 2, shape: 'circle', size: 90 }
            ];

            stages.forEach((stage, idx) => {
                const isLocked = stage.nodeIndex > maxUnlockedIndex;
                const size = stage.size || 90;
                const shape = stage.shape || 'circle';
                const borderRadius = shape === 'square' ? '12px' : (shape === 'triangle' ? '0' : '50%');
                const clipPath = shape === 'triangle' ? 'polygon(50% 0%, 0% 100%, 100% 100%)' : 'none';

                const nodeEl = document.createElement('div');
                nodeEl.className = 'stage-node' + (isLocked ? ' locked' : '');
                nodeEl.style.left = stage.x + 'px';
                nodeEl.style.top = stage.y + 'px';
                nodeEl.style.width = size + 'px';
                nodeEl.style.height = size + 'px';
                nodeEl.style.borderRadius = borderRadius;
                nodeEl.style.clipPath = clipPath;
                nodeEl.style.border = isLocked ? '3px solid #666' : '3px solid #3699ff';
                nodeEl.style.background = stage.imgUrl ? `url('${stage.imgUrl}') center/cover` : 'rgba(20, 24, 33, 0.9)';

                if (isLocked) {
                    nodeEl.innerHTML = `<div style="font-size:22px;">🔒</div><div style="font-size:9px; color:#aaa; margin-top:2px;">未解鎖</div>`;
                    nodeEl.onclick = () => alert('🔒 此關卡尚未解鎖，請先通關前面的章節！');
                } else {
                    nodeEl.innerHTML = `
                        <div style="font-size:15px; font-weight:bold; color:#fff;">#${stage.id || idx+1}</div>
                        <div style="font-size:10px; color:#0ffff; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:${size-10}px;">${stage.name}</div>
                    `;
                    nodeEl.onclick = () => {
                        // 點擊後進入對應劇本與關卡節點
                        window.location.href = `dialogue_player.html?bookId=${book ? book.id : 'book_01'}&nodeIndex=${stage.nodeIndex}`;
                    };
                }

                nodesContainer.appendChild(nodeEl);
            });
        }

        window.onload = initChapterMap;
    </script>
</body>
</html>
