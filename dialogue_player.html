<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>江湖歷程 - 劇情播放器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
        html, body { width: 100vw; height: 100vh; overflow: hidden; background-color: #000; color: #fff; position: relative; }

        /* 1280x720 遊戲縮放容器 */
        #game-container {
            position: absolute; top: 0; left: 0; width: 1280px; height: 720px;
            transform-origin: 0 0; overflow: hidden; background-size: cover; background-position: center;
        }

        .bg-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.5) 100%); pointer-events: none; }

        /* 統一按鈕樣式 */
        .top-btn {
            background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; padding: 6px 14px; border-radius: 4px; cursor: pointer;
            font-size: 13px; font-weight: bold; backdrop-filter: blur(4px);
            transition: background 0.2s, border-color 0.2s;
        }
        .top-btn:hover { background: rgba(54, 153, 255, 0.3); border-color: #3699ff; }
        .top-btn.exit { background: rgba(192, 57, 43, 0.8); border-color: rgba(255, 255, 255, 0.3); }
        .top-btn.exit:hover { background: rgba(231, 76, 60, 0.9); }

        /* 角色立繪與對話框 */
        .avatar-container { position: absolute; bottom: 180px; left: 100px; height: 450px; z-index: 5; display: flex; align-items: flex-end; }
        .avatar-container img { max-height: 100%; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8)); transition: opacity 0.3s; }

        .dialogue-box {
            position: absolute; bottom: 30px; left: 60px; right: 60px; height: 140px;
            background: rgba(15, 17, 23, 0.9); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px; padding: 20px 30px; z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; justify-content: space-between; cursor: pointer;
        }
        .speaker-name { font-size: 16px; font-weight: bold; color: #00ffff; margin-bottom: 8px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .dialogue-text { font-size: 18px; color: #f1f1f1; line-height: 1.5; flex: 1; }
        .next-hint { position: absolute; right: 25px; bottom: 20px; font-size: 14px; color: #f1c40f; animation: bounce 1.5s infinite; }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

        /* 🌟 二次元風格劇情回顧 (Log) 彈窗樣式 */
        #story-log-modal {
            position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 999;
            display: none; flex-direction: column; padding: 40px 80px; backdrop-filter: blur(8px);
            animation: fadeIn 0.2s ease;
        }
        .log-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2); padding-bottom: 15px; margin-bottom: 20px;
        }
        .log-title { font-size: 22px; font-weight: bold; color: #f1c40f; letter-spacing: 2px; }
        .log-close-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff; padding: 6px 20px; border-radius: 6px; cursor: pointer; font-size: 14px;
        }
        .log-close-btn:hover { background: rgba(231, 76, 60, 0.8); border-color: #e74c3c; }
        
        .log-content-scroll {
            flex: 1; overflow-y: auto; padding-right: 15px; display: flex; flex-direction: column; gap: 20px;
        }
        .log-item {
            background: rgba(25, 28, 38, 0.7); border-left: 4px solid #00ffff; padding: 15px 20px; border-radius: 0 8px 8px 0;
        }
        .log-item-speaker { font-size: 15px; font-weight: bold; color: #00ffff; margin-bottom: 6px; }
        .log-item-text { font-size: 16px; color: #e2e8f0; line-height: 1.6; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 背景與遮罩 -->
        <div id="scene-bg" class="bg-overlay" style="position: absolute; inset: 0; background-size: cover; background-position: center;"></div>

        <!-- 頂部左側按鈕群：隱藏、回顧 -->
        <div style="position: absolute; top: 20px; left: 30px; z-index: 99; display: flex; gap: 10px;">
            <button class="top-btn" onclick="toggleHideUI()">👁️ 隱藏</button>
            <button class="top-btn" onclick="openLogModal()">📜 回顧</button>
        </div>

        <!-- 頂部右側按鈕群：自動播放、跳過、退出卡 -->
        <div style="position: absolute; top: 20px; right: 30px; z-index: 99; display: flex; gap: 10px;">
            <button class="top-btn" onclick="toggleAutoPlay()" id="auto-play-btn">▶️ 自動播放</button>
            <button class="top-btn" onclick="skipStory(event)">⏩ 跳過</button>
            <button class="top-btn exit" onclick="exitToMap()">🚪 退出卡</button>
        </div>

        <!-- 角色立繪區 -->
        <div class="avatar-container" id="avatar-wrap" style="display:none;">
            <img id="speaker-avatar" src="" alt="立繪">
        </div>

        <!-- 對話框本體 -->
        <div class="dialogue-box" onclick="progressDialogue()">
            <div>
                <div class="speaker-name" id="speaker-title">主講者</div>
                <div class="dialogue-text" id="dialogue-content">載入劇情中...</div>
            </div>
            <div class="next-hint">▼</div>
        </div>

        <!-- 🌟 歷史對話回顧彈窗層 -->
        <div id="story-log-modal">
            <div class="log-header">
                <div class="log-title">📜 劇情回顧 (Story Log)</div>
                <button class="log-close-btn" onclick="closeLogModal()">關閉回顧</button>
            </div>
            <div class="log-content-scroll" id="log-scroll-container">
                <!-- 動態生成的歷史對話紀錄會在這裡顯示 -->
            </div>
        </div>
    </div>

    <script>
        let bookId = 'book_01';
        let currentNodeIndex = 0;
        let currentLineIndex = 0;
        let currentBookNodes = [];
        let isAutoPlaying = false;
        let autoPlayTimer = null;

        // 🌟 儲存玩家已經看過的所有對話歷史陣列
        let dialogueHistoryLogs = [];

        function autoScaleUI() {
            const container = document.getElementById('game-container');
            const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
            container.style.transform = `scale(${scale})`;
            container.style.left = (window.innerWidth - 1280 * scale) / 2 + 'px';
            container.style.top = (window.innerHeight - 720 * scale) / 2 + 'px';
        }
        window.addEventListener('resize', autoScaleUI);

        window.onload = function() {
            autoScaleUI();
            const params = new URLSearchParams(window.location.search);
            bookId = params.get('bookId') || 'book_01';
            currentNodeIndex = parseInt(params.get('nodeIndex')) || 0;

            loadStoryData();
        };

        function loadStoryData() {
            try {
                let storyData = JSON.parse(localStorage.getItem('my_game_story_data')) || { books: [] };
                
                let book = storyData.books.find(b => b.id === bookId);
                if (!book && storyData.books.length > 0) {
                    book = storyData.books.find(b => b.id.includes(bookId) || bookId.includes(b.id)) || storyData.books[0];
                    if (book) bookId = book.id;
                }

                if (book && book.nodes && book.nodes.length > 0) {
                    currentBookNodes = book.nodes;
                    if (currentNodeIndex >= currentBookNodes.length) {
                        currentNodeIndex = 0;
                    }
                    loadNode(currentNodeIndex);
                } else {
                    alert('找不到對應的劇本內容或節點為空！');
                    exitToMap();
                }
            } catch(e) {
                console.error(e);
                exitToMap();
            }
        }

        function loadNode(nIdx) {
            if (nIdx >= currentBookNodes.length) {
                finishStorySequence();
                return;
            }
            currentNodeIndex = nIdx;
            let node = currentBookNodes[nIdx];

            if (node.type === 'battle') {
                let targetLevelIdx = node.levelIndex !== undefined ? node.levelIndex : 0;
                window.location.href = `battle.html?bookId=${bookId}&nodeIndex=${currentNodeIndex}&levelIndex=${targetLevelIdx}&from=story`;
                return;
            } else if (node.type === 'cg') {
                const bg = document.getElementById('scene-bg');
                bg.style.backgroundImage = `url('${node.cgUrl || ''}')`;
                document.getElementById('speaker-title').innerText = '【過場插畫】';
                document.getElementById('dialogue-content').innerText = node.text || '';
                document.getElementById('avatar-wrap').style.display = 'none';
                currentLineIndex = 999; 

                // 🌟 記錄 CG 旁白進歷史
                pushToHistory('【過場插畫】', node.text || '');

            } else if (node.type === 'dialogue') {
                const bg = document.getElementById('scene-bg');
                bg.style.backgroundImage = `url('${node.bgUrl || ''}')`;
                currentLineIndex = 0;
                renderDialogueLine(node);
            }
        }

        function renderDialogueLine(node) {
            if (!node.lines || currentLineIndex >= node.lines.length) {
                loadNode(currentNodeIndex + 1); 
                return;
            }
            let line = node.lines[currentLineIndex];
            let speaker = line.speaker || '未知';
            let text = line.text || '';

            document.getElementById('speaker-title').innerText = speaker;
            document.getElementById('dialogue-content').innerText = text;

            const avatarWrap = document.getElementById('avatar-wrap');
            const avatarImg = document.getElementById('speaker-avatar');
            if (line.avatar) {
                avatarWrap.style.display = 'flex';
                avatarImg.src = line.avatar;
            } else {
                avatarWrap.style.display = 'none';
            }

            // 🌟 記錄這句對話到歷史紀錄中
            pushToHistory(speaker, text);
        }

        // 🌟 將對話加入歷史陣列（避免重複記錄同一句）
        function pushToHistory(speaker, text) {
            if (!text) return;
            const lastLog = dialogueHistoryLogs[dialogueHistoryLogs.length - 1];
            if (!lastLog || lastLog.text !== text || lastLog.speaker !== speaker) {
                dialogueHistoryLogs.push({ speaker, text });
            }
        }

        function progressDialogue() {
            let node = currentBookNodes[currentNodeIndex];
            if (!node) return;

            if (node.type === 'cg') {
                loadNode(currentNodeIndex + 1);
            } else if (node.type === 'dialogue') {
                currentLineIndex++;
                renderDialogueLine(node);
            }
        }

        // 🌟 打開歷史回顧視窗
        function openLogModal() {
            const modal = document.getElementById('story-log-modal');
            const scrollContainer = document.getElementById('log-scroll-container');
            
            // 清空並重新渲染所有歷史對話
            scrollContainer.innerHTML = '';
            if (dialogueHistoryLogs.length === 0) {
                scrollContainer.innerHTML = `<div style="color: #888; text-align: center; margin-top: 50px;">目前尚無對話紀錄</div>`;
            } else {
                dialogueHistoryLogs.forEach(log => {
                    const item = document.createElement('div');
                    item.className = 'log-item';
                    item.innerHTML = `
                        <div class="log-item-speaker">${log.speaker}</div>
                        <div class="log-item-text">${log.text}</div>
                    `;
                    scrollContainer.appendChild(item);
                });
                // 自動捲動到最底部（最新的一句）
                scrollContainer.scrollTop = scrollContainer.scrollHeight;
            }

            modal.style.display = 'flex';
        }

        // 🌟 關閉歷史回顧視窗
        function closeLogModal() {
            document.getElementById('story-log-modal').style.display = 'none';
        }

        function skipStory(event) {
            if(event) event.stopPropagation();
            if (confirm('確定要跳過這段劇情，前往下一個節點嗎？')) {
                currentNodeIndex++;
                loadNode(currentNodeIndex);
            }
        }

        function toggleAutoPlay() {
            isAutoPlaying = !isAutoPlaying;
            const btn = document.getElementById('auto-play-btn');
            if (isAutoPlaying) {
                btn.innerText = '⏸️ 停止自動';
                btn.style.borderColor = '#00ffff';
                autoPlayTimer = setInterval(() => { progressDialogue(); }, 2500);
            } else {
                btn.innerText = '▶️ 自動播放';
                btn.style.borderColor = 'rgba(255,255,255,0.2)';
                clearInterval(autoPlayTimer);
            }
        }

        function toggleHideUI() {
            const box = document.querySelector('.dialogue-box');
            box.style.display = box.style.display === 'none' ? 'flex' : 'none';
        }

        function exitToMap() {
            window.location.href = `chapter_map.html?chapterId=${bookId}`;
        }

        function finishStorySequence() {
            try {
                let progressMap = JSON.parse(localStorage.getItem('my_game_chapter_progress')) || {};
                let currentMax = progressMap[bookId] !== undefined ? progressMap[bookId] : 0;
                if (currentNodeIndex >= currentMax) {
                    progressMap[bookId] = currentNodeIndex + 1;
                    localStorage.setItem('my_game_chapter_progress', JSON.stringify(progressMap));
                }
            } catch(e) {}
            exitToMap();
        }
    </script>
</body>
</html>
