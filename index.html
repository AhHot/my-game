<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中大型策略战棋</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #0f0f1a; }
        #game { width: 100%; height: 100%; }
        
        /* ================= 角色面板样式 ================= */
        #char-panel-overlay {
            display: none; /* 默认隐藏 */
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); /* 背景遮罩 */
            z-index: 9999; justify-content: center; align-items: center;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .char-panel-box {
            width: 95%; max-width: 600px;
            background-color: #1e2028; /* 默认深色背景 */
            border: 2px solid #4a4a4a; /* 边框颜色，可改 */
            border-radius: 8px;
            color: #ddd; padding: 15px;
            position: relative;
            background-size: cover; background-position: center;
            max-height: 90vh; overflow-y: auto; /* 防止内容过长超出屏幕 */
        }

        /* 顶部信息 */
        .cp-header { display: flex; gap: 15px; margin-bottom: 15px; }
        .cp-avatar { width: 80px; height: 80px; background: #333; border: 2px solid #888; display: flex; justify-content: center; align-items: center; font-size: 40px; }
        .cp-info { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 5px 10px; font-size: 13px; }
        .cp-info span { color: #aaa; }
        .cp-info b { color: #fff; margin-left: 5px; }
        .cp-info .highlight { color: #e74c3c; } /* 境界、战力用红色或绿色 */

        /* 标签页 */
        .cp-tabs { display: flex; background: #111; margin-bottom: 10px; border-bottom: 2px solid #333; }
        .cp-tab { flex: 1; text-align: center; padding: 8px 0; cursor: pointer; font-weight: bold; color: #888; }
        .cp-tab.active { background: #d48b21; color: #fff; } /* 当前选中的橙色高亮 */

        /* 属性网格 */
        .cp-attr-section { margin-bottom: 15px; }
        .cp-attr-title { font-size: 14px; color: #ccc; border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 10px; font-weight: bold; }
        .cp-attr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; font-size: 13px; }
        .cp-attr-item { display: flex; justify-content: space-between; border-bottom: 1px dashed #333; padding-bottom: 2px; }
        .cp-attr-item span { color: #aaa; }
        .cp-attr-item b { color: #fff; }

        /* 关闭按钮 */
        .cp-close-btn {
            position: absolute; top: 10px; right: 15px; font-size: 20px; color: #aaa; cursor: pointer;
        }
        .cp-close-btn:hover { color: #fff; }

        /* 左下角测试按钮 */
        #test-ui-btn {
            position: fixed; bottom: 20px; left: 20px; z-index: 9998;
            background: #3498db; color: white; padding: 10px 15px; border-radius: 5px;
            cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- 游戏引擎挂载点 -->
    <div id="game"></div>

    <!-- 测试面板的按钮 -->
    <div id="test-ui-btn" onclick="openCharPanel()">📊 查看角色面板</div>

    <!-- 角色面板 DOM 结构 -->
    <div id="char-panel-overlay" onclick="closeCharPanel(event)">
        <div class="char-panel-box" id="char-panel-box" onclick="event.stopPropagation()">
            <div class="cp-close-btn" onclick="closeCharPanel(event)">✖</div>
            
            <!-- 顶部信息 -->
            <div class="cp-header">
                <div class="cp-avatar" id="panel-emoji">👩</div>
                <div class="cp-info">
                    <div><span>[姓名]</span> <b id="panel-name">殷悠悠</b></div>
                    <div><span>[师门]</span> <b>明教</b></div>
                    <div><span>[境界]</span> <b class="highlight" style="color:#f1c40f;">神乎其技</b></div>
                    <div><span>[战力]</span> <b style="color:#2ecc71;">133368</b></div>
                </div>
            </div>

            <!-- 标签页 -->
            <div class="cp-tabs">
                <div class="cp-tab active">人物</div>
                <div class="cp-tab">装备</div>
                <div class="cp-tab">武学</div>
                <div class="cp-tab">经脉</div>
            </div>

            <!-- 新增：6大意境 -->
            <div class="cp-attr-section">
                <div class="cp-attr-title">六大意境 (主属性)</div>
                <div class="cp-attr-grid" id="panel-stats-grid">
                    <!-- 动态注入 -->
                </div>
            </div>

            <!-- 计算后的显示属性 -->
            <div class="cp-attr-section">
                <div class="cp-attr-title">最终属性 (含装备加成)</div>
                <div class="cp-attr-grid" id="panel-attrs-grid">
                    <!-- 动态注入 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 引入 Phaser 引擎 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    
    <script src="data.js"></script>
    <script src="team.js"></script>
    <script src="battle.js"></script>

    <!-- 面板控制与计算逻辑 -->
    <script>
        function applyUIConfig() {
            try {
                const configStr = localStorage.getItem('my_game_ui_config');
                if (configStr) {
                    const config = JSON.parse(configStr);
                    const box = document.getElementById('char-panel-box');
                    if (config.bgImage && config.bgImage.trim() !== '') box.style.backgroundImage = `url('${config.bgImage}')`;
                    else box.style.backgroundImage = 'none';
                    if (config.bgColor) box.style.backgroundColor = config.bgColor;
                    if (config.borderColor) box.style.borderColor = config.borderColor;
                }
            } catch (e) { console.error("读取UI配置失败", e); }
        }

        function openCharPanel() {
            applyUIConfig();
            
            // 获取第一个玩家角色进行展示
            const char = CHARACTERS.find(c => c.side === 'player') || CHARACTERS[0];
            if (!char) {
                alert("还没有角色，请去编辑器添加！");
                return;
            }

            document.getElementById('panel-name').innerText = char.name;
            document.getElementById('panel-emoji').innerText = char.emoji;

            // 1. 渲染6大意境
            const stats = char.stats || { fengRui:0, hunHou:0, lingDong:0, jianRen:0, guiMi:0, jueQing:0 };
            document.getElementById('panel-stats-grid').innerHTML = `
                <div class="cp-attr-item"><span style="color:#e67e22;">锋锐 (攻击)</span> <b>${stats.fengRui}</b></div>
                <div class="cp-attr-item"><span style="color:#e74c3c;">浑厚 (气血)</span> <b>${stats.hunHou}</b></div>
                <div class="cp-attr-item"><span style="color:#2ecc71;">灵动 (速度/闪避)</span> <b>${stats.lingDong}</b></div>
                <div class="cp-attr-item"><span style="color:#3498db;">坚韧 (防御/韧性)</span> <b>${stats.jianRen}</b></div>
                <div class="cp-attr-item"><span style="color:#9b59b6;">诡秘 (命中/暴伤)</span> <b>${stats.guiMi}</b></div>
                <div class="cp-attr-item"><span style="color:#f1c40f;">绝情 (暴击)</span> <b>${stats.jueQing}</b></div>
            `;

            // 2. 创建临时 Unit 实例并计算最终属性（复用 battle.js 里的计算逻辑）
            const unit = new Unit(char);

            // 3. 渲染最终属性
            document.getElementById('panel-attrs-grid').innerHTML = `
                <div class="cp-attr-item"><span>气血</span> <b>${unit.maxHp}</b></div>
                <div class="cp-attr-item"><span>内力</span> <b>100%</b></div>
                <div class="cp-attr-item"><span>攻击</span> <b>${unit.atk}</b></div>
                <div class="cp-attr-item"><span>防御</span> <b>${unit.def}</b></div>
                <div class="cp-attr-item"><span>速度</span> <b>${unit.speed}</b></div>
                <div class="cp-attr-item"><span>暴击率</span> <b>${(unit.critRate * 100).toFixed(1)}%</b></div>
                <div class="cp-attr-item"><span>暴击伤害</span> <b>${(unit.critDmg * 100).toFixed(1)}%</b></div>
                <div class="cp-attr-item"><span>闪避率</span> <b>${(unit.dodgeRate * 100).toFixed(1)}%</b></div>
                <div class="cp-attr-item"><span>命中率</span> <b>${(unit.hitRate * 100).toFixed(1)}%</b></div>
                <div class="cp-attr-item"><span>抗暴率(韧性)</span> <b>${(unit.critResist * 100).toFixed(1)}%</b></div>
            `;

            document.getElementById('char-panel-overlay').style.display = 'flex';
        }

        function closeCharPanel(e) {
            if (e && e.target.id === 'char-panel-box') return;
            document.getElementById('char-panel-overlay').style.display = 'none';
        }
    </script>
</body>
</html>
