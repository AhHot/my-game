<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>武俠 - 遊戲大廳</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #0f0f1a; font-family: "Microsoft YaHei", sans-serif; position: relative; }

        #game-scale-container {
            position: absolute; top: 0; left: 0;
            width: 1280px; height: 720px;
            transform-origin: 0 0;
            z-index: 10; pointer-events: none;
        }

        .interactive-ui { pointer-events: auto; }
        #game { width: 1280px; height: 720px; position: absolute; inset: 0; z-index: 0; }

        .main-bg {
            position: absolute; inset: 0;
            background-size: cover; background-position: center;
            transition: background-image 0.5s ease-in-out;
            z-index: 1; pointer-events: none;
            cursor: pointer;
        }
        .main-bg::after {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at center, rgba(11, 12, 16, 0.1) 0%, rgba(11, 12, 16, 0.65) 100%);
        }

        .top-bar-overlay {
            position: absolute; top: 0; left: 0; right: 0; height: 65px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 30px; z-index: 100;
            background: linear-gradient(to bottom, rgba(15, 15, 26, 0.85) 0%, transparent 100%);
        }
        .top-title { font-size: 20px; font-weight: bold; color: #f1c40f; display: flex; align-items: center; gap: 8px; }

        /* ★ 帳號等級徽章 */
        .account-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(241,196,15,0.12);
            border: 1px solid rgba(241,196,15,0.35);
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 13px;
            margin-left: 15px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }
        .account-badge:hover {
            background: rgba(241,196,15,0.25);
            border-color: #f1c40f;
        }
        .account-badge .acc-label { font-size: 11px; color: #aaa; }
        .account-badge #account-level-display { color: #f1c40f; font-weight: bold; }
        .reward-badge {
            position: absolute;
            top: -6px; right: -6px;
            min-width: 18px; height: 18px;
            background: #e74c3c; color: #fff;
            border-radius: 9px;
            font-size: 11px;
            font-weight: bold;
            display: none;
            align-items: center; justify-content: center;
            padding: 0 5px;
            box-shadow: 0 2px 6px rgba(231,76,60,0.5);
            animation: bounceBadge 1.5s infinite;
        }
        @keyframes bounceBadge {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .btn-editor-quick {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 14px; border-radius: 20px; font-size: 13px; color: #fff; cursor: pointer;
            backdrop-filter: blur(6px); transition: all 0.2s;
        }
        .btn-editor-quick:hover { background: #3498db; border-color: #3498db; }

        .left-sidebar {
            position: absolute; left: 30px; top: 90px; display: flex;
            flex-direction: column; gap: 12px; z-index: 100;
        }
        .menu-btn {
            width: 150px; padding: 12px 16px;
            background: rgba(15, 15, 26, 0.75); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12); border-left: 4px solid #3498db;
            border-radius: 0 8px 8px 0; color: #fff; font-size: 14px; font-weight: bold;
            display: flex; align-items: center; gap: 10px; cursor: pointer;
            transition: all 0.25s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .menu-btn:hover {
            width: 165px; background: rgba(52, 152, 219, 0.35); border-color: #3498db;
        }

        .main-right-section {
            position: absolute; right: 40px; top: 90px;
            width: 340px;
            display: flex; flex-direction: column; gap: 15px;
            z-index: 100;
        }
        .main-stage-card {
            background: rgba(22, 33, 62, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px;
            padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; gap: 15px; position: relative; overflow: hidden;
        }
        .main-stage-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 100%; background: #f1c40f;
        }
        .stage-tag { font-size: 12px; color: #f1c40f; font-weight: bold; letter-spacing: 1px; }
        .stage-title { font-size: 22px; font-weight: bold; color: #fff; line-height: 1.3; }
        .stage-desc { font-size: 12px; color: #aaa; line-height: 1.6; height: 60px; overflow: hidden; }
        .btn-battle {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: #fff; border: none; padding: 14px; border-radius: 6px;
            font-size: 16px; font-weight: bold; cursor: pointer; text-align: center;
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.4); transition: all 0.2s;
        }
        .btn-battle:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(231, 76, 60, 0.6); }

        /* ★ 摘星樓入口卡片 */
        .tower-entry-card {
            align-self: flex-end;
            width: 170px; height: 130px;
            background: linear-gradient(135deg, #2a1a2e 0%, #1a1c29 100%);
            border: 2px solid #f1c40f;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(241,196,15,0.3);
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .tower-entry-card:hover:not(.locked) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(241,196,15,0.55);
            border-color: #ffd700;
        }
        .tower-entry-card.locked {
            opacity: 0.65;
            border-color: #666;
            box-shadow: none;
            cursor: not-allowed;
        }
        .tower-entry-card.locked:hover { transform: none; }
        .tower-entry-bg {
            position: absolute; inset: 0;
            background-size: cover; background-position: center;
            filter: brightness(0.4);
            z-index: 1;
        }
        .tower-entry-bg::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent 60%);
        }
        .tower-entry-content {
            position: relative; z-index: 2;
            display: flex; flex-direction: column;
            align-items: center; gap: 6px;
            text-align: center;
            padding: 10px;
        }
        .tower-entry-icon {
            font-size: 42px; line-height: 1;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
        }
        .tower-entry-name {
            color: #f1c40f; font-size: 15px; font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .tower-entry-floor {
            color: #ccc; font-size: 11px;
            background: rgba(0,0,0,0.5);
            padding: 2px 8px; border-radius: 8px;
        }

        #global-toast {
            position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
            background: rgba(46, 204, 113, 0.9); color: #fff; padding: 15px 30px; border-radius: 10px;
            font-size: 24px; font-weight: bold; z-index: 99999; display: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); text-align: center;
            white-space: pre-line;
        }

        /* ★ 战斗模式下隐藏主界面 UI */
        body.in-battle .top-bar-overlay,
        body.in-battle .left-sidebar,
        body.in-battle .main-right-section,
        body.in-battle #main-bg,
        body.in-battle #idle-panel {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="game-scale-container">
        <div id="game"></div>

        <div class="main-bg" id="main-bg" onclick="cycleBackground()" title="點擊切換背景"></div>

        <div class="top-bar-overlay interactive-ui">
            <div class="top-title">
                <span>⚔️ 江湖大廳</span>
                <div class="account-badge" onclick="openAccountPanel(event)" title="點擊查看帳號升級獎勵">
                    <span class="acc-label">帳號</span>
                    <span id="account-level-display">Lv.1</span>
                    <span id="account-reward-badge" class="reward-badge">0</span>
                </div>
            </div>
            <button class="btn-editor-quick" onclick="window.location.href='editor.html'">⚙️ 開啟配置中心</button>
        </div>

        <div class="left-sidebar interactive-ui" id="left-sidebar"></div>

        <div class="main-right-section interactive-ui">
            <div class="main-stage-card">
                <div>
                    <div class="stage-tag" id="index-stage-tag">當前江湖主線</div>
                    <div class="stage-title" id="index-stage-title">第一章：青城山變</div>
                </div>
                <div class="stage-desc" id="index-stage-desc">
                    探索江湖風雲，解鎖沉浸式武俠劇本與策略戰棋關卡。
                </div>
                <button class="btn-battle" onclick="window.location.href='story_menu.html'"> 進入 </button>
            </div>

            <!-- 摘星樓入口卡片 -->
            <div class="tower-entry-card" id="tower-entry-card" onclick="openTowerPage()">
                <div class="tower-entry-bg" id="tower-entry-bg"></div>
                <div class="tower-entry-content">
                    <div class="tower-entry-icon" id="tower-entry-icon">🏯</div>
                    <div class="tower-entry-name" id="tower-entry-name">摘星樓</div>
                    <div class="tower-entry-floor" id="tower-entry-floor">第 1 層待挑戰</div>
                </div>
            </div>
        </div>
    </div>

    <div id="global-toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script src="core.js"></script>
    <script src="account_system.js"></script>
    <script src="battle.js"></script>
    <script src="character_system.js"></script>
    <script src="tab_char.js"></script>
    <script src="tab_shop.js"></script>
    <script src="idle_system.js"></script>

    <script>
        function resizeGameUI() {
            const container = document.getElementById('game-scale-container');
            const scaleX = window.innerWidth / 1280;
            const scaleY = window.innerHeight / 720;
            const scale = Math.min(scaleX, scaleY);

            container.style.transform = `scale(${scale})`;
            const scaledWidth = 1280 * scale;
            const scaledHeight = 720 * scale;
            container.style.left = (window.innerWidth - scaledWidth) / 2 + 'px';
            container.style.top = (window.innerHeight - scaledHeight) / 2 + 'px';
        }

        window.addEventListener('resize', resizeGameUI);

        let currentBgIndex = 0;
        let mainConfig = null;
        let selectedShopIdx = 0;

        function initIndexMainUI() {
            resizeGameUI();

            const savedConfig = localStorage.getItem('my_game_main_config');
            if (savedConfig) {
                try { mainConfig = JSON.parse(savedConfig); } catch (e) {}
            }

            if (!mainConfig) {
                mainConfig = {
                    bgList: [
                        { name: '破廟夜色', url: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1200&auto=format&fit=crop', unlocked: true }
                    ],
                    stageCard: {
                        tag: '當前江湖主線',
                        title: '第一章：青城山變',
                        desc: '探索江湖風雲，解鎖沉浸式武俠劇本與策略戰棋關卡。'
                    },
                    buttons: {
                        story: { title: '江湖歷程', icon: '📜', active: true, action: 'story' },
                        character: { title: '角色與背包', icon: '👥', active: true, action: 'character' },
                        shop: { title: '坊市入口', icon: '🛒', active: true, action: 'shop' },
                        settings: { title: '系統設置', icon: '⚙️', active: true, action: 'settings' }
                    }
                };
            }

            if (!mainConfig.towerEntry) {
                mainConfig.towerEntry = {
                    enabled: true,
                    name: '摘星樓',
                    bgUrl: '',
                    icon: '🏯'
                };
            }

            updateBackgroundDisplay();
            updateStageCardDisplay();
            renderIndexLeftSidebar();
            refreshTowerEntry();
            refreshAccountBadge();
        }

        function updateBackgroundDisplay() {
            if (mainConfig && mainConfig.bgList && mainConfig.bgList.length > 0) {
                if (currentBgIndex >= mainConfig.bgList.length) currentBgIndex = 0;
                const activeBg = mainConfig.bgList[currentBgIndex];
                if (activeBg) {
                    document.getElementById('main-bg').style.backgroundImage = `url('${activeBg.url}')`;
                }
            }
        }

        function updateStageCardDisplay() {
            if (mainConfig && mainConfig.stageCard) {
                const tagEl = document.getElementById('index-stage-tag');
                const titleEl = document.getElementById('index-stage-title');
                const descEl = document.getElementById('index-stage-desc');
                const cardEl = document.querySelector('.main-stage-card');
                if (tagEl && mainConfig.stageCard.tag) tagEl.innerText = mainConfig.stageCard.tag;
                if (titleEl && mainConfig.stageCard.title) titleEl.innerText = mainConfig.stageCard.title;
                if (descEl && mainConfig.stageCard.desc) descEl.innerText = mainConfig.stageCard.desc;
                if (cardEl) {
                    if (mainConfig.stageCard.bgUrl && mainConfig.stageCard.bgUrl.trim() !== '') {
                        let url = encodeURI(mainConfig.stageCard.bgUrl.trim());
                        cardEl.style.background = `linear-gradient(to bottom, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.1)), url('${url}') center/cover`;
                    } else {
                        cardEl.style.background = 'rgba(22, 33, 62, 0.85)';
                    }
                }
            }
        }

        window.cycleBackground = function() {
            if (!mainConfig || !mainConfig.bgList || mainConfig.bgList.length === 0) return;

            let unlockedBgs = mainConfig.bgList.filter(b => b.unlocked);
            if (unlockedBgs.length === 0) unlockedBgs = mainConfig.bgList;

            let currentUrl = mainConfig.bgList[currentBgIndex].url;
            let subIndex = unlockedBgs.findIndex(b => b.url === currentUrl);

            subIndex = (subIndex + 1) % unlockedBgs.length;
            let targetBg = unlockedBgs[subIndex];

            currentBgIndex = mainConfig.bgList.findIndex(b => b.id === targetBg.id);
            if (currentBgIndex === -1) currentBgIndex = 0;

            updateBackgroundDisplay();
            showToast(`已切換背景：${targetBg.name}`, '#3498db');
        }

        function refreshTowerEntry() {
            const card = document.getElementById('tower-entry-card');
            if (!card) return;

            const cfg = mainConfig && mainConfig.towerEntry;
            if (!cfg || cfg.enabled === false) {
                card.style.display = 'none';
                return;
            }
            card.style.display = 'flex';

            let acc = window.gameAccount;
            if (!acc) {
                try { acc = JSON.parse(localStorage.getItem('my_game_account') || '{}'); } catch (e) { acc = {}; }
            }
            const level = acc.level || 1;
            const unlockLv = (window.globalData && window.globalData.account && window.globalData.account.towerUnlockLevel) || 10;

            let tp = window.towerProgress;
            if (!tp) {
                try { tp = JSON.parse(localStorage.getItem('my_game_tower_progress') || '{}'); } catch (e) { tp = {}; }
            }
            const maxFloor = tp.maxClearedFloor || 0;

            const bgEl = document.getElementById('tower-entry-bg');
            if (bgEl) {
                if (cfg.bgUrl && cfg.bgUrl.trim()) {
                    bgEl.style.backgroundImage = `url('${encodeURI(cfg.bgUrl.trim())}')`;
                } else {
                    bgEl.style.backgroundImage = 'none';
                }
            }

            const iconEl = document.getElementById('tower-entry-icon');
            if (iconEl) iconEl.innerText = cfg.icon || '🏯';
            const nameEl = document.getElementById('tower-entry-name');
            if (nameEl) nameEl.innerText = cfg.name || '摘星樓';

            const floorEl = document.getElementById('tower-entry-floor');
            if (level < unlockLv) {
                card.classList.add('locked');
                if (floorEl) floorEl.innerText = `需要 Lv.${unlockLv}`;
            } else {
                card.classList.remove('locked');
                if (floorEl) {
                    if (maxFloor === 0) floorEl.innerText = '第 1 層待挑戰';
                    else floorEl.innerText = `已通關 ${maxFloor} 層`;
                }
            }
        }

        function refreshAccountBadge() {
            if (window.AccountSystem && typeof window.AccountSystem.updateTopLeftDisplay === 'function') {
                try { window.AccountSystem.updateTopLeftDisplay(); return; } catch (e) {}
            }
            const el = document.getElementById('account-level-display');
            const badge = document.getElementById('account-reward-badge');
            let acc = window.gameAccount;
            if (!acc) {
                try { acc = JSON.parse(localStorage.getItem('my_game_account') || '{}'); } catch (e) { acc = {}; }
            }
            if (el) el.innerText = 'Lv.' + (acc.level || 1);
            if (badge && window.AccountSystem && typeof window.AccountSystem.getClaimableCount === 'function') {
                const cnt = window.AccountSystem.getClaimableCount();
                badge.style.display = cnt > 0 ? 'flex' : 'none';
                badge.innerText = cnt > 99 ? '99+' : cnt;
            }
        }

        window.openAccountPanel = function(event) {
            if (event) event.stopPropagation();
            if (window.AccountSystem && typeof window.AccountSystem.openAccountRewardUI === 'function') {
                window.AccountSystem.openAccountRewardUI();
            } else {
                showToast('帳號系統載入中...', '#e67e22');
            }
        };

        window.openTowerPage = function() {
            const card = document.getElementById('tower-entry-card');
            if (card && card.classList.contains('locked')) {
                const acc = window.gameAccount || { level: 1 };
                const unlockLv = (window.globalData && window.globalData.account && window.globalData.account.towerUnlockLevel) || 10;
                showToast(`摘星樓需要帳號等級 Lv.${unlockLv} 才能進入\n目前 Lv.${acc.level || 1}`, '#e67e22');
                return;
            }
            window.location.href = 'tower.html';
        };

        function renderIndexLeftSidebar() {
            const sidebar = document.getElementById('left-sidebar');
            if (!sidebar) return;
            sidebar.innerHTML = '';

            const btnConfigs = mainConfig.buttons || {};

            Object.keys(btnConfigs).forEach(key => {
                const btnData = btnConfigs[key];
                if (!btnData.active) return;

                let callback = () => {};
                const act = btnData.action || key;
                const title = btnData.title || '';

                if (act === 'character' || key === 'character' || title.includes('角色') || title.includes('背包')) {
                    callback = () => {
                        if (typeof window.openCharacterUI === 'function') window.openCharacterUI();
                        else showToast('角色介面載入中...', '#e67e22');
                    };
                } else if (act === 'shop' || key === 'shop' || title.includes('坊市') || title.includes('商店')) {
                    callback = () => {
                        if (typeof window.openShopUI === 'function') window.openShopUI();
                        else showToast('坊市模組載入失敗...', '#e74c3c');
                    };
                } else if (act === 'story' || key === 'story' || title.includes('劇本') || title.includes('江湖')) {
                    callback = () => { window.location.href = 'story_menu.html'; };
                } else if (act === 'settings' || key === 'settings' || title.includes('設置')) {
                    callback = () => { showToast('目前可在配置中心進行詳細設置', '#3498db'); };
                } else {
                    callback = () => { showToast(btnData.title + ' 功能即將開放', '#e67e22'); };
                }

                const menuBtn = createMenuButton(btnData.icon || '📌', btnData.title || '選單', callback);
                sidebar.appendChild(menuBtn);
            });
        }

        function createMenuButton(icon, title, onClickCallback) {
            const btn = document.createElement('div');
            btn.className = 'menu-btn';
            btn.innerHTML = `<span>${icon}</span> <span>${title}</span>`;
            btn.onclick = onClickCallback;
            return btn;
        }

        function showToast(msg, color = '#2ecc71') {
            const toast = document.getElementById('global-toast');
            if(!toast) return;
            toast.innerText = msg;
            toast.style.background = color;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            resizeGameUI();

            const urlParams = new URLSearchParams(window.location.search);
            const isAutoFormation = urlParams.get('autoFormation');
            const fromParam = urlParams.get('from') || 'direct';
            const targetLevelIdx = localStorage.getItem('my_game_current_level_index');

            if (isAutoFormation === '1' && targetLevelIdx !== null) {
                // ★ 隐藏主界面 UI
                document.body.classList.add('in-battle');
                
                setTimeout(() => {
                    localStorage.removeItem('my_game_current_level_index');
                    if (window.game && window.game.scene) {
                        // ★ 传递 from 参数，以便战斗结束后能正确返回
                        window.game.scene.start('FormationScene', { 
                            levelIndex: parseInt(targetLevelIdx),
                            from: fromParam
                        });
                    }
                }, 600);
            } else {
                // 正常显示 UI
                document.body.classList.remove('in-battle');
                setTimeout(() => {
                    refreshAccountBadge();
                    refreshTowerEntry();
                }, 50);
                initIndexMainUI();
            }
        });
    </script>
</body>
</html>
