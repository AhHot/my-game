<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>武俠 - 戰前布陣與戰鬥</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background-color: #0f0f1a;
            font-family: "Microsoft YaHei", sans-serif;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }
        #game {
            width: 100vw; height: 100vh;
            touch-action: none;
        }
        #game canvas {
            display: block;
            touch-action: none !important;
        }

        /* ★ 美化：完全仿照圖二的深色暗黑風格按鈕 */
        #btn-pack {
            position: absolute;
            /* 定位會由 JS 動態計算，確保貼齊遊戲畫面的左下角 */
            padding: 8px 16px;
            background: rgba(26, 28, 41, 0.85); /* #1a1c29 帶透明度 */
            color: #ddd;
            font-size: 16px;
            border: 1px solid #3a3d4d;
            border-radius: 6px;
            cursor: pointer;
            z-index: 100;
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, border-color 0.2s;
            touch-action: manipulation;
            transform-origin: top left; /* 配合 JS 的縮放 */
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #btn-pack:active {
            background: rgba(40, 44, 60, 0.95);
            border-color: #555;
        }
        #btn-pack span {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="game"></div>
    
    <!-- 按鈕：完全照著圖二設計 -->
    <button id="btn-pack" onclick="window.safeOpenCharacterUI()">
    <span>👤</span> 角色与背包
</button>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <script src="core.js"></script>
    <script src="battle.js?v=15"></script>
    <script src="character_system.js?v=15"></script>
    <script src="tab_char.js?v=15"></script>

    <script>
        window.safeOpenCharacterUI = function() {
    try {
        if (typeof window.openCharacterUI === 'function') {
            window.openCharacterUI();
        } else {
            alert('角色與背包系統載入中或未初始化！');
        }
    } catch (e) {
        console.error('打開角色背包失敗：', e);
        alert('打開角色背包失敗：' + (e && e.message ? e.message : e));
    }
};
        setInterval(() => {
            document.querySelectorAll('.phaser-dom-element').forEach(el => el.remove());
        }, 500);

        const urlParams = new URLSearchParams(window.location.search);
        const targetLevelIndex = parseInt(urlParams.get('levelIndex') || '0');
        const navFrom = urlParams.get('from') || 'direct';
        const navBookId = urlParams.get('bookId') || 'book_01';
        const navNodeIndex = parseInt(urlParams.get('nodeIndex') || '0');

        window.game = new Phaser.Game({
            type: Phaser.AUTO,
            parent: 'game',
            backgroundColor: '#0f0f1a',
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH,
                width: 1280,
                height: 720
            },
            input: {
                activePointers: 3,
                touch: { capture: true }
            },
            scene: [FormationScene, BattleScene, ResultScene],
        });

        // ★★★ 核心修復：動態計算按鈕位置，確保它完美貼合遊戲畫面的左下角 ★★★
        function updateButtonPosition() {
            const btn = document.getElementById('btn-pack');
            if (!btn) return;

            const winW = window.innerWidth;
            const winH = window.innerHeight;
            
            // 計算 Phaser Scale.FIT 的縮放比例與邊距
            const scale = Math.min(winW / 1280, winH / 720);
            const scaledW = 1280 * scale;
            const scaledH = 720 * scale;
            const offsetX = (winW - scaledW) / 2;
            const offsetY = (winH - scaledH) / 2;

            // 將按鈕定位在畫布範圍內的左下角（距左 20px，距下 20px）
            btn.style.left = `${offsetX + 20 * scale}px`;
            btn.style.top = `${offsetY + scaledH - 55 * scale}px`; // 根據按鈕高度微調
            
            // 讓按鈕大小跟著遊戲畫面一起縮放，保持比例一致
            btn.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', updateButtonPosition);

        window.addEventListener('load', () => {
            updateButtonPosition(); // 初始定位

            if (window.game && window.game.scene) {
                setTimeout(() => {
                    window.game.scene.start('FormationScene', { 
                        levelIndex: targetLevelIndex,
                        from: navFrom,
                        bookId: navBookId,
                        nodeIndex: navNodeIndex
                    });
                }, 100);
            }

            // 包裹原本的背包方法，使其完美適應手機屏幕並防卡死
            if (window.openCharacterUI) {
                const originalOpen = window.openCharacterUI;
                window.openCharacterUI = function() {
                    try {
                        originalOpen();
                        const ui = document.getElementById('fullscreen-ui');
                        if (ui) {
                            const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
                            ui.style.position = 'fixed';
                            ui.style.transformOrigin = 'top left';
                            ui.style.transform = `scale(${scale})`;
                            ui.style.left = `${(window.innerWidth - 1280 * scale) / 2}px`;
                            ui.style.top = `${(window.innerHeight - 720 * scale) / 2}px`;
                            ui.style.zIndex = 9999;
                        }
                    } catch(e) {
                        console.error("打開背包UI報錯：", e);
                        if (window.game && window.game.scene) {
                            window.game.scene.getScenes(true).forEach(s => { if(s.input) s.input.enabled = true; });
                        }
                    }
                };
            }
        });

        let isSeamlessPatched = false;
        const patchInterval = setInterval(() => {
            if (typeof ResultScene !== 'undefined' && ResultScene.prototype && !isSeamlessPatched) {
                isSeamlessPatched = true;
                clearInterval(patchInterval);
                const originalCreate = ResultScene.prototype.create;
                ResultScene.prototype.create = function(data) {
                    if (originalCreate) originalCreate.call(this, data);
                    if (navFrom === 'story') {
                        const sceneData = data || (this.sys && this.sys.settings && this.sys.settings.data) || {};
                        const isWin = sceneData.win !== false && sceneData.victory !== false && sceneData.result !== 'lose';
                        if (isWin) {
                            const nextActionUrl = getNextStoryTargetUrl();
                            this.input.once('pointerdown', () => { window.location.href = nextActionUrl; });
                            if (this.confirmBtn) {
                                this.confirmBtn.off('pointerdown');
                                this.confirmBtn.once('pointerdown', () => { window.location.href = nextActionUrl; });
                            }
                        }
                    }
                };
            }
        }, 50);

        function getNextStoryTargetUrl() {
            try {
                let storyData = JSON.parse(localStorage.getItem('my_game_story_data')) || { books: [] };
                let book = storyData.books.find(b => b.id === navBookId);
                if (!book && storyData.books.length > 0) {
                    book = storyData.books.find(b => b.id.includes(navBookId) || navBookId.includes(b.id)) || storyData.books[0];
                }
                const realBookId = book ? book.id : navBookId;
                const nodes = book && book.nodes ? book.nodes : [];
                const nextNodeIndex = navNodeIndex + 1;
                let progressMap = JSON.parse(localStorage.getItem('my_game_chapter_progress')) || {};
                let currentMax = progressMap[realBookId] !== undefined ? progressMap[realBookId] : 0;
                if (nextNodeIndex > currentMax) {
                    progressMap[realBookId] = nextNodeIndex;
                    localStorage.setItem('my_game_chapter_progress', JSON.stringify(progressMap));
                }
                if (nextNodeIndex < nodes.length) {
                    return `dialogue_player.html?bookId=${realBookId}&nodeIndex=${nextNodeIndex}`;
                } else {
                    return `chapter_map.html?chapterId=${realBookId}`;
                }
            } catch(e) {
                console.error('解析下一個節點失敗：', e);
                return `chapter_map.html?chapterId=${navBookId}`;
            }
        }
    </script>
</body>
</html>
