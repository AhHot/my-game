<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>武俠 - 戰前布陣與戰鬥</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #0f0f1a; font-family: "Microsoft YaHei", sans-serif; position: relative; }
        
        /* 核心等比縮放容器 */
        #game-scale-container {
            position: absolute; top: 0; left: 0;
            width: 1280px; height: 720px;
            transform-origin: 0 0;
            z-index: 10;
        }
        #game { width: 1280px; height: 720px; position: absolute; inset: 0; }
        <div style="position: absolute; top: 20px; right: 30px; z-index: 999; display: flex; gap: 10px; align-items: center;">
    <!-- 原有的跳過戰鬥按鈕 (若有) -->
    <button onclick="skipBattle()" style="background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold;">⚡ 跳過戰鬥</button>
    
    <!-- 您的放棄戰鬥按鈕：排在跳過戰鬥的右邊 -->
    <button onclick="if(confirm('確定要放棄戰鬥並返回關卡地圖嗎？')) window.location.href='chapter_map.html';" style="background: rgba(192, 57, 43, 0.8); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold;">🚪 放棄戰鬥</button>
</div>
    </style>
</head>
<body>
    <div id="game-scale-container">
        <div id="game"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script src="data.js"></script>
    <script src="battle.js"></script>
    <script src="character_system.js"></script>
    <script src="tab_char.js"></script>

    <script>
        function resizeGameUI() {
            const container = document.getElementById('game-scale-container');
            const scaleX = window.innerWidth / 1280;
            const scaleY = window.innerHeight / 720;
            const scale = Math.min(scaleX, scaleY);
            
            container.style.transform = `scale(${scale})`;
            const scaledWidth = 1280 * scale;
            const scaledHeight = 720 * scale;
            container.style.left = (window.innerWidth - scaledWidth) / 2 + 'px';
            container.style.top = (window.innerHeight - scaledHeight) / 2 + 'px';
        }

        window.addEventListener('resize', resizeGameUI);

        const urlParams = new URLSearchParams(window.location.search);
        const targetLevelIndex = parseInt(urlParams.get('levelIndex') || '0');
        // 🌟 提取來源標記與劇情連動參數
        const navFrom = urlParams.get('from') || 'direct';
        const navBookId = urlParams.get('bookId') || '';
        const navNodeIndex = parseInt(urlParams.get('nodeIndex') || '0');

        window.game = new Phaser.Game({
            type: Phaser.AUTO,
            parent: 'game',
            backgroundColor: '#0f0f1a',
            scale: {
                mode: Phaser.Scale.NONE,
                width: 1280,
                height: 720
            },
            scene: [FormationScene, BattleScene, ResultScene],
        });

        window.addEventListener('load', () => {
            resizeGameUI();
            if (window.game && window.game.scene) {
                setTimeout(() => {
                    // 啟動 FormationScene 並帶入完整的導航參數包
                    window.game.scene.start('FormationScene', { 
                        levelIndex: targetLevelIndex,
                        from: navFrom,
                        bookId: navBookId,
                        nodeIndex: navNodeIndex
                    });
                }, 100);
            }
        });
    </script>
</body>
</html>
