<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>武俠 - 戰前布陣與戰鬥</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #0f0f1a; font-family: "Microsoft YaHei", sans-serif; position: relative; }
        
        #game-scale-container {
            position: absolute; top: 0; left: 0;
            width: 1280px; height: 720px;
            transform-origin: 0 0;
            z-index: 10;
        }
        #game { width: 1280px; height: 720px; position: absolute; inset: 0; }

        #error-screen {
            position: fixed; inset: 0; background: rgba(15, 15, 26, 0.95); color: #ff5252;
            z-index: 999999; padding: 40px; font-size: 16px; overflow: auto; display: none;
            word-break: break-all; white-space: pre-wrap; font-family: monospace;
        }
        #error-screen h2 { color: #ff5555; margin-bottom: 15px; font-size: 24px; }
    </style>
    <script>
        window.onerror = function(msg, url, line, col, error) {
            const errBox = document.getElementById('error-screen');
            if (errBox) {
                errBox.style.display = 'block';
                errBox.innerHTML = `<h2>🔥 遊戲捕捉到崩潰錯誤：</h2>` +
                    `<b>錯誤訊息：</b> ${msg}\n` +
                    `<b>發生檔案：</b> ${url}\n` +
                    `<b>程式行數：</b> 第 ${line} 行\n\n` +
                    `<b>詳細堆疊：</b>\n${error && error.stack ? error.stack : '無堆疊資訊'}`;
            }
            return true;
        };
    </script>
</head>
<body>
    <div id="error-screen"></div>

    <div id="game-scale-container">
        <div id="game"></div>
    </div>

    <!-- 依賴指令碼載入 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script src="data.js"></script>
    <script src="core.js"></script>
    <script src="battle.js"></script>
    <script src="character_system.js"></script>
    <script src="tab_char.js"></script>

    <script>
        function resizeGameUI() {
            const container = document.getElementById('game-scale-container');
            if (!container) return;
            const scaleX = window.innerWidth / 1280;
            const scaleY = window.innerHeight / 720;
            const scale = Math.min(scaleX, scaleY);
            
            container.style.transform = `scale(${scale})`;
            const scaledWidth = 1280 * scale;
            const scaledHeight = 720 * scale;
            container.style.left = (window.innerWidth - scaledWidth) / 2 + 'px';
            container.style.top = (window.innerHeight - scaledHeight) / 2 + 'px';
        }

        window.addEventListener('resize', resizeGameUI);

        const urlParams = new URLSearchParams(window.location.search);
        const targetLevelIndex = parseInt(urlParams.get('levelIndex') || '0');
        const navFrom = urlParams.get('from') || 'direct';
        const navBookId = urlParams.get('bookId') || 'book_01';
        const navNodeIndex = parseInt(urlParams.get('nodeIndex') || '0');

        window.addEventListener('load', () => {
            resizeGameUI();

            if (typeof Phaser === 'undefined') {
                throw new Error("Phaser 引擎未能成功載入！");
            }

            // 🛡️ 安全檢查場景是否存在，避免因為 battle.js 沒載入成功而直接報錯崩潰
            const safeFormation = typeof FormationScene !== 'undefined' ? FormationScene : class extends Phaser.Scene {
                create() { this.add.text(100, 100, "錯誤：battle.js 未能正確載入！", {color: "#f00", fontSize: "32px"}); }
            };
            const safeBattle = typeof BattleScene !== 'undefined' ? BattleScene : class extends Phaser.Scene {};
            const safeResult = typeof ResultScene !== 'undefined' ? ResultScene : class extends Phaser.Scene {};

            window.game = new Phaser.Game({
                type: Phaser.AUTO,
                parent: 'game',
                backgroundColor: '#0f0f1a',
                scale: {
                    mode: Phaser.Scale.NONE,
                    width: 1280,
                    height: 720
                },
                scene: [safeFormation, safeBattle, safeResult],
            });

            setTimeout(() => {
                if (window.game && window.game.scene) {
                    window.game.scene.start('FormationScene', { 
                        levelIndex: targetLevelIndex,
                        from: navFrom,
                        bookId: navBookId,
                        nodeIndex: navNodeIndex
                    });
                }
            }, 200);
        });

        // 無縫接軌原生結算
        let isSeamlessPatched = false;
        const patchInterval = setInterval(() => {
            if (typeof ResultScene !== 'undefined' && ResultScene.prototype && !isSeamlessPatched) {
                isSeamlessPatched = true;
                clearInterval(patchInterval);

                const originalCreate = ResultScene.prototype.create;
                ResultScene.prototype.create = function(data) {
                    if (originalCreate) originalCreate.call(this, data);

                    if (navFrom === 'story') {
                        const sceneData = data || (this.sys && this.sys.settings && this.sys.settings.data) || {};
                        const isWin = sceneData.type === 'victory' || sceneData.win !== false && sceneData.victory !== false && sceneData.result !== 'lose';

                        if (isWin) {
                            const nextActionUrl = getNextStoryTargetUrl();
                            this.input.once('pointerdown', () => {
                                window.location.href = nextActionUrl;
                            });

                            if (this.confirmBtn) {
                                this.confirmBtn.off('pointerdown'); 
                                this.confirmBtn.once('pointerdown', () => {
                                    window.location.href = nextActionUrl;
                                });
                            }
                        }
                    }
                };
            }
        }, 50);

        function getNextStoryTargetUrl() {
            try {
                let storyData = JSON.parse(localStorage.getItem('my_game_story_data')) || { books: [] };
                let book = storyData.books.find(b => b.id === navBookId);
                if (!book && storyData.books.length > 0) {
                    book = storyData.books.find(b => b.id.includes(navBookId) || navBookId.includes(b.id)) || storyData.books[0];
                }

                const realBookId = book ? book.id : navBookId;
                const nodes = book && book.nodes ? book.nodes : [];
                const nextNodeIndex = navNodeIndex + 1;

                let progressMap = JSON.parse(localStorage.getItem('my_game_chapter_progress')) || {};
                let currentMax = progressMap[realBookId] !== undefined ? progressMap[realBookId] : 0;
                if (nextNodeIndex > currentMax) {
                    progressMap[realBookId] = nextNodeIndex;
                    localStorage.setItem('my_game_chapter_progress', JSON.stringify(progressMap));
                }

                if (nextNodeIndex < nodes.length) {
                    return `dialogue_player.html?bookId=${realBookId}&nodeIndex=${nextNodeIndex}`;
                } else {
                    return `chapter_map.html?chapterId=${realBookId}`;
                }
            } catch(e) {
                console.error('解析下一個節點失敗：', e);
                return `chapter_map.html?chapterId=${navBookId}`;
            }
        }
    </script>
</body>
</html>
