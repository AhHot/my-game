<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>江湖歷程 - 戰棋戰鬥</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
        html, body { width: 100vw; height: 100vh; overflow: hidden; background-color: #0f0f1a; position: relative; }
        /* 嚴格對應 battle.js 所需的掛載點 */
        #game { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    </style>
    <!-- 1. 引入 Phaser 3 遊戲引擎 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
</head>
<body>
    <!-- 2. 遊戲畫面的掛載容器 -->
    <div id="game"></div>

    <!-- 3. 引入您原本功能完整的戰鬥邏輯主程式[cite: 4] -->
    <script src="battle.js"></script>
    
    <script>
        // 4. 自動接收從劇情傳過來的參數，直接進入布陣與戰鬥
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const levelIndex = parseInt(params.get('levelIndex')) || 0;
            const bookId = params.get('bookId') || '';
            const nodeIndex = parseInt(params.get('nodeIndex')) || 0;
            
            setTimeout(() => {
                if (window.game && window.game.scene) {
                    // 直接啟動布陣場景，並帶入來源標記為 'story'
                    window.game.scene.start('FormationScene', {
                        levelIndex: levelIndex,
                        from: 'story',
                        bookId: bookId,
                        nodeIndex: nodeIndex
                    });
                }
            }, 300);
        });
    </script>
</body>
</html>
