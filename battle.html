<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>武俠 - 戰前布陣與戰鬥</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #0f0f1a; font-family: "Microsoft YaHei", sans-serif; position: relative; }
        
        #game-scale-container {
            position: absolute; top: 0; left: 0;
            width: 1280px; height: 720px;
            transform-origin: 0 0;
            z-index: 10;
        }

        #game { width: 1280px; height: 720px; position: absolute; inset: 0; z-index: 0; }
    </style>
</head>
<body>
    <div id="game-scale-container">
        <div id="game"></div>
    </div>

    <!-- 引用必要腳本 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script src="data.js"></script>
    <script src="battle.js"></script>
    <script src="character_system.js"></script>

    <script>
        function resizeGameUI() {
            const container = document.getElementById('game-scale-container');
            if (!container) return;
            const scaleX = window.innerWidth / 1280;
            const scaleY = window.innerHeight / 720;
            const scale = Math.min(scaleX, scaleY);
            
            container.style.transform = `scale(${scale})`;
            container.style.left = (window.innerWidth - 1280 * scale) / 2 + 'px';
            container.style.top = (window.innerHeight - 720 * scale) / 2 + 'px';
        }

        window.addEventListener('resize', resizeGameUI);

        window.addEventListener('DOMContentLoaded', () => {
            resizeGameUI();

            // 1. 解析網址帶過來的 levelIndex
            const urlParams = new URLSearchParams(window.location.search);
            let levelIndex = urlParams.get('levelIndex');
            if (levelIndex === null || levelIndex === undefined) {
                levelIndex = 0;
            } else {
                levelIndex = parseInt(levelIndex);
            }

            // 2. 確保 Phaser 初始化後，自動啟動布陣場景 FormationScene
            setTimeout(() => {
                if (window.game && window.game.scene) {
                    console.log("成功啟動布陣畫面，關卡索引：", levelIndex);
                    window.game.scene.start('FormationScene', { levelIndex: levelIndex });
                } else {
                    console.error("Phaser 遊戲實例 (window.game) 尚未建立！");
                }
            }, 400);
        });
    </script>
</body>
</html>
