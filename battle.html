<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>武俠 - 戰前布陣與戰鬥</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #0f0f1a; font-family: "Microsoft YaHei", sans-serif; position: relative; }
        
        #game-scale-container {
            position: absolute; top: 0; left: 0;
            width: 1280px; height: 720px;
            transform-origin: 0 0;
            z-index: 10;
        }
        #game { width: 1280px; height: 720px; position: absolute; inset: 0; }

        /* 🌟 勝利後的劇情推進覆蓋按鈕樣式 */
        #story-victory-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9);
            display: none; justify-content: center; align-items: center; z-index: 999999;
            backdrop-filter: blur(10px); animation: fadeIn 0.3s ease;
        }
        .victory-card {
            background: #161a23; border: 2px solid #f1c40f; border-radius: 12px;
            padding: 40px 60px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            color: #fff; max-width: 500px; width: 90%;
        }
        .victory-title { font-size: 32px; color: #f1c40f; font-weight: bold; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(241,196,15,0.4); }
        .victory-desc { font-size: 16px; color: #aaa; margin-bottom: 30px; }
        .victory-btn {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%); color: #fff;
            border: none; padding: 14px 35px; border-radius: 8px; font-size: 18px; font-weight: bold;
            cursor: pointer; box-shadow: 0 5px 20px rgba(46,204,113,0.4); transition: transform 0.2s;
        }
        .victory-btn:hover { transform: translateY(-2px); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="game-scale-container">
        <div id="game"></div>
    </div>

    <!-- 🌟 勝利接續劇情 HTML 互動層 -->
    <div id="story-victory-overlay">
        <div class="victory-card">
            <div class="victory-title">⚔️ 戰鬥勝利</div>
            <div class="victory-desc" id="victory-tip-text">強敵已被擊潰，江湖風雲再起……</div>
            <button class="victory-btn" id="story-continue-btn" onclick="proceedStoryWorkflow()">▶ 繼續劇情</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script src="data.js"></script>
    <script src="battle.js"></script>
    <script src="character_system.js"></script>
    <script src="tab_char.js"></script>

    <script>
        function resizeGameUI() {
            const container = document.getElementById('game-scale-container');
            const scaleX = window.innerWidth / 1280;
            const scaleY = window.innerHeight / 720;
            const scale = Math.min(scaleX, scaleY);
            
            container.style.transform = `scale(${scale})`;
            const scaledWidth = 1280 * scale;
            const scaledHeight = 720 * scale;
            container.style.left = (window.innerWidth - scaledWidth) / 2 + 'px';
            container.style.top = (window.innerHeight - scaledHeight) / 2 + 'px';
        }

        window.addEventListener('resize', resizeGameUI);

        const urlParams = new URLSearchParams(window.location.search);
        const targetLevelIndex = parseInt(urlParams.get('levelIndex') || '0');
        const navFrom = urlParams.get('from') || 'direct';
        const navBookId = urlParams.get('bookId') || 'book_01';
        const navNodeIndex = parseInt(urlParams.get('nodeIndex') || '0');

        let globalNextActionUrl = '';

        // 🌟 如果是從劇情進來的，我們自定義一個「專屬劇情結算場景」來徹底取代原版的 ResultScene 循環
        let activeScenesList = [FormationScene, BattleScene, ResultScene];
        
        if (navFrom === 'story') {
            class StoryVictoryScene extends Phaser.Scene {
                constructor() { super('StoryVictoryScene'); }
                create() {
                    // 關閉整個 Phaser 畫布容器
                    document.getElementById('game-scale-container').style.display = 'none';

                    try {
                        let storyData = JSON.parse(localStorage.getItem('my_game_story_data')) || { books: [] };
                        let book = storyData.books.find(b => b.id === navBookId);
                        if (!book && storyData.books.length > 0) {
                            book = storyData.books.find(b => b.id.includes(navBookId) || navBookId.includes(b.id)) || storyData.books[0];
                        }

                        const realBookId = book ? book.id : navBookId;
                        const nodes = book && book.nodes ? book.nodes : [];
                        const nextNodeIndex = navNodeIndex + 1;

                        // 更新通關進度
                        let progressMap = JSON.parse(localStorage.getItem('my_game_chapter_progress')) || {};
                        let currentMax = progressMap[realBookId] !== undefined ? progressMap[realBookId] : 0;
                        if (nextNodeIndex > currentMax) {
                            progressMap[realBookId] = nextNodeIndex;
                            localStorage.setItem('my_game_chapter_progress', JSON.stringify(progressMap));
                        }

                        const hasNextNode = nextNodeIndex < nodes.length;

                        if (hasNextNode) {
                            globalNextActionUrl = `dialogue_player.html?bookId=${realBookId}&nodeIndex=${nextNodeIndex}`;
                            document.getElementById('victory-tip-text').innerText = '戰鬥大勝！點擊下方按鈕繼續探索劇情。';
                            document.getElementById('story-continue-btn').innerText = '▶ 繼續劇情';
                        } else {
                            globalNextActionUrl = `chapter_map.html?chapterId=${realBookId}`;
                            document.getElementById('victory-tip-text').innerText = '恭喜通關本章所有節點！';
                            document.getElementById('story-continue-btn').innerText = '🗺️ 返回章節畫面';
                        }

                        document.getElementById('story-victory-overlay').style.display = 'flex';
                    } catch(e) {
                        globalNextActionUrl = `chapter_map.html?chapterId=${navBookId}`;
                        document.getElementById('story-victory-overlay').style.display = 'flex';
                    }
                }
            }
            // 替換結算場景
            activeScenesList = [FormationScene, BattleScene, StoryVictoryScene];
        }

        window.game = new Phaser.Game({
            type: Phaser.AUTO,
            parent: 'game',
            backgroundColor: '#0f0f1a',
            scale: {
                mode: Phaser.Scale.NONE,
                width: 1280,
                height: 720
            },
            scene: activeScenesList,
        });

        window.addEventListener('load', () => {
            resizeGameUI();
            if (window.game && window.game.scene) {
                setTimeout(() => {
                    window.game.scene.start('FormationScene', { 
                        levelIndex: targetLevelIndex,
                        from: navFrom,
                        bookId: navBookId,
                        nodeIndex: navNodeIndex
                    });
                }, 100);
            }

            // 🌟 額外保險：如果戰鬥勝利，強制將 BattleScene 切換到我們的 StoryVictoryScene，徹底切斷原版循環
            if (navFrom === 'story') {
                const checkInterval = setInterval(() => {
                    if (window.game && window.game.scene) {
                        const activeScenes = window.game.scene.getScenes(true);
                        // 檢查是否有原版的 ResultScene 試圖啟動，如果有立刻攔截
                        const resScene = activeScenes.find(s => s.sys && s.sys.key === 'ResultScene');
                        if (resScene) {
                            clearInterval(checkInterval);
                            window.game.scene.stop('ResultScene');
                            window.game.scene.start('StoryVictoryScene');
                        }
                    }
                }, 100);
            }
        });

        function proceedStoryWorkflow() {
            if (globalNextActionUrl) {
                window.location.href = globalNextActionUrl;
            } else {
                window.location.href = `chapter_map.html?chapterId=${navBookId}`;
            }
        }
    </script>
</body>
</html>
