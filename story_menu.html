<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>江湖歷程 - 劇本選擇</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
        html, body { width: 100vw; height: 100vh; overflow: hidden; background-color: #08090c; color: #fff; position: relative; }

        .page-bg { 
            position: absolute; inset: 0; width: 100%; height: 100%; 
            background-size: cover; background-position: center; background-repeat: no-repeat;
            filter: brightness(0.4); z-index: 1; 
        }

        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 2; }

        #story-canvas-container {
            position: absolute; top: 0; left: 0; width: 1280px; height: 720px;
            transform-origin: 0 0; z-index: 10; overflow: hidden;
        }

        .dyn-top-nav { position: absolute; display: flex; justify-content: flex-start; align-items: center; padding: 0 30px; background: rgba(15, 17, 23, 0.9); border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 20; }
        .nav-btn { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.15); color: #ccc; padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .nav-btn:hover { background: rgba(54, 153, 255, 0.25); border-color: #3699ff; color: #fff; }

        .dyn-left-tab { position: absolute; display: flex; flex-direction: column; gap: 10px; z-index: 20; }
        .tab-item { padding: 12px 18px; background: rgba(255,255,255,0.05); border-left: 4px solid transparent; color: #888; font-weight: bold; font-size: 14px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .tab-item.active { background: rgba(0, 255, 255, 0.2); border-left-color: #00ffff; color: #fff; }

        .dyn-right-slider { position: absolute; display: flex; align-items: center; overflow: hidden; z-index: 20; cursor: grab; }
        .dyn-right-slider:active { cursor: grabbing; }

        .dyn-bottom-nav { position: absolute; background: rgba(10, 11, 15, 0.95); border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: center; align-items: center; gap: 30px; z-index: 20; }
        .bot-btn { color: #718096; font-size: 14px; font-weight: bold; cursor: pointer; }
        .bot-btn.active { color: #3699ff; }
    </style>
</head>
<body>

    <div class="page-bg" id="page-bg-img"></div>
    <div class="bg-grid"></div>

    <div id="story-canvas-container"></div>

    <script>
        function autoScaleUI() {
            const container = document.getElementById('story-canvas-container');
            if (!container) return;
            const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
            container.style.transform = `scale(${scale})`;
            container.style.left = (window.innerWidth - 1280 * scale) / 2 + 'px';
            container.style.top = (window.innerHeight - 720 * scale) / 2 + 'px';
        }

        window.addEventListener('resize', autoScaleUI);

        function renderStoryMenu() {
            autoScaleUI();
            
            let config = null;
            try {
                config = JSON.parse(localStorage.getItem('my_game_ui_full_config'));
            } catch(e) { config = null; }

            const defaultConfig = {
                bgUrl: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1600&auto=format&fit=crop',
                topNavLeftText: '◀ 返回大廳',
                layout: {
                    topNav: { x: 0, y: 0, w: 1280, h: 60, visible: true, name: '頂部欄' },
                    leftTab: { x: 30, y: 80, w: 250, h: 560, visible: true, name: '左側 Tab 鏈' },
                    rightSlider: { x: 300, y: 100, w: 940, h: 520, visible: true, name: '右側關卡卡片區' },
                    bottomNav: { x: 0, y: 660, w: 1280, h: 60, visible: true, name: '底部功能列' }
                },
                categories: [
                    { id: 'main', name: '本篇主線' },
                    { id: 'sub', name: '外傳江湖' }
                ],
                chapters: { 
                    main: [
                        { id: 'm1', title: '第一章：青城山變', progress: '0/7', cover: 'https://images.unsplash.com/photo-1542224566-6e85f2e6772f?q=80&w=1000&auto=format&fit=crop', w: 420, h: 280, targetMapId: 'm1' },
                        { id: 'm2', title: '第二章：雪夜尋仇', progress: '0/8', cover: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop', w: 420, h: 280, targetMapId: 'm2' }
                    ],
                    sub: []
                },
                bottomButtons: ['戰鬥畫面', '本篇', '研修', '資源', '挑戰'],
                activeTabId: 'main'
            };

            if (!config) config = defaultConfig;
            if (!config.layout) config.layout = defaultConfig.layout;
            if (!config.categories) config.categories = defaultConfig.categories;
            if (!config.chapters) config.chapters = defaultConfig.chapters;

            if (config.bgUrl) {
                document.getElementById('page-bg-img').style.backgroundImage = `url('${config.bgUrl}')`;
            }

            const container = document.getElementById('story-canvas-container');
            container.innerHTML = '';

            let currentCatId = config.activeTabId || (config.categories[0] ? config.categories[0].id : 'main');
            const layout = config.layout;

            Object.keys(layout).forEach(key => {
                const comp = layout[key];
                if (!comp || !comp.visible) return;

                const el = document.createElement('div');
                el.style.cssText = `position: absolute; left: ${comp.x}px; top: ${comp.y}px; width: ${comp.w}px; height: ${comp.h}px; z-index: 20;`;

                if (key === 'topNav') {
                    el.className = 'dyn-top-nav';
                    el.style.width = comp.w + 'px'; el.style.height = comp.h + 'px';
                    el.innerHTML = `<div><button class="nav-btn" onclick="window.location.href='index.html'">${config.topNavLeftText || '◀ 返回大廳'}</button></div>`;
                } else if (key === 'leftTab') {
                    el.className = 'dyn-left-tab';
                    (config.categories || []).forEach(cat => {
                        const item = document.createElement('div');
                        item.className = 'tab-item' + (cat.id === currentCatId ? ' active' : '');
                        item.innerHTML = `<span>● ${cat.name}</span> ${cat.id === currentCatId ? '<span>◆</span>' : ''}`;
                        item.onclick = () => { 
                            config.activeTabId = cat.id; 
                            localStorage.setItem('my_game_ui_full_config', JSON.stringify(config)); 
                            renderStoryMenu(); 
                        };
                        el.appendChild(item);
                    });
                } else if (key === 'rightSlider') {
                    el.className = 'dyn-right-slider';
                    el.style.position = 'relative';

                    const chaptersData = config.chapters || {};
                    const chapList = chaptersData[currentCatId] || [];

                    if (chapList.length === 0) {
                        el.innerHTML = `<div style="color:#aaa; font-size:16px; margin:auto; background:rgba(0,0,0,0.6); padding:10px 20px; border-radius:6px;">當前分類尚無章節</div>`;
                    } else {
                        const stackWrapper = document.createElement('div');
                        stackWrapper.style.cssText = "position:relative; width:100%; height:100%; display:flex; align-items:center; perspective: 1000px;";
                        
                        let activeIdx = 0;
                        let startX = 0;
                        let isDragging = false;

                        const renderStack = () => {
                            stackWrapper.innerHTML = '';
                            chapList.forEach((chap, idx) => {
                                const cardW = chap.w || 420;
                                const cardH = chap.h || 280;
                                
                                const card = document.createElement('div');
                                
                                let offset = idx - activeIdx;
                                let zIndex = 10 - Math.abs(offset);
                                let scale = offset === 0 ? 1 : 0.85;
                                let brightness = offset === 0 ? 1 : 0.4; // 後方自動變暗
                                let translateX = offset * 180; // 露出三分之一的偏移量
                                
                                card.style.cssText = `
                                    position: absolute; left: 50%; top: 50%;
                                    width: ${cardW}px; height: ${cardH}px;
                                    transform: translate(calc(-50% + ${translateX}px), -50%) scale(${scale});
                                    filter: brightness(${brightness});
                                    z-index: ${zIndex};
                                    transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), filter 0.3s ease;
                                    border-radius: 12px; overflow: hidden;
                                    background: url('${chap.cover || ''}') center/cover no-repeat;
                                    cursor: pointer; border: 2px solid ${offset === 0 ? '#00ffff' : 'rgba(255,255,255,0.2)'};
                                    box-shadow: 0 15px 35px rgba(0,0,0,0.8);
                                    display: flex; align-items: flex-end; padding: 20px;
                                `;

                                card.onclick = (e) => {
                                    if (offset === 0) {
                                        // 點擊最前方卡片時，進入對應地圖
                                        const targetMap = chap.targetMapId || chap.id || 'book_01';
                                        window.location.href = `chapter_map.html?chapterId=${targetMap}`;
                                    } else {
                                        // 點擊後方卡片時，滑動切換至該張
                                        activeIdx = idx;
                                        renderStack();
                                    }
                                };

                                card.innerHTML = `
                                    <div style="position:absolute; inset:0; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);"></div>
                                    <div style="position:relative; z-index:2; display:flex; justify-content:space-between; width:100%; align-items:flex-end;">
                                        <div style="color:#fff; font-size:22px; font-weight:bold; text-shadow:0 2px 5px rgba(0,0,0,0.8);">${chap.title || '未命名章節'}</div>
                                        <div style="background:rgba(0,0,0,0.8); color:#00ffff; padding:4px 10px; border-radius:4px; font-size:12px; border:1px solid rgba(0,255,255,0.3);">通關: ${chap.progress || '0/0'}</div>
                                    </div>
                                `;
                                stackWrapper.appendChild(card);
                            });
                        };

                        renderStack();

                        // 🌟 滑鼠或手指拖動滑動切換卡片互動邏輯
                        el.onpointerdown = (e) => {
                            startX = e.clientX;
                            isDragging = true;
                        };

                        window.onpointerup = (e) => {
                            if (!isDragging) return;
                            isDragging = false;
                            let diff = e.clientX - startX;
                            if (diff > 50 && activeIdx > 0) {
                                activeIdx--; // 往右拖動 -> 上一張
                                renderStack();
                            } else if (diff < -50 && activeIdx < chapList.length - 1) {
                                activeIdx++; // 往左拖動 -> 下一張
                                renderStack();
                            }
                        };

                        el.appendChild(stackWrapper);
                    }
                } else if (key === 'bottomNav') {
                    el.className = 'dyn-bottom-nav';
                    el.style.width = comp.w + 'px'; el.style.height = comp.h + 'px';
                    (config.bottomButtons || []).forEach((bName, idx) => {
                        const b = document.createElement('div');
                        b.className = 'bot-btn' + (idx === 1 ? ' active' : '');
                        b.innerText = bName;
                        el.appendChild(b);
                    });
                } else {
                    el.style.background = 'rgba(255, 165, 0, 0.15)';
                    el.style.border = '1px dashed orange';
                    el.style.display = 'flex'; el.style.justifyContent = 'center'; el.style.alignItems = 'center';
                    el.style.color = '#ffaa00'; el.style.fontWeight = 'bold'; el.style.borderRadius = '6px';
                    el.innerHTML = `<span>${comp.name}</span>`;
                }

                container.appendChild(el);
            });
        }

        window.onload = renderStoryMenu;
    </script>
</body>
</html>
