<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>江湖歷程 - 劇本選擇</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
        html, body { width: 100vw; height: 100vh; overflow: hidden; background-color: #08090c; color: #fff; position: relative; }

        .page-bg { position: absolute; inset: 0; background: radial-gradient(circle at 70% 30%, #161c28 0%, #08090c 80%); z-index: 1; }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 2; }

        /* 1280x720 自適應容器 */
        #story-canvas-container {
            position: absolute; top: 0; left: 0; width: 1280px; height: 720px;
            transform-origin: 0 0; z-index: 10; overflow: hidden;
        }

        .dyn-top-nav { position: absolute; display: flex; justify-content: space-between; align-items: center; padding: 0 30px; background: rgba(15, 17, 23, 0.9); border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 20; }
        .nav-btn { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.15); color: #ccc; padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .nav-btn:hover { background: rgba(54, 153, 255, 0.25); border-color: #3699ff; color: #fff; }

        .dyn-left-tab { position: absolute; display: flex; flex-direction: column; gap: 10px; z-index: 20; }
        .tab-item { padding: 12px 18px; background: rgba(255,255,255,0.05); border-left: 4px solid transparent; color: #888; font-weight: bold; font-size: 14px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .tab-item.active { background: rgba(0, 255, 255, 0.2); border-left-color: #00ffff; color: #fff; }

        .dyn-right-slider { position: absolute; display: flex; gap: 20px; overflow-x: auto; align-items: center; padding: 10px; z-index: 20; }
        .dyn-right-slider::-webkit-scrollbar { height: 6px; }
        .dyn-right-slider::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

        .chapter-card { width: 500px; height: 320px; flex-shrink: 0; border-radius: 8px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 10px 25px rgba(0,0,0,0.6); display: flex; align-items: flex-end; padding: 20px; cursor: pointer; transition: transform 0.2s; }
        .chapter-card:hover { transform: translateY(-4px); border-color: #00ffff; }

        .dyn-bottom-nav { position: absolute; background: rgba(10, 11, 15, 0.95); border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: center; align-items: center; gap: 30px; z-index: 20; }
        .bot-btn { color: #718096; font-size: 14px; font-weight: bold; cursor: pointer; }
        .bot-btn.active { color: #3699ff; }
    </style>
</head>
<body>

    <div class="page-bg"></div>
    <div class="bg-grid"></div>

    <div id="story-canvas-container">
        <div id="top-nav-box" class="dyn-top-nav"></div>
        <div id="left-tab-box" class="dyn-left-tab"></div>
        <div id="right-slider-box" class="dyn-right-slider"></div>
        <div id="bottom-nav-box" class="dyn-bottom-nav"></div>
    </div>

    <script>
        function autoScaleUI() {
            const container = document.getElementById('story-canvas-container');
            const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
            container.style.transform = `scale(${scale})`;
            container.style.left = (window.innerWidth - 1280 * scale) / 2 + 'px';
            container.style.top = (window.innerHeight - 720 * scale) / 2 + 'px';
        }

        window.addEventListener('resize', autoScaleUI);

        function renderStoryMenu() {
            autoScaleUI();
            const config = JSON.parse(localStorage.getItem('my_game_ui_full_config')) || {
                layout: {
                    topNav: { x: 0, y: 0, w: 1280, h: 60, visible: true },
                    leftTab: { x: 30, y: 80, w: 250, h: 560, visible: true },
                    rightSlider: { x: 300, y: 100, w: 940, h: 520, visible: true },
                    bottomNav: { x: 0, y: 660, w: 1280, h: 60, visible: true }
                },
                categories: [{ id: 'main', name: '本篇主線' }],
                chapters: { main: [{ id: 'm1', title: '第一章：青城山變', progress: '0/7', cover: 'https://images.unsplash.com/photo-1542224566-6e85f2e6772f?q=80&w=1000&auto=format&fit=crop' }] },
                bottomButtons: ['戰鬥畫面', '本篇', '研修', '資源', '挑戰'],
                activeTabId: 'main'
            };

            let currentCatId = config.activeTabId || (config.categories[0] ? config.categories[0].id : 'main');

            // 1. 頂部欄
            const topBox = document.getElementById('top-nav-box');
            topBox.style.cssText = `left:${config.layout.topNav.x}px; top:${config.layout.topNav.y}px; width:${config.layout.topNav.w}px; height:${config.layout.topNav.h}px;`;
            topBox.innerHTML = `<div><button class="nav-btn" onclick="window.location.href='index.html'">◀ 返回大廳</button></div><div><button class="nav-btn">俠客傳記 ▶▶</button></div>`;

            // 2. 左側 Tab
            const leftBox = document.getElementById('left-tab-box');
            leftBox.style.cssText = `left:${config.layout.leftTab.x}px; top:${config.layout.leftTab.y}px; width:${config.layout.leftTab.w}px; height:${config.layout.leftTab.h}px;`;
            leftBox.innerHTML = '';
            config.categories.forEach(cat => {
                const item = document.createElement('div');
                item.className = 'tab-item' + (cat.id === currentCatId ? ' active' : '');
                item.innerHTML = `<span>● ${cat.name}</span> ${cat.id === currentCatId ? '<span>◆</span>' : ''}`;
                item.onclick = () => { config.activeTabId = cat.id; renderStoryMenu(); };
                leftBox.appendChild(item);
            });

            // 3. 右側卡片
            const rightBox = document.getElementById('right-slider-box');
            rightBox.style.cssText = `left:${config.layout.rightSlider.x}px; top:${config.layout.rightSlider.y}px; width:${config.layout.rightSlider.w}px; height:${config.layout.rightSlider.h}px;`;
            rightBox.innerHTML = '';
            const chapList = config.chapters[currentCatId] || [];
            chapList.forEach(chap => {
                const card = document.createElement('div');
                card.className = 'chapter-card';
                card.style.backgroundImage = `url('${chap.cover}')`;
                card.onclick = () => alert(`🚀 準備進入【${chap.title}】畫布！`);
                card.innerHTML = `
                    <div style="position:absolute; inset:0; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);"></div>
                    <div style="position:relative; z-index:2; display:flex; justify-content:space-between; width:100%; align-items:flex-end;">
                        <div style="color:#fff; font-size:22px; font-weight:bold;">${chap.title}</div>
                        <div style="background:rgba(0,0,0,0.7); color:#00ffff; padding:4px 10px; border-radius:4px; font-size:12px;">通關: ${chap.progress}</div>
                    </div>
                `;
                rightBox.appendChild(card);
            });

            // 4. 底部按鈕
            const botBox = document.getElementById('bottom-nav-box');
            botBox.style.cssText = `left:${config.layout.bottomNav.x}px; top:${config.layout.bottomNav.y}px; width:${config.layout.bottomNav.w}px; height:${config.layout.bottomNav.h}px;`;
            botBox.innerHTML = '';
            config.bottomButtons.forEach((bName, idx) => {
                const b = document.createElement('div');
                b.className = 'bot-btn' + (idx === 1 ? ' active' : '');
                b.innerText = bName;
                botBox.appendChild(b);
            });
        }

        window.onload = renderStoryMenu;
    </script>
</body>
</html>
