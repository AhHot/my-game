<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏配置中心</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #1a1a2e; color: #fff; padding: 15px; padding-bottom: 120px; }
    h1 { font-size: 24px; text-align: center; margin-bottom: 20px; color: #f1c40f; }
    .tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 15px; }
    .tab { flex: 1; min-width: 20%; padding: 10px; text-align: center; background: #16213e; border-radius: 6px; cursor: pointer; border: 1px solid #0f3460; font-size: 13px;}
    .tab.active { background: #3498db; border-color: #3498db; font-weight: bold; }
    .search-bar { display: flex; gap: 10px; margin-bottom: 15px; }
    .search-bar input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #0f0f1a; color: #fff; font-size: 14px; }
    .sub-tabs { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
    .sub-tab { flex: 1; min-width: 18%; padding: 8px; text-align: center; background: #0f3460; border-radius: 4px; cursor: pointer; font-size: 12px; border: 1px solid transparent; }
    .sub-tab.active { background: #e74c3c; border-color: #e74c3c; font-weight: bold; }
    .card { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .card-header h3 { color: #3498db; }
    .btn-del { background: #e74c3c; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; font-size: 14px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .form-item { display: flex; flex-direction: column; }
    .form-item.full { grid-column: span 2; }
    .form-item label { font-size: 11px; color: #aaa; margin-bottom: 4px; }
    .form-item input, .form-item select { background: #0f0f1a; color: #fff; border: 1px solid #444; padding: 6px; border-radius: 4px; font-size: 13px; width: 100%; }
    .sub-title { color: #f1c40f; font-size: 14px; margin-top: 15px; margin-bottom: 5px; font-weight: bold; border-bottom: 1px dashed #444; padding-bottom: 5px; grid-column: span 2;}
    .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #16213e; padding: 15px; border-top: 1px solid #333; display: flex; gap: 10px; z-index: 100; }
    .btn { flex: 1; padding: 15px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; color: #fff; text-align: center; text-decoration: none;}
    .btn-play { background: #2ecc71; }
    .btn-reset { background: #e74c3c; }
  </style>
</head>
<body>

  <h1>⚙️ 配置中心 (v8.0 状态与技能大升级)</h1>
  
  <div class="tabs">
    <div class="tab active" onclick="switchTab('char')">👾 角色</div>
    <div class="tab" onclick="switchTab('skill')">⚔️ 技能</div>
    <div class="tab" onclick="switchTab('status')">🌊 状态</div>
    <div class="tab" onclick="switchTab('item')">🎒 物品</div>
    <div class="tab" onclick="switchTab('level')">🗺️ 关卡</div>
  </div>

  <div id="char-section">
    <div class="search-bar"><input type="text" id="search-char" placeholder="🔍 搜索角色..." oninput="render()"></div>
    <div class="sub-tabs">
      <div class="sub-tab active" id="tab-char-player" onclick="switchSubTab('char', 'player')">我方</div>
      <div class="sub-tab" id="tab-char-enemy" onclick="switchSubTab('char', 'enemy')">敌方</div>
    </div>
    <div id="char-list"></div>
    <button class="btn" style="background:#3498db; width:100%; margin-bottom:20px;" onclick="addChar()">➕ 新增角色</button>
  </div>

  <div id="skill-section" style="display:none;">
    <div class="search-bar"><input type="text" id="search-skill" placeholder="🔍 搜索技能..." oninput="render()"></div>
    <div class="sub-tabs">
      <div class="sub-tab active" id="tab-skill-active" onclick="switchSubTab('skill', 'active')">主动/治疗</div>
      <div class="sub-tab" id="tab-skill-followup" onclick="switchSubTab('skill', 'followup')">追打</div>
      <div class="sub-tab" id="tab-skill-passive" onclick="switchSubTab('skill', 'passive')">被动</div>
    </div>
    <div id="skill-list"></div>
    <button class="btn" style="background:#3498db; width:100%; margin-bottom:20px;" onclick="addSkill()">➕ 新增技能</button>
  </div>

  <div id="status-section" style="display:none;">
    <div class="search-bar"><input type="text" id="search-status" placeholder="🔍 搜索状态..." oninput="render()"></div>
    <div id="status-list"></div>
    <button class="btn" style="background:#3498db; width:100%; margin-bottom:20px;" onclick="addStatus()">➕ 新增状态</button>
  </div>

  <div id="item-section" style="display:none;">
    <div class="search-bar"><input type="text" id="search-item" placeholder="🔍 搜索物品..." oninput="render()"></div>
    <div class="sub-tabs">
      <div class="sub-tab active" id="tab-item-weapon" onclick="switchSubTab('item', 'weapon')">武器</div>
      <div class="sub-tab" id="tab-item-armor" onclick="switchSubTab('item', 'armor')">防具</div>
      <div class="sub-tab" id="tab-item-accessory" onclick="switchSubTab('item', 'accessory')">饰品</div>
    </div>
    <div id="item-list"></div>
    <button class="btn" style="background:#3498db; width:100%; margin-bottom:20px;" onclick="addItem()">➕ 新增物品模板</button>
    <button class="btn" style="background:#e67e22; width:100%; margin-bottom:20px;" onclick="grantItem()">🎁 发放随机实例物品</button>
  </div>

  <div id="level-section" style="display:none;">
    <div id="level-list"></div>
    <button class="btn" style="background:#3498db; width:100%; margin-bottom:20px;" onclick="addLevel()">➕ 新增关卡</button>
  </div>

  <div class="bottom-bar">
    <a href="index.html?t=9999" class="btn btn-play" onclick="window.location.href='index.html?t='+Date.now(); return false;">🚀 保存并返回游戏</a>
    <button class="btn btn-reset" onclick="resetData()">⚠️ 重置数据</button>
  </div>

  <script>
    const DEFAULT_CHARS = [
      { id: 'p_warrior', name: '战士', side: 'player', emoji: '⚔️', element: 'fire', maxHp: 3000, atk: 400, def: 200, speed: 8, critRate: 0.15, critDmg: 1.5, maxMp: 60, mpPerAttack: 15, hitRate: 0.1, dodgeRate: 0.05, critResist: 0.05, dmgIncrease: 0.1, dmgReduction: 0.05, dmgTakenIncrease: 0, trueDmg: 0, lifesteal: 0, gridX: -1, gridY: -1, skillSlots: { normal: 'skill_slash', skill: 'skill_fireball', ultimate: '', followup: 'skill_follow_1', learned: '' }, equipment: { weapon: '', armor: '', accessory: '' } },
      { id: 'p_priest', name: '牧师', side: 'player', emoji: '✨', element: 'light', maxHp: 2500, atk: 300, def: 100, speed: 9, critRate: 0.05, critDmg: 1.5, maxMp: 100, mpPerAttack: 20, hitRate: 0, dodgeRate: 0.1, critResist: 0.1, dmgIncrease: 0, dmgReduction: 0.1, dmgTakenIncrease: 0, trueDmg: 0, lifesteal: 0, gridX: -1, gridY: -1, skillSlots: { normal: 'skill_slash', skill: 'skill_heal', ultimate: '', followup: '', learned: '' }, equipment: { weapon: '', armor: '', accessory: '' } },
      { id: 'e_skeleton', name: '骷髅兵', side: 'enemy', emoji: '💀', element: 'dark', maxHp: 2000, atk: 200, def: 200, speed: 7, critRate: 0.05, critDmg: 1.4, maxMp: 40, mpPerAttack: 10, hitRate: 0, dodgeRate: 0.05, critResist: 0, dmgIncrease: 0, dmgReduction: 0, dmgTakenIncrease: 0, trueDmg: 0, lifesteal: 0, gridX: 0, gridY: 0, skillSlots: { normal: 'skill_slash', skill: '', ultimate: '', followup: '', learned: '' }, equipment: { weapon: '', armor: '', accessory: '' } }
    ];

    const DEFAULT_SKILLS = [
      { id: 'skill_slash', name: '斩击', type: 'normal', element: 'fire', targetSide: 'enemy', targetRule: 'frontRow', multiplier: 1.0, healMultiplier: 0, shieldMultiplier: 0, mpCost: 0, cooldown: 0, statusId: '', statusChance: 0, comboTagOut: '', comboTagIn: '', maxTriggers: 1 },
      { id: 'skill_fireball', name: '火球术', type: 'skill', element: 'fire', targetSide: 'enemy', targetRule: 'frontRow', multiplier: 3.0, healMultiplier: 0, shieldMultiplier: 0, mpCost: 20, cooldown: 2, statusId: 'status_burn', statusChance: 100, comboTagOut: 'fire_hit', comboTagIn: '', maxTriggers: 1 },
      { id: 'skill_heal', name: '圣光术', type: 'skill', element: 'light', targetSide: 'player', targetRule: 'lowestHp', multiplier: 0, healMultiplier: 2.5, shieldMultiplier: 0, mpCost: 20, cooldown: 1, statusId: '', statusChance: 0, comboTagOut: '', comboTagIn: '', maxTriggers: 1 },
      { id: 'skill_follow_1', name: '追打·烈焰斩', type: 'followup', element: 'fire', targetSide: 'enemy', targetRule: 'lowestHp', multiplier: 2.0, healMultiplier: 0, shieldMultiplier: 0, mpCost: 0, cooldown: 0, statusId: '', statusChance: 0, comboTagOut: '', comboTagIn: 'fire_hit', maxTriggers: 1 }
    ];

    const DEFAULT_STATUS = [ 
      { id: 'status_burn', name: '灼烧', type: 'debuff', duration: 3, statMod: 'none', statValue: 0, isDot: true, dotValue: 200, isStun: false },
      { id: 'status_stun', name: '眩晕', type: 'control', duration: 1, statMod: 'none', statValue: 0, isDot: false, dotValue: 0, isStun: true }
    ];

    const DEFAULT_ITEMS = [
      { id: 'item_sword', name: '铁剑', category: 'weapon', icon: '🗡️', desc: '普通的剑', atkMin: 50, atkMax: 100, defMin: 0, defMax: 0, hpMin: 0, hpMax: 0, atkPercent: 0, defPercent: 0, hpPercent: 0, critRate: 0, critDmg: 0, lifesteal: 0, hitRate: 0, dodgeRate: 0, critResist: 0, speed: 0 },
      { id: 'item_shield', name: '木盾', category: 'armor', icon: '🛡️', desc: '普通的盾', atkMin: 0, atkMax: 0, defMin: 20, defMax: 50, hpMin: 100, hpMax: 300, atkPercent: 0, defPercent: 0, hpPercent: 0, critRate: 0, critDmg: 0, lifesteal: 0, hitRate: 0, dodgeRate: 0, critResist: 0, speed: 0 }
    ];

    const DEFAULT_LEVELS = [ { id: 'lv_1', name: '第 1 关', enemyIds: ['e_skeleton', 'e_skeleton', ''], rewardItemId: 'item_sword' } ];

    let currentTab = 'char';
    let subTab = { char: 'player', skill: 'active', item: 'weapon' };

    let gameChars, gameSkills, gameStatuses, gameItems, gameLevels, inventory;
    try {
      gameChars = JSON.parse(localStorage.getItem('my_game_data_v13')) || DEFAULT_CHARS;
      gameSkills = JSON.parse(localStorage.getItem('my_game_skills_v13')) || DEFAULT_SKILLS;
      gameStatuses = JSON.parse(localStorage.getItem('my_game_statuses_v13')) || DEFAULT_STATUS;
      gameItems = JSON.parse(localStorage.getItem('my_game_items_v13')) || DEFAULT_ITEMS;
      gameLevels = JSON.parse(localStorage.getItem('my_game_levels_v13')) || DEFAULT_LEVELS;
      inventory = JSON.parse(localStorage.getItem('my_game_inventory_v13')) || [];
    } catch(e) { resetData(); }

    if (!Array.isArray(gameChars)) gameChars = DEFAULT_CHARS;
    if (!Array.isArray(gameSkills)) gameSkills = DEFAULT_SKILLS;
    if (!Array.isArray(gameStatuses)) gameStatuses = DEFAULT_STATUS;
    if (!Array.isArray(gameItems)) gameItems = DEFAULT_ITEMS;
    if (!Array.isArray(gameLevels)) gameLevels = DEFAULT_LEVELS;
    if (!Array.isArray(inventory)) inventory = [];

    setTimeout(() => { saveData(); }, 100);

    function generateRandomInstance(templateId) {
      const template = gameItems.find(t => t.id === templateId);
      if (!template) return null;

      const rand = Math.random() * 100;
      let quality = 'white', qMult = 1.0, extraCount = 0, tier = 1;
      if (rand > 99) { quality = 'red'; qMult = 1.8; extraCount = 5; tier = 3; }
      else if (rand > 95) { quality = 'orange'; qMult = 1.5; extraCount = 4; tier = 3; }
      else if (rand > 85) { quality = 'purple'; qMult = 1.3; extraCount = 3; tier = 2; }
      else if (rand > 60) { quality = 'blue'; qMult = 1.15; extraCount = 2; tier = 2; }
      else if (rand > 30) { quality = 'green'; qMult = 1.05; extraCount = 1; tier = 1; }

      const baseAtk = Math.floor((Math.floor(Math.random() * ((template.atkMax||0) - (template.atkMin||0) + 1)) + (template.atkMin||0)) * qMult);
      const baseDef = Math.floor((Math.floor(Math.random() * ((template.defMax||0) - (template.defMin||0) + 1)) + (template.defMin||0)) * qMult);
      const baseHp = Math.floor((Math.floor(Math.random() * ((template.hpMax||0) - (template.hpMin||0) + 1)) + (template.hpMin||0)) * qMult);

      const WEAPON_ACC_POOL = ['atkPercent', 'critRate', 'critDmg', 'lifesteal', 'hitRate', 'speed'];
      const ARMOR_POOL = ['hpPercent', 'defPercent', 'critResist', 'dodgeRate', 'speed'];
      const pool = template.category === 'armor' ? ARMOR_POOL : WEAPON_ACC_POOL;
      
      let tempPool = [...pool];
      const extras = [];
      
      for (let i = 0; i < extraCount; i++) {
        if(tempPool.length === 0) break;
        const idx = Math.floor(Math.random() * tempPool.length);
        const stat = tempPool.splice(idx, 1)[0];
        
        let val = 0;
        if (stat === 'speed') val = tier === 1 ? Math.floor(Math.random()*2)+1 : tier === 2 ? Math.floor(Math.random()*3)+3 : Math.floor(Math.random()*5)+6;
        else if (stat === 'lifesteal') val = tier === 1 ? (Math.floor(Math.random()*2)+1)/100 : tier === 2 ? (Math.floor(Math.random()*3)+3)/100 : (Math.floor(Math.random()*5)+6)/100;
        else if (stat === 'atkPercent') val = tier === 1 ? (Math.floor(Math.random()*3)+2)/100 : tier === 2 ? (Math.floor(Math.random()*3)+5)/100 : (Math.floor(Math.random()*3)+8)/100;
        else if (stat === 'defPercent') val = tier === 1 ? (Math.floor(Math.random()*3)+2)/100 : tier === 2 ? (Math.floor(Math.random()*3)+5)/100 : (Math.floor(Math.random()*3)+6)/100;
        else val = tier === 1 ? (Math.floor(Math.random()*5)+1)/100 : tier === 2 ? (Math.floor(Math.random()*5)+10)/100 : (Math.floor(Math.random()*10)+20)/100;
        
        extras.push({ stat, value: val });
      }

      const finalExtras = [...extras];
      const extraKeys = ['atkPercent', 'defPercent', 'hpPercent', 'critRate', 'critDmg', 'lifesteal', 'hitRate', 'dodgeRate', 'critResist', 'speed'];
      extraKeys.forEach(k => {
        if (template[k] && template[k] !== 0) finalExtras.push({ stat: k, value: template[k] / 100 });
      });

      return { uid: 'inst_' + Date.now() + Math.floor(Math.random()*1000), itemId: template.id, quality, baseAtk, baseDef, baseHp, extras: finalExtras, equippedBy: '' };
    }

    const elements = ['fire', 'water', 'wind', 'light', 'dark'];
    const sides = [{ val: 'player', label: '我方' }, { val: 'enemy', label: '敌方' }];
    const skillTypes = [{ val: 'normal', label: '普攻' }, { val: 'skill', label: '招式' }, { val: 'ultimate', label: '绝技' }, { val: 'followup', label: '追打' }, { val: 'passive', label: '被动' }];
    const targetRules = [{ val: 'frontRow', label: '前排' }, { val: 'lowestHp', label: '血量最低' }, { val: 'highestHp', label: '血量最高' }, { val: 'highestAtk', label: '攻击最高' }, { val: 'random', label: '随机目标' }];
    const passiveTypes = [{ val: 'atkAdd', label: '攻击加成' }, { val: 'hpAdd', label: '生命加成' }, { val: 'defAdd', label: '防御加成' }, { val: 'speedAdd', label: '速度加成' }];
    const itemCategories = [{ val: 'weapon', label: '武器' }, { val: 'armor', label: '防具' }, { val: 'accessory', label: '饰品' }];
    const statusTypes = [{ val: 'buff', label: '增益' }, { val: 'debuff', label: '减益' }, { val: 'control', label: '控制' }];
    const statusMods = [{ val: 'none', label: '无属性变化' }, { val: 'atk', label: '攻击力' }, { val: 'def', label: '防御力' }, { val: 'speed', label: '速度' }];

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => { if (t.innerText.includes({char:'角色', skill:'技能', status:'状态', item:'物品', level:'关卡'}[tab])) t.classList.add('active'); });
      ['char','skill','status','item','level'].forEach(k => document.getElementById(k+'-section').style.display = tab === k ? 'block' : 'none');
      render();
    }

    function switchSubTab(tab, sub) {
      subTab[tab] = sub;
      const ids = { char: ['player', 'enemy'], skill: ['active', 'followup', 'passive'], item: ['weapon', 'armor', 'accessory'] };
      if (ids[tab]) {
        ids[tab].forEach(s => { document.getElementById(`tab-${tab}-${s}`).classList.remove('active'); });
        document.getElementById(`tab-${tab}-${sub}`).classList.add('active');
      }
      render();
    }

    function render() {
      if (currentTab === 'char') renderChars();
      if (currentTab === 'skill') renderSkills();
      if (currentTab === 'status') renderStatuses();
      if (currentTab === 'item') renderItems();
      if (currentTab === 'level') renderLevels();
    }

    function getSkillOptions(selectedId) {
      let html = `<option value="">(空)</option>`;
      gameSkills.forEach(sk => { html += `<option value="${sk.id}" ${selectedId === sk.id ? 'selected' : ''}>[${sk.type}] ${sk.name}</option>`; });
      return html;
    }
    function getStatusOptions(selectedId) {
      let html = `<option value="">(无)</option>`;
      gameStatuses.forEach(st => { html += `<option value="${st.id}" ${selectedId === st.id ? 'selected' : ''}>${st.name}</option>`; });
      return html;
    }

    function renderChars() {
      const list = document.getElementById('char-list'); list.innerHTML = '';
      const keyword = document.getElementById('search-char').value.toLowerCase();
      gameChars.forEach((char, index) => {
        if (char.side !== subTab.char) return;
        if (keyword && !char.name.toLowerCase().includes(keyword)) return;
        if (!char.skillSlots) char.skillSlots = { normal: '', skill: '', ultimate: '', followup: '', learned: '' };
        if (!char.equipment) char.equipment = { weapon: '', armor: '', accessory: '' };
        if (char.lifesteal === undefined) char.lifesteal = 0;

        const div = document.createElement('div'); div.className = 'card';
        div.innerHTML = `
          <div class="card-header"><h3>${char.emoji} ${char.name}</h3><button class="btn-del" onclick="deleteChar(${index})">删除</button></div>
          <div class="form-grid">
            <div class="form-item"><label>姓名</label><input type="text" value="${char.name}" onchange="updateChar(${index}, 'name', this.value)"></div>
            <div class="form-item"><label>图标</label><input type="text" value="${char.emoji}" onchange="updateChar(${index}, 'emoji', this.value)"></div>
            <div class="form-item"><label>生命</label><input type="number" value="${char.maxHp}" onchange="updateChar(${index}, 'maxHp', parseInt(this.value))"></div>
            <div class="form-item"><label>攻击</label><input type="number" value="${char.atk}" onchange="updateChar(${index}, 'atk', parseInt(this.value))"></div>
            <div class="form-item"><label>防御</label><input type="number" value="${char.def}" onchange="updateChar(${index}, 'def', parseInt(this.value))"></div>
            <div class="form-item"><label>速度</label><input type="number" value="${char.speed}" onchange="updateChar(${index}, 'speed', parseInt(this.value))"></div>
            
            <div class="form-item"><label>暴击(%)</label><input type="number" step="0.1" value="${(char.critRate*100).toFixed(1)}" onchange="updateCharPct(${index}, 'critRate', this.value)"></div>
            <div class="form-item"><label>暴伤(倍)</label><input type="number" step="0.1" value="${char.critDmg||1.5}" onchange="updateChar(${index}, 'critDmg', parseFloat(this.value))"></div>
            <div class="form-item"><label>抗暴(%)</label><input type="number" step="0.1" value="${(char.critResist*100).toFixed(1)}" onchange="updateCharPct(${index}, 'critResist', this.value)"></div>
            <div class="form-item"><label>命中(%)</label><input type="number" step="0.1" value="${(char.hitRate*100).toFixed(1)}" onchange="updateCharPct(${index}, 'hitRate', this.value)"></div>
            <div class="form-item"><label>闪避(%)</label><input type="number" step="0.1" value="${(char.dodgeRate*100).toFixed(1)}" onchange="updateCharPct(${index}, 'dodgeRate', this.value)"></div>
            <div class="form-item"><label>增伤(%)</label><input type="number" step="0.1" value="${(char.dmgIncrease*100).toFixed(1)}" onchange="updateCharPct(${index}, 'dmgIncrease', this.value)"></div>
            <div class="form-item"><label>减伤(%)</label><input type="number" step="0.1" value="${(char.dmgReduction*100).toFixed(1)}" onchange="updateCharPct(${index}, 'dmgReduction', this.value)"></div>
            <div class="form-item"><label>真伤</label><input type="number" value="${char.trueDmg||0}" onchange="updateChar(${index}, 'trueDmg', parseInt(this.value))"></div>
            <div class="form-item"><label style="color:#e74c3c;">吸血(%)</label><input type="number" step="0.1" value="${(char.lifesteal*100).toFixed(1)}" onchange="updateCharPct(${index}, 'lifesteal', this.value)"></div>
            
            <div class="form-item"><label>属性</label><select onchange="updateChar(${index}, 'element', this.value)">${elements.map(e => `<option value="${e}" ${char.element === e ? 'selected' : ''}>${e}</option>`).join('')}</select></div>
            
            <div class="form-item full">
              <label>技能装配</label>
              <div class="skill-slot">
                <div style="display:flex; gap:5px; margin-bottom:5px;"><span style="width:50px;">普攻:</span><select style="flex:1;" onchange="updateSkillSlot(${index}, 'normal', this.value)">${getSkillOptions(char.skillSlots.normal)}</select></div>
                <div style="display:flex; gap:5px; margin-bottom:5px;"><span style="width:50px;">招式:</span><select style="flex:1;" onchange="updateSkillSlot(${index}, 'skill', this.value)">${getSkillOptions(char.skillSlots.skill)}</select></div>
                <div style="display:flex; gap:5px; margin-bottom:5px;"><span style="width:50px;">绝技:</span><select style="flex:1;" onchange="updateSkillSlot(${index}, 'ultimate', this.value)">${getSkillOptions(char.skillSlots.ultimate)}</select></div>
                <div style="display:flex; gap:5px; margin-bottom:5px;"><span style="width:50px; color:#e74c3c;">追打:</span><select style="flex:1; border-color:#e74c3c;" onchange="updateSkillSlot(${index}, 'followup', this.value)">${getSkillOptions(char.skillSlots.followup)}</select></div>
              </div>
            </div>
          </div>`;
        list.appendChild(div);
      });
    }

    function renderSkills() {
      const list = document.getElementById('skill-list'); list.innerHTML = '';
      const keyword = document.getElementById('search-skill').value.toLowerCase();
      gameSkills.forEach((skill, index) => {
        if (subTab.skill === 'active' && ['followup', 'passive'].includes(skill.type)) return;
        if (subTab.skill === 'followup' && skill.type !== 'followup') return;
        if (subTab.skill === 'passive' && skill.type !== 'passive') return;
        if (keyword && !skill.name.toLowerCase().includes(keyword)) return;

        const isPassive = skill.type === 'passive';
        const isHealOrShield = (skill.healMultiplier > 0 || skill.shieldMultiplier > 0);
        
        const div = document.createElement('div'); div.className = 'card';
        div.innerHTML = `
          <div class="card-header"><h3>${skill.name}</h3><button class="btn-del" onclick="deleteSkill(${index})">删除</button></div>
          <div class="form-grid">
            <div class="form-item"><label>名称</label><input type="text" value="${skill.name}" onchange="updateSkill(${index}, 'name', this.value)"></div>
            <div class="form-item"><label>分类</label><select onchange="updateSkill(${index}, 'type', this.value)">${skillTypes.map(t => `<option value="${t.val}" ${skill.type === t.val ? 'selected' : ''}>${t.label}</option>`).join('')}</select></div>
            
            <div class="form-item active-only" style="display:${isPassive?'none':'flex'};">
              <label>施法对象</label>
              <select onchange="updateSkill(${index}, 'targetSide', this.value)">
                <option value="enemy" ${skill.targetSide==='enemy'?'selected':''}>敌方</option>
                <option value="player" ${skill.targetSide==='player'?'selected':''}>我方</option>
                <option value="self" ${skill.targetSide==='self'?'selected':''}>自身</option>
              </select>
            </div>
            <div class="form-item active-only" style="display:${isPassive?'none':'flex'};">
              <label>选取规则</label>
              <select onchange="updateSkill(${index}, 'targetRule', this.value)">${targetRules.map(r => `<option value="${r.val}" ${skill.targetRule === r.val ? 'selected' : ''}>${r.label}</option>`).join('')}</select>
            </div>

            <div class="form-item active-only" style="display:${isPassive||isHealOrShield?'none':'flex'};"><label>伤害倍率</label><input type="number" step="0.1" value="${skill.multiplier || 0}" onchange="updateSkill(${index}, 'multiplier', parseFloat(this.value))"></div>
            <div class="form-item active-only" style="display:${isPassive?'none':'flex'};"><label style="color:#2ecc71;">治疗倍率</label><input type="number" step="0.1" value="${skill.healMultiplier || 0}" onchange="updateSkill(${index}, 'healMultiplier', parseFloat(this.value))"></div>
            <div class="form-item active-only" style="display:${isPassive?'none':'flex'};"><label style="color:#3498db;">护盾倍率</label><input type="number" step="0.1" value="${skill.shieldMultiplier || 0}" onchange="updateSkill(${index}, 'shieldMultiplier', parseFloat(this.value))"></div>

            <div class="form-item active-only" style="display:${isPassive?'none':'flex'};"><label>耗蓝</label><input type="number" value="${skill.mpCost || 0}" onchange="updateSkill(${index}, 'mpCost', parseInt(this.value))"></div>
            <div class="form-item active-only" style="display:${isPassive?'none':'flex'};"><label>冷却</label><input type="number" value="${skill.cooldown || 0}" onchange="updateSkill(${index}, 'cooldown', parseInt(this.value))"></div>
            
            <div class="form-item active-only" style="display:${isPassive?'none':'flex'};"><label>附加状态</label><select onchange="updateSkill(${index}, 'statusId', this.value)">${getStatusOptions(skill.statusId || '')}</select></div>
            <div class="form-item active-only" style="display:${isPassive?'none':'flex'};"><label>概率(%)</label><input type="number" step="0.1" value="${(skill.statusChance||0)*100}" onchange="updateSkillPct(${index}, 'statusChance', this.value)"></div>
            
            <div class="form-item full" style="display: ${isPassive ? 'none' : 'block'}; background:#1e1e2e; border:1px solid #e74c3c; padding:10px; border-radius:4px;">
              <label style="color:#e74c3c;">连携机制</label>
              <div style="display:flex; gap:10px; margin-top:5px;">
                <input type="text" placeholder="发起" value="${skill.comboTagOut || ''}" onchange="updateSkill(${index}, 'comboTagOut', this.value)" style="flex:1;">
                <input type="text" placeholder="响应" value="${skill.comboTagIn || ''}" onchange="updateSkill(${index}, 'comboTagIn', this.value)" style="flex:1;">
                <input type="number" placeholder="次数" value="${skill.maxTriggers || 1}" onchange="updateSkill(${index}, 'maxTriggers', parseInt(this.value))" style="width:60px;">
              </div>
            </div>
            <div class="form-item full" style="display: ${isPassive ? 'block' : 'none'}; background:#1e1e2e; border:1px solid #e67e22; padding:10px; border-radius:4px;">
              <label style="color:#e67e22;">被动效果</label>
              <div style="display:flex; gap:10px; margin-top:5px;">
                <select style="flex:1;" onchange="updateSkill(${index}, 'passiveType', this.value)">${passiveTypes.map(p => `<option value="${p.val}" ${skill.passiveType === p.val ? 'selected' : ''}>${p.label}</option>`).join('')}</select>
                <input type="number" style="flex:1;" value="${skill.passiveValue || 0}" onchange="updateSkill(${index}, 'passiveValue', parseInt(this.value))">
              </div>
            </div>
          </div>`;
        list.appendChild(div);
      });
    }

    function renderStatuses() {
      const list = document.getElementById('status-list'); list.innerHTML = '';
      const keyword = document.getElementById('search-status').value.toLowerCase();
      gameStatuses.forEach((st, index) => {
        if (keyword && !st.name.toLowerCase().includes(keyword)) return;
        const div = document.createElement('div'); div.className = 'card';
        div.innerHTML = `
          <div class="card-header"><h3>${st.name}</h3><button class="btn-del" onclick="deleteStatus(${index})">删除</button></div>
          <div class="form-grid">
            <div class="form-item"><label>名称</label><input type="text" value="${st.name}" onchange="updateStatus(${index}, 'name', this.value)"></div>
            <div class="form-item"><label>分类</label><select onchange="updateStatus(${index}, 'type', this.value)">${statusTypes.map(t => `<option value="${t.val}" ${st.type === t.val ? 'selected' : ''}>${t.label}</option>`).join('')}</select></div>
            <div class="form-item"><label>持续回合</label><input type="number" value="${st.duration}" onchange="updateStatus(${index}, 'duration', parseInt(this.value))"></div>
            
            <div class="sub-title">属性修改</div>
            <div class="form-item"><label>修改哪个属性</label><select onchange="updateStatus(${index}, 'statMod', this.value)">${statusMods.map(m => `<option value="${m.val}" ${st.statMod === m.val ? 'selected' : ''}>${m.label}</option>`).join('')}</select></div>
            <div class="form-item"><label>修改数值 (正数加，负数减)</label><input type="number" value="${st.statValue}" onchange="updateStatus(${index}, 'statValue', parseInt(this.value))"></div>

            <div class="sub-title">特殊效果</div>
            <div class="form-item"><label>是否持续扣血(DOT)</label><select onchange="updateStatus(${index}, 'isDot', this.value === 'true')"><option value="false" ${!st.isDot ? 'selected' : ''}>否</option><option value="true" ${st.isDot ? 'selected' : ''}>是</option></select></div>
            <div class="form-item"><label>DOT扣血值</label><input type="number" value="${st.dotValue}" onchange="updateStatus(${index}, 'dotValue', parseInt(this.value))"></div>
            
            <div class="form-item full"><label>是否眩晕 (无法行动)</label><select onchange="updateStatus(${index}, 'isStun', this.value === 'true')"><option value="false" ${!st.isStun ? 'selected' : ''}>否</option><option value="true" ${st.isStun ? 'selected' : ''}>是</option></select></div>
          </div>`;
        list.appendChild(div);
      });
    }

    function renderItems() {
      const list = document.getElementById('item-list'); list.innerHTML = '';
      const keyword = document.getElementById('search-item').value.toLowerCase();

      gameItems.forEach((item, index) => {
        if (item.category !== subTab.item) return;
        if (keyword && !item.name.toLowerCase().includes(keyword)) return;

        const div = document.createElement('div'); div.className = 'card';
        div.innerHTML = `
          <div class="card-header"><h3>${item.icon} ${item.name} 模板</h3><button class="btn-del" onclick="deleteItem(${index})">删除</button></div>
          <div class="form-grid">
            <div class="form-item"><label>名称</label><input type="text" value="${item.name}" onchange="updateItem(${index}, 'name', this.value)"></div>
            <div class="form-item"><label>图标</label><input type="text" value="${item.icon}" onchange="updateItem(${index}, 'icon', this.value)"></div>
            <div class="form-item"><label>分类</label><select onchange="updateItem(${index}, 'category', this.value)">${itemCategories.map(c => `<option value="${c.val}" ${item.category === c.val ? 'selected' : ''}>${c.label}</option>`).join('')}</select></div>
            
            <div class="sub-title">基础属性范围 (Min - Max)</div>
            <div class="form-item"><label>攻击力</label><div style="display:flex;gap:2px;"><input type="number" value="${item.atkMin||0}" onchange="updateItem(${index}, 'atkMin', parseInt(this.value))" placeholder="Min"><input type="number" value="${item.atkMax||0}" onchange="updateItem(${index}, 'atkMax', parseInt(this.value))" placeholder="Max"></div></div>
            <div class="form-item"><label>防御力</label><div style="display:flex;gap:2px;"><input type="number" value="${item.defMin||0}" onchange="updateItem(${index}, 'defMin', parseInt(this.value))" placeholder="Min"><input type="number" value="${item.defMax||0}" onchange="updateItem(${index}, 'defMax', parseInt(this.value))" placeholder="Max"></div></div>
            <div class="form-item"><label>生命值</label><div style="display:flex;gap:2px;"><input type="number" value="${item.hpMin||0}" onchange="updateItem(${index}, 'hpMin', parseInt(this.value))" placeholder="Min"><input type="number" value="${item.hpMax||0}" onchange="updateItem(${index}, 'hpMax', parseInt(this.value))" placeholder="Max"></div></div>

            <div class="sub-title">自带额外属性 (默认0，填10代表10%)</div>
            <div class="form-item"><label>攻击力(%)</label><input type="number" step="0.1" value="${(item.atkPercent||0)*100}" onchange="updateItemPct(${index}, 'atkPercent', this.value)"></div>
            <div class="form-item"><label>防御力(%)</label><input type="number" step="0.1" value="${(item.defPercent||0)*100}" onchange="updateItemPct(${index}, 'defPercent', this.value)"></div>
            <div class="form-item"><label>生命值(%)</label><input type="number" step="0.1" value="${(item.hpPercent||0)*100}" onchange="updateItemPct(${index}, 'hpPercent', this.value)"></div>
            <div class="form-item"><label>暴击率(%)</label><input type="number" step="0.1" value="${(item.critRate||0)*100}" onchange="updateItemPct(${index}, 'critRate', this.value)"></div>
            <div class="form-item"><label>暴击伤害</label><input type="number" step="0.1" value="${item.critDmg||0}" onchange="updateItem(${index}, 'critDmg', parseFloat(this.value))"></div>
            <div class="form-item"><label>抗暴率(%)</label><input type="number" step="0.1" value="${(item.critResist||0)*100}" onchange="updateItemPct(${index}, 'critResist', this.value)"></div>
            <div class="form-item"><label>命中率(%)</label><input type="number" step="0.1" value="${(item.hitRate||0)*100}" onchange="updateItemPct(${index}, 'hitRate', this.value)"></div>
            <div class="form-item"><label>闪避率(%)</label><input type="number" step="0.1" value="${(item.dodgeRate||0)*100}" onchange="updateItemPct(${index}, 'dodgeRate', this.value)"></div>
            <div class="form-item"><label>吸血(%)</label><input type="number" step="0.1" value="${(item.lifesteal||0)*100}" onchange="updateItemPct(${index}, 'lifesteal', this.value)"></div>
            <div class="form-item"><label>速度</label><input type="number" value="${item.speed||0}" onchange="updateItem(${index}, 'speed', parseInt(this.value))"></div>
          </div>`;
        list.appendChild(div);
      });
    }

    function renderLevels() {
      const list = document.getElementById('level-list'); list.innerHTML = '';
      gameLevels.forEach((lv, index) => {
        const div = document.createElement('div'); div.className = 'card';
        div.innerHTML = `
          <div class="card-header"><h3>${lv.name}</h3><button class="btn-del" onclick="deleteLevel(${index})">删除</button></div>
          <div class="form-grid">
            <div class="form-item full"><label>关卡名称</label><input type="text" value="${lv.name}" onchange="updateLevel(${index}, 'name', this.value)"></div>
            <div class="form-item full"><label>掉落物品模板</label><select onchange="updateLevel(${index}, 'rewardItemId', this.value)"><option value="">(无)</option>${gameItems.map(e => `<option value="${e.id}" ${lv.rewardItemId === e.id ? 'selected' : ''}>${e.name}</option>`).join('')}</select></div>
            <div class="form-item full">
              ${[0,1,2].map(i => {
                const curEnemy = lv.enemyIds && lv.enemyIds[i] ? lv.enemyIds[i] : '';
                return `<div style="display:flex; gap:10px; margin-bottom:5px;"><span>位置 ${i+1}:</span><select style="flex:1;" onchange="updateLevelEnemy(${index}, ${i}, this.value)"><option value="">(空)</option>${gameChars.filter(c=>c.side==='enemy').map(c => `<option value="${c.id}" ${curEnemy === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}</select></div>`;
              }).join('')}
            </div>
          </div>`;
        list.appendChild(div);
      });
    }

    function saveData() {
      localStorage.setItem('my_game_data_v13', JSON.stringify(gameChars));
      localStorage.setItem('my_game_skills_v13', JSON.stringify(gameSkills));
      localStorage.setItem('my_game_statuses_v13', JSON.stringify(gameStatuses));
      localStorage.setItem('my_game_items_v13', JSON.stringify(gameItems));
      localStorage.setItem('my_game_levels_v13', JSON.stringify(gameLevels));
      localStorage.setItem('my_game_inventory_v13', JSON.stringify(inventory));

      localStorage.setItem('my_game_characters', JSON.stringify(gameChars));
      localStorage.setItem('my_game_skills_sync', JSON.stringify(gameSkills));
      localStorage.setItem('my_game_statuses_sync', JSON.stringify(gameStatuses));
      localStorage.setItem('my_game_items_sync', JSON.stringify(gameItems));
      localStorage.setItem('my_game_levels_sync', JSON.stringify(gameLevels));
      localStorage.setItem('my_game_inventory_sync', JSON.stringify(inventory));
    }

    function updateChar(index, key, value) { gameChars[index][key] = value; saveData(); }
    function updateCharPct(index, key, value) { gameChars[index][key] = parseFloat(value) / 100; saveData(); }
    function updateItemPct(index, key, value) { gameItems[index][key] = parseFloat(value) / 100; saveData(); }
    function updateSkillPct(index, key, value) { gameSkills[index][key] = parseFloat(value) / 100; saveData(); }

    function updateSkillSlot(c, s, v) { gameChars[c].skillSlots[s] = v; saveData(); }
    function updateSkill(index, key, value) { gameSkills[index][key] = value; saveData(); if (key === 'name' || key === 'type' || key==='healMultiplier' || key==='shieldMultiplier') render(); }
    function updateStatus(index, key, value) { gameStatuses[index][key] = value; saveData(); if (key === 'name') renderSkills(); }
    function updateItem(index, key, value) { gameItems[index][key] = value; saveData(); if (key === 'name' || key === 'category') render(); }
    function updateLevel(index, key, value) { gameLevels[index][key] = value; saveData(); }
    function updateLevelEnemy(lvIndex, slotIndex, enemyId) {
      if (!gameLevels[lvIndex].enemyIds) gameLevels[lvIndex].enemyIds = ['', '', ''];
      gameLevels[lvIndex].enemyIds[slotIndex] = enemyId;
      saveData();
    }

    function addChar() { gameChars.push({ id: 'char_'+Date.now(), name:'新角色', side: subTab.char, emoji:'🙂', element:'fire', maxHp:1000, atk:100, def:50, speed:10, critRate:0.1, critDmg:1.5, maxMp:50, mpPerAttack:10, hitRate:0, dodgeRate:0, critResist:0, dmgIncrease:0, dmgReduction:0, dmgTakenIncrease:0, trueDmg:0, lifesteal:0, gridX:-1, gridY:-1, skillSlots:{normal:'',skill:'',ultimate:'',followup:'',learned:''}, equipment:{weapon:'',armor:'',accessory:''} }); saveData(); render(); }
    function deleteChar(index) { if (confirm('确定删除？')) { gameChars.splice(index, 1); saveData(); render(); } }
    function addSkill() { 
      let type = subTab.skill === 'followup' ? 'followup' : subTab.skill === 'passive' ? 'passive' : 'skill';
      gameSkills.push({ id:'skill_'+Date.now(), name:'新技能', type:type, element:'fire', targetSide:'enemy', targetRule:'frontRow', multiplier:1.0, healMultiplier:0, shieldMultiplier:0, mpCost:10, cooldown:0, statusId:'', statusChance:0, comboTagOut:'', comboTagIn:'', maxTriggers:1 }); saveData(); render(); 
    }
    function deleteSkill(index) { if (confirm('确定删除？')) { gameSkills.splice(index, 1); saveData(); render(); } }
    function addStatus() { gameStatuses.push({ id:'status_'+Date.now(), name:'新状态', type:'debuff', duration:1, statMod:'none', statValue:0, isDot:false, dotValue:0, isStun:false }); saveData(); render(); }
    function deleteStatus(index) { if (confirm('确定删除？')) { gameStatuses.splice(index, 1); saveData(); render(); } }
    
    function addItem() { 
      gameItems.push({ id:'item_'+Date.now(), name:'新物品', category:subTab.item, icon:'📦', desc:'', atkMin:0, atkMax:0, defMin:0, defMax:0, hpMin:0, hpMax:0, atkPercent:0, defPercent:0, hpPercent:0, critRate:0, critDmg:0, lifesteal:0, hitRate:0, dodgeRate:0, critResist:0, speed:0 }); saveData(); render(); 
    }
    function deleteItem(index) { if (confirm('确定删除？')) { gameItems.splice(index, 1); saveData(); render(); } }
    function addLevel() { gameLevels.push({ id:'lv_'+Date.now(), name:'新关卡', enemyIds:['','',''], rewardItemId:'' }); saveData(); render(); }
    function deleteLevel(index) { if (confirm('确定删除？')) { gameLevels.splice(index, 1); saveData(); render(); } }
    
    function grantItem() {
      if (gameItems.length === 0) return alert('请先新建物品模板');
      const itemId = prompt("输入要发放的物品模板ID (如: item_sword)");
      if (itemId && gameItems.find(e => e.id === itemId)) {
        const inst = generateRandomInstance(itemId);
        if(inst) {
          inventory.push(inst);
          saveData();
          alert(`发放成功！随机到了 [${inst.quality}] 品质。`);
        }
      } else { alert('ID不存在'); }
    }

    function resetData() { localStorage.clear(); location.href = location.href + '?t=' + Date.now(); }
    render();
  </script>
</body>
</html>
