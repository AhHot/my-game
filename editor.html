<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>配置中心 (模块化版)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #1a1a2e; color: #fff; padding: 15px; padding-bottom: 120px; }
    h1 { font-size: 24px; text-align: center; margin-bottom: 20px; color: #f1c40f; }
    .tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 15px; }
    .tab { flex: 1; min-width: 12%; padding: 10px; text-align: center; background: #16213e; border-radius: 6px; cursor: pointer; border: 1px solid #0f3460; font-size: 13px;}
    .tab.active { background: #3498db; border-color: #3498db; font-weight: bold; }
    .search-bar { display: flex; gap: 10px; margin-bottom: 15px; }
    .search-bar input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #0f0f1a; color: #fff; font-size: 14px; }
    .sub-tabs { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
    .sub-tab { flex: 1; min-width: 18%; padding: 8px; text-align: center; background: #0f3460; border-radius: 4px; cursor: pointer; font-size: 12px; border: 1px solid transparent; }
    .sub-tab.active { background: #e74c3c; border-color: #e74c3c; font-weight: bold; }
    .card { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .card-header h3 { color: #3498db; }
    .btn-del { background: #e74c3c; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; font-size: 14px; cursor:pointer;}
    .btn-grant { background: #e67e22; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; font-size: 14px; cursor:pointer; margin-right:10px;}
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .form-item { display: flex; flex-direction: column; }
    .form-item.full { grid-column: span 2; }
    .form-item label { font-size: 11px; color: #aaa; margin-bottom: 4px; }
    .form-item input, .form-item select, .form-item textarea { background: #0f0f1a; color: #fff; border: 1px solid #444; padding: 6px; border-radius: 4px; font-size: 13px; width: 100%; }
    .sub-title { color: #f1c40f; font-size: 14px; margin-top: 15px; margin-bottom: 5px; font-weight: bold; border-bottom: 1px dashed #444; padding-bottom: 5px; grid-column: span 2;}
    .effect-box { background: #0f3460; padding: 10px; border-radius: 4px; margin-bottom: 8px; border: 1px solid #3498db; position: relative; }
    .effect-title { font-size: 12px; color: #f1c40f; font-weight: bold; margin-bottom: 5px; display: flex; justify-content: space-between; }
    .btn-remove-effect { background: #e74c3c; color: #fff; border: none; border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer;}
    .btn-add-effect { background: #2ecc71; color: #fff; border: none; padding: 8px; width: 100%; border-radius: 4px; margin-top: 5px; cursor: pointer; font-weight: bold;}
    .level-editor-layout { display: flex; gap: 15px; }
    @media (max-width: 768px) { .level-editor-layout { flex-direction: column; } }
    .enemy-pool { flex: 1; background: #0f0f1a; padding: 10px; border-radius: 8px; max-height: 400px; overflow-y: auto; border: 1px solid #333;}
    .enemy-pool-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid #222; cursor: pointer; }
    .grid-container { flex: 1; display: flex; justify-content: center; flex-direction: column;}
    .board-wrapper { position: relative; width: 100%; max-width: 400px; aspect-ratio: 1; background: #0f0f1a; border: 2px solid #333; border-radius: 8px; overflow: hidden; margin: 0 auto;}
    .bg-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    .bg-cell { border: 1px solid #222; }
    .unit-block { position: absolute; background: rgba(52, 152, 219, 0.6); border: 2px solid #3498db; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: grab; touch-action: none; user-select: none; z-index: 10; }
    .unit-block.invalid { background: rgba(231, 76, 60, 0.6); border-color: #e74c3c; }
    .unit-block .block-emoji { font-size: 32px; pointer-events: none; }
    .unit-block .block-del { position: absolute; top: -8px; right: -8px; background: #e74c3c; color: white; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; cursor: pointer; z-index: 11; border: 2px solid #fff; }
    .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #16213e; padding: 15px; border-top: 1px solid #333; display: flex; gap: 10px; z-index: 100; }
    .btn { flex: 1; padding: 15px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; color: #fff; text-align: center; text-decoration: none; cursor:pointer;}
    .btn-play { background: #2ecc71; }
    .btn-reset { background: #e74c3c; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
    th, td { padding: 4px 8px; text-align: left; border-bottom: 1px solid #222; }
    input[type="color"] { padding: 0; height: 30px; cursor: pointer; }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; }
    .checkbox-item { display: flex; align-items: center; gap: 4px; background: #0f0f1a; padding: 4px 8px; border-radius: 4px; border: 1px solid #333; cursor: pointer; font-size: 12px; }
    .checkbox-item input { width: auto; }
    .drop-rate-row { display: flex; align-items: center; gap: 10px; background: #0f0f1a; border: 1px solid #333; border-radius: 4px; padding: 10px; margin-bottom: 8px; }
    .drop-rate-label { width: 80px; font-weight: bold; }
    .drop-rate-calc { width: 80px; text-align: right; font-weight: bold; }
    .affix-pool-tabs { display: flex; gap: 10px; margin-bottom: 10px; }
    .affix-pool-tab { padding: 6px 15px; background: #0f3460; border-radius: 4px; cursor: pointer; border: 1px solid transparent; }
    .affix-pool-tab.active { background: #3498db; border-color: #3498db; font-weight: bold; }
    .preview-box { background: #111; border: 1px solid #444; padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 12px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
    .preview-box span { color: #2ecc71; font-weight: bold; }
  </style>
</head>
<body>

  <h1>⚙️ 配置中心 (模块化版)</h1>
  
  <div style="display:flex; gap:10px; margin-bottom:15px; padding: 0 15px; flex-wrap: wrap;">
    <button class="btn" style="background:#9b59b6;" onclick="runFastSimulation()">⚡ 真实模拟 100 次</button>
    <button class="btn" style="background:#3498db;" onclick="testLevelUpAll(10)">🔼 全员 +10级</button>
    <button class="btn" style="background:#e74c3c;" onclick="testResetLevel()">🔄 重置 Lv.1</button>
    
    <button class="btn" style="background:#27ae60;" onclick="exportGameData()">📤 導出全部數據</button>
    <button class="btn" style="background:#f39c12;" onclick="document.getElementById('import-file-input').click()">📥 導入全部數據</button>
    <input type="file" id="import-file-input" style="display:none" accept=".json" onchange="importGameData(event)">
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="char" onclick="switchTab('char')">👾 角色</div>
    <div class="tab" data-tab="skill" onclick="switchTab('skill')">⚔️ 技能</div>
    <div class="tab" data-tab="status" onclick="switchTab('status')">🌊 状态</div>
    <div class="tab" data-tab="item" onclick="switchTab('item')">🎒 物品</div>
    <div class="tab" data-tab="shop" onclick="switchTab('shop')">🛒 商店</div>
    <div class="tab" data-tab="stage" onclick="switchTab('stage')">🗺️ 关卡</div>
    <div class="tab" data-tab="story" onclick="switchTab('story')">📖 劇本</div>
    <div class="tab" data-tab="growth" onclick="switchTab('growth')">📈 成长与经验</div>
    <div class="tab" data-tab="global" onclick="switchTab('global')">⚙️ 全局设置</div>
    <div class="tab" data-tab="main_ui" onclick="switchTab('main_ui')">🖼️ 主頁UI</div>
    <div class="tab" data-tab="ui_editor" onclick="switchTab('ui_editor')">🎨 劇本UI佈局</div>
    <div class="tab" data-tab="chapter_map" onclick="switchTab('chapter_map')">🎨 章節UI佈局</div>
  </div>

  <div id="app-content"></div>

  <div class="bottom-bar">
    <a href="index.html" class="btn btn-play" onclick="saveData(); window.location.href='index.html?t='+Date.now(); return false;">🚀 保存并返回游戏</a>
    <button class="btn btn-reset" onclick="if(confirm('确定重置所有数据？')){ localStorage.clear(); location.reload(); }">⚠️ 重置数据</button>
  </div>

  <script src="core.js"></script>
  <script src="tab_char.js"></script>
  <script src="tab_growth.js"></script>
  <script src="tab_skill.js"></script>
  <script src="tab_status.js"></script>
  <script src="tab_item.js"></script>
  <script src="tab_shop.js"></script>
  <script src="tab_stage.js"></script>
  <script src="tab_global.js"></script>
  <script src="tab_story.js"></script>
  <script src="tab_main_ui.js"></script>
  <script src="tab_ui_editor.js"></script>
  <script src="tab_chapter_map.js"></script>

  <script>
    let currentTab = 'char';

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      const activeTabEl = document.querySelector(`.tab[data-tab="${tab}"]`);
      if (activeTabEl) activeTabEl.classList.add('active');

      const container = document.getElementById('app-content');
      container.innerHTML = ''; 

      if (tab === 'char' && window.renderTabChar) window.renderTabChar(container);
      else if (tab === 'growth' && window.renderTabGrowth) window.renderTabGrowth(container);
      else if (tab === 'skill' && window.renderTabSkill) window.renderTabSkill(container);
      else if (tab === 'status' && window.renderTabStatus) window.renderTabStatus(container);
      else if (tab === 'item' && window.renderTabItem) window.renderTabItem(container);
      else if (tab === 'shop' && window.renderTabShop) window.renderTabShop(container);
      else if (tab === 'stage' && window.renderTabStage) window.renderTabStage(container);
      else if (tab === 'global' && window.renderTabGlobal) window.renderTabGlobal(container);
      else if (tab === 'story' && window.renderTabStory) window.renderTabStory(container);
      else if (tab === 'main_ui' && window.renderTabMainUI) window.renderTabMainUI(container);
      else if (tab === 'ui_editor' && window.renderTabUIEditor) window.renderTabUIEditor(container);
      else if (tab === 'chapter_map' && window.renderTabChapterMap) window.renderTabChapterMap(container);
    }

    window.exportGameData = function() {
      const dataToExport = {};
      const keysToExport = [
        'my_game_data_v22', 'my_game_skills_v22', 'my_game_statuses_v22',
        'my_game_items_v22', 'my_game_levels_v22', 'my_game_inventory_v22',
        'my_game_config', 'my_game_characters', 'my_game_skills_sync',
        'my_game_statuses_sync', 'my_game_items_sync', 'my_game_levels_sync',
        'my_game_inventory_sync', 'my_game_ui_layout'
      ];
      
      keysToExport.forEach(key => {
        const val = localStorage.getItem(key);
        if (val) {
          try { dataToExport[key] = JSON.parse(val); } catch(e) { dataToExport[key] = val; }
        }
      });

      const jsonStr = JSON.stringify(dataToExport, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const blobUrl = URL.createObjectURL(blob);

      const downloadAnchor = document.createElement('a');
      downloadAnchor.href = blobUrl;
      downloadAnchor.download = `wuxia_game_backup_${Date.now()}.json`;
      
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();

      setTimeout(() => { downloadAnchor.remove(); URL.revokeObjectURL(blobUrl); }, 1000);
    };

    window.importGameData = function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (confirm('⚠️ 確定要導入數據嗎？這將會覆蓋當前編輯器的所有進度！')) {
            Object.keys(importedData).forEach(key => {
              const val = importedData[key];
              if (typeof val === 'object') { localStorage.setItem(key, JSON.stringify(val)); } 
              else { localStorage.setItem(key, val); }
            });
            alert('✅ 數據導入成功，即將重新載入頁面！');
            location.reload();
          }
        } catch(err) {
          alert('❌ 導入失敗：檔案格式不正確或不是有效的 JSON 檔案！');
        }
      };
      reader.readAsText(file);
    };

    window.runFastSimulation = function() {
      const lv = gameLevels[0];
      if (!lv || !lv.enemyList || lv.enemyList.length === 0) {
        return alert("请先去【关卡】配置里，给第一关摆放至少一个敌人再进行模拟！");
      }
      
      const pChars = gameChars.filter(c => c.side === 'player');
      if (pChars.length === 0) return alert("没有找到任何我方角色！");

      const simCount = 100;
      let wins = 0, totalRounds = 0;

      for(let i = 0; i < simCount; i++) {
        let pUnits = pChars.map(c => window.calcPreviewStats(c));
        let eUnits = lv.enemyList.map(item => {
          const orig = gameChars.find(c => c.id === item.id);
          return orig ? window.calcPreviewStats(orig) : null;
        }).filter(Boolean);

        if (eUnits.length === 0) return alert("关卡中的敌人数据丢失，请重新配置关卡！");

        let pMax = pUnits.reduce((s, u) => s + u.maxHp, 0);
        let eMax = eUnits.reduce((s, u) => s + u.maxHp, 0);
        
        let round = 1;
        while(round <= 20 && pMax > 0 && eMax > 0) {
           let pAtk = pUnits.reduce((s, u) => s + u.atk, 0);
           let eAtk = eUnits.reduce((s, u) => s + u.atk, 0);
           let pDmg = pAtk * 1.5; 
           let eDmg = eAtk * 1.2;
           eMax -= pDmg;
           if(eMax > 0) pMax -= eDmg;
           round++;
        }
        if(eMax <= 0) wins++;
        totalRounds += Math.min(round, 20);
      }
      
      alert(`📊 100次后台模拟结果：\n-------------------------\n对战敌人：第一关配置的怪物\n胜率：${wins}%\n平均回合：${(totalRounds/simCount).toFixed(1)}`);
    };

    window.onload = () => { switchTab('char'); };
  </script>
</body>
</html>
