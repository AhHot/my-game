<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>遊戲配置中心 (完整全功能版)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #1a1a2e; color: #fff; padding: 15px; padding-bottom: 120px; }
    h1 { font-size: 24px; text-align: center; margin-bottom: 20px; color: #f1c40f; }
    .tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 15px; }
    .tab { flex: 1; min-width: 13%; padding: 10px; text-align: center; background: #16213e; border-radius: 6px; cursor: pointer; border: 1px solid #0f3460; font-size: 12px;}
    .tab.active { background: #3498db; border-color: #3498db; font-weight: bold; }
    .search-bar { display: flex; gap: 10px; margin-bottom: 15px; }
    .search-bar input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #0f0f1a; color: #fff; font-size: 14px; }
    .sub-tabs { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
    .sub-tab { flex: 1; min-width: 15%; padding: 8px; text-align: center; background: #0f3460; border-radius: 4px; cursor: pointer; font-size: 11px; border: 1px solid transparent; }
    .sub-tab.active { background: #e74c3c; border-color: #e74c3c; font-weight: bold; }
    .card { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .card-header h3 { color: #3498db; }
    .btn-del { background: #e74c3c; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; font-size: 14px; cursor:pointer;}
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .form-item { display: flex; flex-direction: column; }
    .form-item.full { grid-column: span 2; }
    .form-item label { font-size: 11px; color: #aaa; margin-bottom: 4px; }
    .form-item input, .form-item select, .form-item textarea { background: #0f0f1a; color: #fff; border: 1px solid #444; padding: 6px; border-radius: 4px; font-size: 13px; width: 100%; }
    .sub-title { color: #f1c40f; font-size: 14px; margin-top: 15px; margin-bottom: 5px; font-weight: bold; border-bottom: 1px dashed #444; padding-bottom: 5px; grid-column: span 2;}
    .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #16213e; padding: 15px; border-top: 1px solid #333; display: flex; gap: 10px; z-index: 100; }
    .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; color: #fff; text-align: center; text-decoration: none; cursor:pointer;}
    .btn-play { background: #2ecc71; }
    .btn-reset { background: #e74c3c; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
    th, td { padding: 4px 8px; text-align: left; border-bottom: 1px solid #222; font-size: 12px; }
  </style>
</head>
<body>

  <h1>⚙️ 遊戲配置中心 (完整功能版)</h1>
  
  <div style="display:flex; gap:10px; margin-bottom:15px;">
    <button class="btn" style="background:#e67e22;" onclick="loadMVP5Team()">⚔️ 一鍵加載 MVP 5人陣容</button>
    <button class="btn" style="background:#9b59b6;" onclick="runFastSimulation()">⚡ 快速模擬 100 次戰鬥</button>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('char')">👾 角色</div>
    <div class="tab" onclick="switchTab('skill')">⚔️ 技能</div>
    <div class="tab" onclick="switchTab('status')">🌊 狀態</div>
    <div class="tab" onclick="switchTab('item')">🎒 物品</div>
    <div class="tab" onclick="switchTab('level')">🗺️ 關卡</div>
    <div class="tab" onclick="switchTab('global')">⚙️ 全局</div>
    <div class="tab" onclick="switchTab('ui')">🎨 UI</div>
  </div>

  <!-- 角色分頁 -->
  <div id="char-section">
    <div class="search-bar"><input type="text" id="search-char" placeholder="🔍 搜索角色..." oninput="render()"></div>
    <div class="sub-tabs">
      <div class="sub-tab active" id="tab-char-player" onclick="switchSubTab('char', 'player')">我方</div>
      <div class="sub-tab" id="tab-char-enemy" onclick="switchSubTab('char', 'enemy')">敵方</div>
    </div>
    <div id="char-list"></div>
    <button class="btn" style="background:#3498db; width:100%; margin-bottom:20px;" onclick="addChar()">➕ 新增角色</button>
  </div>

  <!-- 技能分頁 -->
  <div id="skill-section" style="display:none;">
    <div class="search-bar"><input type="text" id="search-skill" placeholder="🔍 搜索技能..." oninput="render()"></div>
    <div class="sub-tabs">
      <div class="sub-tab active" id="tab-skill-active" onclick="switchSubTab('skill', 'active')">主動/治療</div>
      <div class="sub-tab" id="tab-skill-followup" onclick="switchSubTab('skill', 'followup')">追打</div>
      <div class="sub-tab" id="tab-skill-passive" onclick="switchSubTab('skill', 'passive')">被動/光環</div>
    </div>
    <div id="skill-list"></div>
    <button class="btn" style="background:#3498db; width:100%; margin-bottom:20px;" onclick="addSkill()">➕ 新增技能</button>
  </div>

  <!-- 狀態分頁 -->
  <div id="status-section" style="display:none;">
    <div class="search-bar"><input type="text" id="search-status" placeholder="🔍 搜索狀態..." oninput="render()"></div>
    <div id="status-list"></div>
    <button class="btn" style="background:#3498db; width:100%; margin-bottom:20px;" onclick="addStatus()">➕ 新增狀態</button>
  </div>

  <!-- 物品分頁 -->
  <div id="item-section" style="display:none;">
    <div class="search-bar"><input type="text" id="search-item" placeholder="🔍 搜索物品..." oninput="render()"></div>
    <div class="sub-tabs">
      <div class="sub-tab active" id="tab-item-weapon" onclick="switchSubTab('item', 'weapon')">武器</div>
      <div class="sub-tab" id="tab-item-armor" onclick="switchSubTab('item', 'armor')">防具</div>
      <div class="sub-tab" id="tab-item-accessory" onclick="switchSubTab('item', 'accessory')">飾品</div>
      <div class="sub-tab" id="tab-item-consumable" onclick="switchSubTab('item', 'consumable')">消耗品</div>
    </div>
    <div id="item-list"></div>
    <button class="btn" style="background:#3498db; width:100%; margin-bottom:20px;" onclick="addItem()">➕ 新增物品模板</button>
  </div>

  <!-- 關卡分頁 -->
  <div id="level-section" style="display:none;">
    <div id="level-list"></div>
    <button class="btn" style="background:#3498db; width:100%; margin-bottom:20px;" onclick="addLevel()">➕ 新增關卡</button>
  </div>

  <!-- 全局設定分頁 -->
  <div id="global-section" style="display:none;">
    <div class="card">
      <h3 style="color:#f1c40f; margin-bottom:15px;">⚔️ 戰鬥基礎參數</h3>
      <div id="global-config-fields" class="form-grid"></div>
    </div>
    <button class="btn btn-play" style="width:100%; margin-bottom:20px;" onclick="saveGlobalConfig()">💾 保存全局設定</button>
  </div>

  <!-- UI 設定分頁 -->
  <div id="ui-section" style="display:none;">
    <div class="card">
      <h3 style="color:#f1c40f; margin-bottom:15px;">🎨 UI 外觀設定</h3>
      <div class="form-grid">
        <div class="form-item full"><label>介面主題顏色</label><input type="text" id="ui-bg-color" value="#1e2028"></div>
      </div>
      <button class="btn btn-play" style="width:100%; margin-top:20px;" onclick="saveUIConfig()">💾 保存 UI 設定</button>
    </div>
  </div>

  <div class="bottom-bar">
    <a href="index.html" class="btn btn-play" onclick="saveData(); window.location.href='index.html?t='+Date.now(); return false;">🚀 保存並返回遊戲</a>
    <button class="btn btn-reset" onclick="resetData()">⚠️ 重置數據</button>
  </div>

  <script src="data.js"></script>
  <script src="battle.js"></script>

  <script>
    const FOLLOWUP_TAGS = [
      { val: '', label: '無 (不產生/不響應)' },
      { val: 'po_shi', label: '【破勢】(刀劍兵刃系)' },
      { val: 'zhen_chan', label: '【震顫】(拳棍擊打系)' },
      { val: 'zhi_qi', label: '【滯氣】(內功氣功系)' },
      { val: 'feng_hou', label: '【封喉】(刺客收割系)' },
      { val: 'te_shu', label: '【特殊】(少數專屬機制)' }
    ];

    let currentTab = 'char';
    let subTab = { char: 'player', skill: 'active', item: 'weapon' };

    let gameChars = [], gameSkills = [], gameStatuses = [], gameItems = [], gameLevels = [];
    try {
      gameChars = JSON.parse(localStorage.getItem('my_game_data_v22') || '[]');
      gameSkills = JSON.parse(localStorage.getItem('my_game_skills_v22') || '[]');
      gameStatuses = JSON.parse(localStorage.getItem('my_game_statuses_v22') || '[]');
      gameItems = JSON.parse(localStorage.getItem('my_game_items_v22') || '[]');
      gameLevels = JSON.parse(localStorage.getItem('my_game_levels_v22') || '[]');
    } catch(e) { console.warn("初始化載入警告", e); }

    let globalData = {};
    try {
      globalData = JSON.parse(localStorage.getItem('my_game_config') || '{"config":{"MAX_ROUNDS":50}}');
    } catch(e) { globalData = { config: { MAX_ROUNDS: 50 } }; }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      ['char','skill','status','item','level','global','ui'].forEach(k => { 
        const el = document.getElementById(k+'-section');
        if (el) el.style.display = tab === k ? 'block' : 'none'; 
      });
      render();
    }

    function switchSubTab(tab, sub) {
      subTab[tab] = sub;
      const ids = { char: ['player', 'enemy'], skill: ['active', 'followup', 'passive'], item: ['weapon', 'armor', 'accessory', 'consumable'] };
      if (ids[tab]) {
        ids[tab].forEach(s => { 
          const el = document.getElementById(`tab-${tab}-${s}`);
          if (el) el.classList.remove('active'); 
        });
        const target = document.getElementById(`tab-${tab}-${sub}`);
        if (target) target.classList.add('active');
      }
      render();
    }

    function render() {
      if (currentTab === 'char') renderChars();
      if (currentTab === 'skill') renderSkills();
      if (currentTab === 'status') renderStatuses();
      if (currentTab === 'item') renderItems();
      if (currentTab === 'level') renderLevels();
      if (currentTab === 'global') renderGlobal();
    }

    function getSkillOptions(selectedId) {
      let html = `<option value="">(無)</option>`;
      gameSkills.forEach(sk => { html += `<option value="${sk.id}" ${selectedId === sk.id ? 'selected' : ''}>[${sk.type}] ${sk.name}</option>`; });
      return html;
    }

    function renderChars() {
      const list = document.getElementById('char-list'); if (!list) return;
      list.innerHTML = '';
      const keyword = document.getElementById('search-char')?.value.toLowerCase() || '';
      
      gameChars.forEach((char, index) => {
        if (char.side !== subTab.char) return;
        if (keyword && !char.name.toLowerCase().includes(keyword)) return;
        if (!char.skillSlots) char.skillSlots = { skill: '', followup: '' };
        if (!char.stats) char.stats = { fengRui: 0, hunHou: 0, lingDong: 0, jianRen: 0, guiMi: 0, jueQing: 0 };

        const div = document.createElement('div'); div.className = 'card';
        div.innerHTML = `
          <div class="card-header"><h3>${char.emoji || '👤'} ${char.name}</h3><button class="btn-del" onclick="deleteChar(${index})">刪除</button></div>
          <div class="form-grid">
            <div class="form-item"><label>姓名</label><input type="text" value="${char.name}" onchange="updateChar(${index}, 'name', this.value)"></div>
            <div class="form-item"><label>圖標</label><input type="text" value="${char.emoji || ''}" onchange="updateChar(${index}, 'emoji', this.value)"></div>
            
            <div class="form-item full"><label>角色全身立繪 (Portrait URL)</label><input type="text" value="${char.portrait||''}" placeholder="assets/portraits/char.png" onchange="updateChar(${index}, 'portrait', this.value)"></div>
            <div class="form-item full"><label>角色戰鬥頭像 (Avatar URL)</label><input type="text" value="${char.avatar||''}" placeholder="assets/avatars/head.png" onchange="updateChar(${index}, 'avatar', this.value)"></div>

            <div class="form-item"><label>生命</label><input type="number" value="${char.maxHp}" onchange="updateChar(${index}, 'maxHp', parseInt(this.value))"></div>
            <div class="form-item"><label>攻擊</label><input type="number" value="${char.atk}" onchange="updateChar(${index}, 'atk', parseInt(this.value))"></div>
            
            <div class="sub-title">六大意境</div>
            <div class="form-item"><label style="color:#e67e22;">鋒銳</label><input type="number" value="${char.stats.fengRui || 0}" onchange="updateCharStat(${index}, 'fengRui', parseInt(this.value))"></div>
            <div class="form-item"><label style="color:#e74c3c;">渾厚</label><input type="number" value="${char.stats.hunHou || 0}" onchange="updateCharStat(${index}, 'hunHou', parseInt(this.value))"></div>
            <div class="form-item"><label style="color:#2ecc71;">靈動</label><input type="number" value="${char.stats.lingDong || 0}" onchange="updateCharStat(${index}, 'lingDong', parseInt(this.value))"></div>
            <div class="form-item"><label style="color:#3498db;">堅韌</label><input type="number" value="${char.stats.jianRen || 0}" onchange="updateCharStat(${index}, 'jianRen', parseInt(this.value))"></div>
            <div class="form-item"><label style="color:#9b59b6;">詭秘</label><input type="number" value="${char.stats.guiMi || 0}" onchange="updateCharStat(${index}, 'guiMi', parseInt(this.value))"></div>
            <div class="form-item"><label style="color:#f1c40f;">絕情</label><input type="number" value="${char.stats.jueQing || 0}" onchange="updateCharStat(${index}, 'jueQing', parseInt(this.value))"></div>

            <div class="form-item full">
              <label>技能裝配</label>
              <div style="display:flex; gap:5px; margin-bottom:5px;"><span style="width:50px;">主動:</span><select style="flex:1;" onchange="updateSkillSlot(${index}, 'skill', this.value)">${getSkillOptions(char.skillSlots.skill)}</select></div>
              <div style="display:flex; gap:5px; margin-bottom:5px;"><span style="width:50px; color:#e74c3c;">追打:</span><select style="flex:1;" onchange="updateSkillSlot(${index}, 'followup', this.value)">${getSkillOptions(char.skillSlots.followup)}</select></div>
            </div>
          </div>`;
        list.appendChild(div);
      });
    }

    function renderSkills() {
      const list = document.getElementById('skill-list'); if (!list) return;
      list.innerHTML = '';
      const keyword = document.getElementById('search-skill')?.value.toLowerCase() || '';

      gameSkills.forEach((skill, index) => {
        if (subTab.skill === 'active' && ['followup', 'passive'].includes(skill.type)) return;
        if (subTab.skill === 'followup' && skill.type !== 'followup') return;
        if (subTab.skill === 'passive' && skill.type !== 'passive') return;
        if (keyword && !skill.name.toLowerCase().includes(keyword)) return;

        const div = document.createElement('div'); div.className = 'card';
        div.innerHTML = `
          <div class="card-header"><h3>${skill.name}</h3><button class="btn-del" onclick="deleteSkill(${index})">刪除</button></div>
          <div class="form-grid">
            <div class="form-item"><label>名稱</label><input type="text" value="${skill.name}" onchange="updateSkill(${index}, 'name', this.value)"></div>
            <div class="form-item"><label>分類</label><select onchange="updateSkill(${index}, 'type', this.value)"><option value="skill" ${skill.type==='skill'?'selected':''}>主動</option><option value="followup" ${skill.type==='followup'?'selected':''}>追打</option><option value="passive" ${skill.type==='passive'?'selected':''}>被動</option></select></div>
            
            <div class="form-item full"><label>技能圖標 (Icon URL)</label><input type="text" value="${skill.iconImg||''}" placeholder="assets/skills/icon.png" onchange="updateSkill(${index}, 'iconImg', this.value)"></div>
            <div class="form-item full"><label>技能詳細介紹 (Desc)</label><textarea rows="2" onchange="updateSkill(${index}, 'desc', this.value)">${skill.desc||''}</textarea></div>

            <div class="form-item"><label>傷害倍率</label><input type="number" step="0.1" value="${skill.multiplier || 0}" onchange="updateSkill(${index}, 'multiplier', parseFloat(this.value))"></div>

            <div class="sub-title">⚔️ 追打標籤機制（下拉選單）</div>
            <div class="form-item">
              <label style="color:#2ecc71;">發起標籤 (comboTagOut)</label>
              <select onchange="updateSkill(${index}, 'comboTagOut', this.value)">
                ${FOLLOWUP_TAGS.map(t => `<option value="${t.val}" ${skill.comboTagOut===t.val?'selected':''}>${t.label}</option>`).join('')}
              </select>
            </div>
            <div class="form-item">
              <label style="color:#e74c3c;">響應標籤 (comboTagIn)</label>
              <select onchange="updateSkill(${index}, 'comboTagIn', this.value)">
                ${FOLLOWUP_TAGS.map(t => `<option value="${t.val}" ${skill.comboTagIn===t.val?'selected':''}>${t.label}</option>`).join('')}
              </select>
            </div>
          </div>`;
        list.appendChild(div);
      });
    }

    function renderStatuses() {
      const list = document.getElementById('status-list'); if (!list) return;
      list.innerHTML = '';
      gameStatuses.forEach((st, index) => {
        const div = document.createElement('div'); div.className = 'card';
        div.innerHTML = `<div class="card-header"><h3>${st.name}</h3><button class="btn-del" onclick="deleteStatus(${index})">刪除</button></div>`;
        list.appendChild(div);
      });
    }

    function renderItems() {
      const list = document.getElementById('item-list'); if (!list) return;
      list.innerHTML = '';
      gameItems.forEach((item, index) => {
        if (item.category !== subTab.item) return;
        const div = document.createElement('div'); div.className = 'card';
        div.innerHTML = `<div class="card-header"><h3>${item.name}</h3><button class="btn-del" onclick="deleteItem(${index})">刪除</button></div>`;
        list.appendChild(div);
      });
    }

    function renderLevels() {
      const list = document.getElementById('level-list'); if (!list) return;
      list.innerHTML = '';
      gameLevels.forEach((lv, index) => {
        const div = document.createElement('div'); div.className = 'card';
        div.innerHTML = `<div class="card-header"><h3>${lv.name}</h3><button class="btn-del" onclick="deleteLevel(${index})">刪除</button></div>`;
        list.appendChild(div);
      });
    }

    function renderGlobal() {
      const fieldsBox = document.getElementById('global-config-fields');
      if (!fieldsBox) return;
      fieldsBox.innerHTML = `<div class="form-item"><label>回合上限</label><input type="number" value="${globalData.config?.MAX_ROUNDS || 50}" onchange="globalData.config.MAX_ROUNDS = parseInt(this.value)"></div>`;
    }

    function saveGlobalConfig() {
      localStorage.setItem('my_game_config', JSON.stringify(globalData));
      alert("全局設定已保存！");
    }

    function saveUIConfig() { alert("UI設定已保存！"); }

    function saveData() {
      localStorage.setItem('my_game_data_v22', JSON.stringify(gameChars));
      localStorage.setItem('my_game_skills_v22', JSON.stringify(gameSkills));
      localStorage.setItem('my_game_statuses_v22', JSON.stringify(gameStatuses));
      localStorage.setItem('my_game_items_v22', JSON.stringify(gameItems));
      localStorage.setItem('my_game_levels_v22', JSON.stringify(gameLevels));
      localStorage.setItem('my_game_characters', JSON.stringify(gameChars));
      localStorage.setItem('my_game_skills_sync', JSON.stringify(gameSkills));
      localStorage.setItem('my_game_levels_sync', JSON.stringify(gameLevels));
    }

    function updateChar(i, k, v) { gameChars[i][k] = v; saveData(); }
    function updateCharStat(i, k, v) { if(!gameChars[i].stats) gameChars[i].stats={}; gameChars[i].stats[k] = v; saveData(); }
    function updateSkillSlot(c, s, v) { gameChars[c].skillSlots[s] = v; saveData(); }
    function updateSkill(i, k, v) { gameSkills
