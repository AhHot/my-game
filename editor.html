<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏配置中心</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #1a1a2e; color: #fff; padding: 15px; padding-bottom: 120px; }
    h1 { font-size: 24px; text-align: center; margin-bottom: 20px; color: #f1c40f; }
    .tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 15px; }
    .tab { flex: 1; min-width: 20%; padding: 10px; text-align: center; background: #16213e; border-radius: 6px; cursor: pointer; border: 1px solid #0f3460; font-size: 13px;}
    .tab.active { background: #3498db; border-color: #3498db; font-weight: bold; }
    .search-bar { display: flex; gap: 10px; margin-bottom: 15px; }
    .search-bar input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #0f0f1a; color: #fff; font-size: 14px; }
    .sub-tabs { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
    .sub-tab { flex: 1; min-width: 18%; padding: 8px; text-align: center; background: #0f3460; border-radius: 4px; cursor: pointer; font-size: 12px; border: 1px solid transparent; }
    .sub-tab.active { background: #e74c3c; border-color: #e74c3c; font-weight: bold; }
    .card { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .card-header h3 { color: #3498db; }
    .btn-del { background: #e74c3c; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; font-size: 14px; cursor:pointer;}
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .form-item { display: flex; flex-direction: column; }
    .form-item.full { grid-column: span 2; }
    .form-item label { font-size: 11px; color: #aaa; margin-bottom: 4px; }
    .form-item input, .form-item select { background: #0f0f1a; color: #fff; border: 1px solid #444; padding: 6px; border-radius: 4px; font-size: 13px; width: 100%; }
    .sub-title { color: #f1c40f; font-size: 14px; margin-top: 15px; margin-bottom: 5px; font-weight: bold; border-bottom: 1px dashed #444; padding-bottom: 5px; grid-column: span 2;}
    
    .effect-box { background: #0f3460; padding: 10px; border-radius: 4px; margin-bottom: 8px; border: 1px solid #3498db; position: relative; }
    .effect-title { font-size: 12px; color: #f1c40f; font-weight: bold; margin-bottom: 5px; display: flex; justify-content: space-between; }
    .btn-remove-effect { background: #e74c3c; color: #fff; border: none; border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer;}
    .btn-add-effect { background: #2ecc71; color: #fff; border: none; padding: 8px; width: 100%; border-radius: 4px; margin-top: 5px; cursor: pointer; font-weight: bold;}

    .level-editor-layout { display: flex; gap: 15px; }
    @media (max-width: 768px) { .level-editor-layout { flex-direction: column; } }
    .enemy-pool { flex: 1; background: #0f0f1a; padding: 10px; border-radius: 8px; max-height: 400px; overflow-y: auto; border: 1px solid #333;}
    .enemy-pool-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid #222; cursor: pointer; transition: background 0.2s; }
    .enemy-pool-item:active { background: #3498db; }
    .enemy-pool-item.error { background: #e74c3c; color: white; }
    
    .grid-container { flex: 1; display: flex; justify-content: center; flex-direction: column;}
    .board-wrapper { position: relative; width: 100%; max-width: 400px; aspect-ratio: 1; background: #0f0f1a; border: 2px solid #333; border-radius: 8px; overflow: hidden; margin: 0 auto;}
    .bg-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    .bg-cell { border: 1px solid #222; }
    
    .unit-block { position: absolute; background: rgba(52, 152, 219, 0.6); border: 2px solid #3498db; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: grab; touch-action: none; user-select: none; z-index: 10; }
    .unit-block.invalid { background: rgba(231, 76, 60, 0.6); border-color: #e74c3c; }
    .unit-block .block-emoji { font-size: 32px; pointer-events: none; }
    .unit-block .block-del { position: absolute; top: -8px; right: -8px; background: #e74c3c; color: white; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; cursor: pointer; z-index: 11; border: 2px solid #fff; }
    
    .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #16213e; padding: 15px; border-top: 1px solid #333; display: flex; gap: 10px; z-index: 100; }
    .btn { flex: 1; padding: 15px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; color: #fff; text-align: center; text-decoration: none; cursor:pointer;}
    .btn-play { background: #2ecc71; }
    .btn-reset { background: #e74c3c; }

    table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
    th, td { padding: 4px 8px; text-align: left; border-bottom: 1px solid #222; }
    input[type="color"] { padding: 0; height: 30px; cursor: pointer; }

    .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; }
    .checkbox-item { display: flex; align-items: center; gap: 4px; background: #0f0f1a; padding: 4px 8px; border-radius: 4px; border: 1px solid #333; cursor: pointer; font-size: 12px; }
    .checkbox-item input { width: auto; }
    
    .drop-rate-row { display: flex; align-items: center; gap: 10px; background: #0f0f1a; border: 1px solid #333; border-radius: 4px; padding: 10px; margin-bottom: 8px; }
    .drop-rate-label { width: 80px; font-weight: bold; }
    .drop-rate-calc { width: 80px; text-align: right; font-weight: bold; }

    .affix-pool-tabs { display: flex; gap: 10px; margin-bottom: 10px; }
    .affix-pool-tab { padding: 6px 15px; background: #0f3460; border-radius: 4px; cursor: pointer; border: 1px solid transparent; }
    .affix-pool-tab.active { background: #3498db; border-color: #3498db; font-weight: bold; }
  </style>
</head>
<body>

  <h1>⚙️ 配置中心 (v13.1 UI配置版)</h1>
  
  <div class="tabs">
    <div class="tab active" onclick="switchTab('char')">👾 角色</div>
    <div class="tab" onclick="switchTab('skill')">⚔️ 技能</div>
    <div class="tab" onclick="switchTab('status')">🌊 状态</div>
    <div class="tab" onclick="switchTab('item')">🎒 物品</div>
    <div class="tab" onclick="switchTab('level')">🗺️ 关卡</div>
    <div class="tab" onclick="switchTab('global')">⚙️ 全局设置</div>
    <div class="tab" onclick="switchTab('ui')">🎨 UI 设置</div> <!-- 新增的标签 -->
  </div>

  <!-- 角色 -->
  <div id="char-section">
    <div class="search-bar"><input type="text" id="search-char" placeholder="🔍 搜索角色..." oninput="render()"></div>
    <div class="sub-tabs">
      <div class="sub-tab active" id="tab-char-player" onclick="switchSubTab('char', 'player')">我方</div>
      <div class="sub-tab" id="tab-char-enemy" onclick="switchSubTab('char', 'enemy')">敌方</div>
    </div>
    <div id="char-list"></div>
    <button class="btn" style="background:#3498db; width:100%; margin-bottom:20px;" onclick="addChar()">➕ 新增角色</button>
  </div>

  <!-- 技能 -->
  <div id="skill-section" style="display:none;">
    <div class="search-bar"><input type="text" id="search-skill" placeholder="🔍 搜索技能..." oninput="render()"></div>
    <div class="sub-tabs">
      <div class="sub-tab active" id="tab-skill-active" onclick="switchSubTab('skill', 'active')">主动/治疗</div>
      <div class="sub-tab" id="tab-skill-followup" onclick="switchSubTab('skill', 'followup')">追打</div>
      <div class="sub-tab" id="tab-skill-passive" onclick="switchSubTab('skill', 'passive')">被动/光环</div>
    </div>
    <div id="skill-list"></div>
    <button class="btn" style="background:#3498db; width:100%; margin-bottom:20px;" onclick="addSkill()">➕ 新增技能</button>
  </div>

  <!-- 状态 -->
  <div id="status-section" style="display:none;">
    <div class="search-bar"><input type="text" id="search-status" placeholder="🔍 搜索状态..." oninput="render()"></div>
    <div id="status-list"></div>
    <button class="btn" style="background:#3498db; width:100%; margin-bottom:20px;" onclick="addStatus()">➕ 新增状态</button>
  </div>

  <!-- 物品 -->
  <div id="item-section" style="display:none;">
    <div class="search-bar"><input type="text" id="search-item" placeholder="🔍 搜索物品..." oninput="render()"></div>
    <div class="sub-tabs">
      <div class="sub-tab active" id="tab-item-weapon" onclick="switchSubTab('item', 'weapon')">武器</div>
      <div class="sub-tab" id="tab-item-armor" onclick="switchSubTab('item', 'armor')">防具</div>
      <div class="sub-tab" id="tab-item-accessory" onclick="switchSubTab('item', 'accessory')">饰品</div>
    </div>
    <div id="item-list"></div>
    <button class="btn" style="background:#3498db; width:100%; margin-bottom:20px;" onclick="addItem()">➕ 新增物品模板</button>
    <button class="btn" style="background:#e67e22; width:100%; margin-bottom:20px;" onclick="grantItem()">🎁 发放随机实例物品</button>
  </div>

  <!-- 关卡 -->
  <div id="level-section" style="display:none;">
    <div id="level-list"></div>
    <button class="btn" style="background:#3498db; width:100%; margin-bottom:20px;" onclick="addLevel()">➕ 新增关卡</button>
  </div>

  <!-- 全局设置 -->
  <div id="global-section" style="display:none;">
    <!-- 这里的代码完全没变，为了篇幅省略，你直接保持原来的即可 -->
  </div>

  <!-- 新增：UI 设置 -->
  <div id="ui-section" style="display:none;">
    <div class="card">
      <h3 style="color:#f1c40f; margin-bottom:15px;">🎨 角色属性面板外观</h3>
      <p style="color:#aaa; font-size:12px; margin-bottom:15px;">在这里修改后，点击保存，去游戏里点开面板就能看到变化。</p>
      
      <div class="form-grid">
        <div class="form-item full">
          <label>背景图片网址 (留空则使用背景色)</label>
          <input type="text" id="ui-bg-image" placeholder="例如: https://你的图床链接.jpg">
        </div>
        
        <div class="form-item">
          <label>背景颜色 (十六进制或英文)</label>
          <input type="text" id="ui-bg-color" value="#1e2028" placeholder="#1e2028">
        </div>
        
        <div class="form-item">
          <label>边框颜色</label>
          <input type="text" id="ui-border-color" value="#4a4a4a" placeholder="#4a4a4a">
        </div>
      </div>

      <button class="btn btn-play" style="width:100%; margin-top:20px;" onclick="saveUIConfig()">💾 保存 UI 设置</button>
    </div>
  </div>

  <div class="bottom-bar">
    <a href="index.html" class="btn btn-play" onclick="window.location.href='index.html?t='+Date.now(); return false;">🚀 保存并返回游戏</a>
    <button class="btn btn-reset" onclick="resetData()">⚠️ 重置数据</button>
  </div>

  <script>
    // 原有的变量和逻辑...（为了让你复制不遗漏，这里保留原始所有的 JS，只增加 UI 逻辑）

    // ... [保留你原本的所有 DEFAULT_xxx 数据与函数] ...

    // ==============================
    // 新增：UI 配置逻辑
    // ==============================
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => { 
        if (t.innerText.includes({ char:'角色', skill:'技能', status:'状态', item:'物品', level:'关卡', global:'设置', ui:'UI' }[tab])) t.classList.add('active'); 
      });
      ['char','skill','status','item','level','global','ui'].forEach(k => { 
        const el = document.getElementById(k+'-section');
        if (el) el.style.display = tab === k ? 'block' : 'none'; 
      });
      
      if (tab === 'ui') loadUIConfig();
      else render();
    }

    function loadUIConfig() {
      const configStr = localStorage.getItem('my_game_ui_config');
      let config = { bgImage: '', bgColor: '#1e2028', borderColor: '#4a4a4a' };
      if (configStr) {
        try { config = { ...config, ...JSON.parse(configStr) }; } catch(e){}
      }
      document.getElementById('ui-bg-image').value = config.bgImage || '';
      document.getElementById('ui-bg-color').value = config.bgColor || '#1e2028';
      document.getElementById('ui-border-color').value = config.borderColor || '#4a4a4a';
    }

    function saveUIConfig() {
      const config = {
        bgImage: document.getElementById('ui-bg-image').value.trim(),
        bgColor: document.getElementById('ui-bg-color').value.trim(),
        borderColor: document.getElementById('ui-border-color').value.trim()
      };
      localStorage.setItem('my_game_ui_config', JSON.stringify(config));
      alert('✅ UI 设置已保存！点击底部【保存并返回游戏】，在游戏中点击左下角按钮查看效果。');
    }

    // 注意：你需要把原本 `editor.html` 里的所有其他 JavaScript 代码（比如 renderChars, saveData 等）保留，这里为了展示不显得太乱，只放了新增的。
    // 【强烈建议】：直接使用我提供的完整版，但如果上面这段你直接覆盖，必须确保原来的 JS 代码都在。
  </script>
</body>
</html>
