<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏配置中心</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #1a1a2e; color: #fff; padding: 15px; padding-bottom: 120px; }
    h1 { font-size: 24px; text-align: center; margin-bottom: 20px; color: #f1c40f; }
    .tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 15px; }
    .tab { flex: 1; min-width: 20%; padding: 10px; text-align: center; background: #16213e; border-radius: 6px; cursor: pointer; border: 1px solid #0f3460; font-size: 13px;}
    .tab.active { background: #3498db; border-color: #3498db; font-weight: bold; }
    .search-bar { display: flex; gap: 10px; margin-bottom: 15px; }
    .search-bar input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #0f0f1a; color: #fff; font-size: 14px; }
    .sub-tabs { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
    .sub-tab { flex: 1; min-width: 20%; padding: 8px; text-align: center; background: #0f3460; border-radius: 4px; cursor: pointer; font-size: 12px; border: 1px solid transparent; }
    .sub-tab.active { background: #e74c3c; border-color: #e74c3c; font-weight: bold; }
    .card { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .card-header h3 { color: #3498db; }
    .btn-del { background: #e74c3c; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; font-size: 14px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .form-item { display: flex; flex-direction: column; }
    .form-item.full { grid-column: span 3; }
    .form-item.half { grid-column: span 2; }
    .form-item label { font-size: 11px; color: #aaa; margin-bottom: 4px; }
    .form-item input, .form-item select { background: #0f0f1a; color: #fff; border: 1px solid #444; padding: 6px; border-radius: 4px; font-size: 13px; }
    .slot-btn { background: #0f0f1a; color: #fff; border: 1px dashed #666; padding: 10px; border-radius: 4px; cursor: pointer; text-align: left; }
    .slot-btn.equipped { border: 1px solid #2ecc71; color: #2ecc71; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #16213e; width: 90%; max-width: 400px; border-radius: 8px; border: 1px solid #3498db; padding: 20px; max-height: 80vh; overflow-y: auto; }
    .modal-title { font-size: 18px; color: #f1c40f; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #0f0f1a; margin-bottom: 10px; border-radius: 4px; border: 1px solid #444; }
    .btn-action { background: #2ecc71; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .btn-action.remove { background: #e74c3c; }
    .btn-action.replace { background: #f39c12; }
    .btn-close { background: #555; color: #fff; border: none; padding: 10px; width: 100%; border-radius: 4px; margin-top: 10px; cursor: pointer;}
    .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #16213e; padding: 15px; border-top: 1px solid #333; display: flex; gap: 10px; z-index: 100; }
    .btn { flex: 1; padding: 15px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; color: #fff; text-align: center; text-decoration: none;}
    .btn-play { background: #2ecc71; }
    .btn-reset { background: #e74c3c; }
  </style>
</head>
<body>

  <h1>⚙️ 配置中心 (v5.0 战斗进阶)</h1>
  
  <div class="tabs">
    <div class="tab active" onclick="switchTab('char')">👾 角色</div>
    <div class="tab" onclick="switchTab('skill')">⚔️ 技能</div>
    <div class="tab" onclick="switchTab('status')">🌊 状态</div>
    <div class="tab" onclick="switchTab('item')">🎒 物品</div>
    <div class="tab" onclick="switchTab('level')">🗺️ 关卡</div>
  </div>

  <div id="char-section">
    <div class="search-bar"><input type="text" id="search-char" placeholder="🔍 搜索角色名称..." oninput="render()"></div>
    <div class="sub-tabs">
      <div class="sub-tab active" id="tab-char-player" onclick="switchSubTab('char', 'player')">我方阵营</div>
      <div class="sub-tab" id="tab-char-enemy" onclick="switchSubTab('char', 'enemy')">敌方阵营</div>
    </div>
    <div id="char-list"></div>
    <button class="btn" style="background:#3498db; width:100%; margin-bottom:20px;" onclick="addChar()">➕ 新增角色</button>
  </div>

  <div id="skill-section" style="display:none;">
    <div class="search-bar"><input type="text" id="search-skill" placeholder="🔍 搜索技能名称..." oninput="render()"></div>
    <div class="sub-tabs">
      <div class="sub-tab active" id="tab-skill-active" onclick="switchSubTab('skill', 'active')">主动技能</div>
      <div class="sub-tab" id="tab-skill-followup" onclick="switchSubTab('skill', 'followup')">追打技能</div>
      <div class="sub-tab" id="tab-skill-passive" onclick="switchSubTab('skill', 'passive')">被动技能</div>
    </div>
    <div id="skill-list"></div>
    <button class="btn" style="background:#3498db; width:100%; margin-bottom:20px;" onclick="addSkill()">➕ 新增技能</button>
  </div>

  <div id="status-section" style="display:none;">
    <div class="search-bar"><input type="text" id="search-status" placeholder="🔍 搜索状态名称..." oninput="render()"></div>
    <div id="status-list"></div>
    <button class="btn" style="background:#3498db; width:100%; margin-bottom:20px;" onclick="addStatus()">➕ 新增状态</button>
  </div>

  <div id="item-section" style="display:none;">
    <div class="search-bar"><input type="text" id="search-item" placeholder="🔍 搜索物品名称..." oninput="render()"></div>
    <div class="sub-tabs">
      <div class="sub-tab active" id="tab-item-weapon" onclick="switchSubTab('item', 'weapon')">武器</div>
      <div class="sub-tab" id="tab-item-armor" onclick="switchSubTab('item', 'armor')">防具</div>
      <div class="sub-tab" id="tab-item-consumable" onclick="switchSubTab('item', 'consumable')">消耗品</div>
      <div class="sub-tab" id="tab-item-material" onclick="switchSubTab('item', 'material')">材料</div>
    </div>
    <div id="item-list"></div>
    <button class="btn" style="background:#3498db; width:100%; margin-bottom:20px;" onclick="addItem()">➕ 新增物品</button>
    <button class="btn" style="background:#e67e22; width:100%; margin-bottom:20px;" onclick="grantItem()">🎁 发放物品</button>
  </div>

  <div id="level-section" style="display:none;">
    <div id="level-list"></div>
    <button class="btn" style="background:#3498db; width:100%; margin-bottom:20px;" onclick="addLevel()">➕ 新增关卡</button>
  </div>

  <div class="bottom-bar">
    <a href="index.html?t=9999" class="btn btn-play" onclick="window.location.href='index.html?t='+Date.now(); return false;">🚀 保存并返回游戏</a>
    <button class="btn btn-reset" onclick="resetData()">⚠️ 重置数据</button>
  </div>

  <div class="modal-overlay" id="equip-modal">
    <div class="modal-content">
      <div class="modal-title" id="modal-title">选择装备</div>
      <div id="modal-list"></div>
      <button class="btn-close" onclick="closeModal()">取消 / 关闭</button>
    </div>
  </div>

  <script>
    // ===== 默认数据 =====
    const DEFAULT_CHARS = [
      { id: 'p_warrior', name: '战士', side: 'player', emoji: '⚔️', element: 'fire', maxHp: 3000, atk: 400, def: 200, speed: 8, critRate: 0.15, critDmg: 1.5, maxMp: 60, mpPerAttack: 15, hitRate: 0.1, dodgeRate: 0.05, critResist: 0.05, dmgIncrease: 0.1, dmgReduction: 0.05, dmgTakenIncrease: 0, trueDmg: 0, gridX: -1, gridY: -1, skillSlots: { normal: 'skill_slash', skill: 'skill_fireball', ultimate: '', followup: 'skill_follow_1', learned: '' }, equipment: { weapon: '', armor: '' } },
      { id: 'e_skeleton', name: '骷髅兵', side: 'enemy', emoji: '💀', element: 'dark', maxHp: 2000, atk: 200, def: 200, speed: 7, critRate: 0.05, critDmg: 1.4, maxMp: 40, mpPerAttack: 10, hitRate: 0, dodgeRate: 0.05, critResist: 0, dmgIncrease: 0, dmgReduction: 0, dmgTakenIncrease: 0, trueDmg: 0, gridX: 0, gridY: 0, skillSlots: { normal: 'skill_slash', skill: '', ultimate: '', followup: '', learned: '' }, equipment: { weapon: '', armor: '' } }
    ];

    const DEFAULT_SKILLS = [
      { id: 'skill_slash', name: '斩击', type: 'normal', element: 'fire', multiplier: 1.0, mpCost: 0, cooldown: 0, targetRule: 'frontRow', statusId: '', statusChance: 0, comboTagOut: '', comboTagIn: '', maxTriggers: 1 },
      { id: 'skill_fireball', name: '火球术', type: 'skill', element: 'fire', multiplier: 3.0, mpCost: 20, cooldown: 2, targetRule: 'frontRow', statusId: 'status_burn', statusChance: 100, comboTagOut: 'fire_hit', comboTagIn: '', maxTriggers: 1 },
      { id: 'skill_follow_1', name: '追打·烈焰斩', type: 'followup', element: 'fire', multiplier: 2.0, mpCost: 0, cooldown: 0, targetRule: 'lowestHp', statusId: '', statusChance: 0, comboTagOut: '', comboTagIn: 'fire_hit', maxTriggers: 1 }
    ];

    const DEFAULT_STATUS = [ { id: 'status_burn', name: '灼烧', type: 'debuff', duration: 3, statMod: 'none', statValue: 0, isDot: true, dotValue: 200 } ];

    const DEFAULT_ITEMS = [
      { id: 'item_sword', name: '铁剑', category: 'weapon', icon: '🗡️', desc: '一把生锈的铁剑。', rarity: 'white', atk: 100, def: 0, hp: 0, critRate: 0.05 },
      { id: 'item_shield', name: '木盾', category: 'armor', icon: '🛡️', desc: '简陋的木制盾牌。', rarity: 'green', atk: 0, def: 50, hp: 500, critResist: 0.05 }
    ];

    const DEFAULT_LEVELS = [
      { id: 'lv_1', name: '第 1 关', enemyIds: ['e_skeleton', 'e_skeleton', ''], rewardItemId: 'item_sword' }
    ];

    let currentTab = 'char';
    let subTab = { char: 'player', skill: 'active', item: 'weapon' };

    let gameChars, gameSkills, gameStatuses, gameItems, gameLevels, inventory;
    try {
      gameChars = JSON.parse(localStorage.getItem('my_game_data_v9')) || DEFAULT_CHARS;
      gameSkills = JSON.parse(localStorage.getItem('my_game_skills_v9')) || DEFAULT_SKILLS;
      gameStatuses = JSON.parse(localStorage.getItem('my_game_statuses_v9')) || DEFAULT_STATUS;
      gameItems = JSON.parse(localStorage.getItem('my_game_items_v9')) || DEFAULT_ITEMS;
      gameLevels = JSON.parse(localStorage.getItem('my_game_levels_v9')) || DEFAULT_LEVELS;
      inventory = JSON.parse(localStorage.getItem('my_game_inventory_v9')) || [
        { uid: 'inst_1', itemId: 'item_sword', equippedBy: '' },
        { uid: 'inst_2', itemId: 'item_shield', equippedBy: '' }
      ];
    } catch(e) { resetData(); }

    if (!Array.isArray(gameChars)) gameChars = DEFAULT_CHARS;
    if (!Array.isArray(gameSkills)) gameSkills = DEFAULT_SKILLS;
    if (!Array.isArray(gameStatuses)) gameStatuses = DEFAULT_STATUS;
    if (!Array.isArray(gameItems)) gameItems = DEFAULT_ITEMS;
    if (!Array.isArray(gameLevels)) gameLevels = DEFAULT_LEVELS;
    if (!Array.isArray(inventory)) inventory = [];

    const elements = ['fire', 'water', 'wind', 'light', 'dark'];
    const sides = [{ val: 'player', label: '我方' }, { val: 'enemy', label: '敌方' }];
    const skillTypes = [{ val: 'normal', label: '普攻' }, { val: 'skill', label: '招式' }, { val: 'ultimate', label: '绝技' }, { val: 'followup', label: '追打' }, { val: 'passive', label: '被动' }];
    const targetRules = [{ val: 'frontRow', label: '前排' }, { val: 'lowestHp', label: '血量最低' }, { val: 'random', label: '随机目标' }];
    const passiveTypes = [{ val: 'atkAdd', label: '攻击加成' }, { val: 'hpAdd', label: '生命加成' }, { val: 'defAdd', label: '防御加成' }, { val: 'speedAdd', label: '速度加成' }];
    const statusMods = [{ val: 'none', label: '无属性变化' }, { val: 'atk', label: '攻击力' }, { val: 'def', label: '防御力' }, { val: 'speed', label: '速度' }];
    const itemCategories = [{ val: 'weapon', label: '武器' }, { val: 'armor', label: '防具' }, { val: 'consumable', label: '消耗品' }, { val: 'material', label: '材料' }];
    const itemRarities = [{ val: 'white', label: '普通(白)' }, { val: 'green', label: '精良(绿)' }, { val: 'blue', label: '稀有(蓝)' }, { val: 'purple', label: '史诗(紫)' }, { val: 'orange', label: '传说(橙)' }];

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => { if (t.innerText.includes({char:'角色', skill:'技能', status:'状态', item:'物品', level:'关卡'}[tab])) t.classList.add('active'); });
      ['char','skill','status','item','level'].forEach(k => document.getElementById(k+'-section').style.display = tab === k ? 'block' : 'none');
      render();
    }

    function switchSubTab(tab, sub) {
      subTab[tab] = sub;
      const ids = { char: ['player', 'enemy'], skill: ['active', 'followup', 'passive'], item: ['weapon', 'armor', 'consumable', 'material'] };
      if (ids[tab]) {
        ids[tab].forEach(s => { document.getElementById(`tab-${tab}-${s}`).classList.remove('active'); });
        document.getElementById(`tab-${tab}-${sub}`).classList.add('active');
      }
      render();
    }

    function render() {
      if (currentTab === 'char') renderChars();
      if (currentTab === 'skill') renderSkills();
      if (currentTab === 'status') renderStatuses();
      if (currentTab === 'item') renderItems();
      if (currentTab === 'level') renderLevels();
    }

    function getSkillOptions(selectedId) {
      let html = `<option value="">(空)</option>`;
      gameSkills.forEach(sk => { html += `<option value="${sk.id}" ${selectedId === sk.id ? 'selected' : ''}>[${sk.type}] ${sk.name}</option>`; });
      return html;
    }

    function getStatusOptions(selectedId) {
      let html = `<option value="">(无)</option>`;
      gameStatuses.forEach(st => { html += `<option value="${st.id}" ${selectedId === st.id ? 'selected' : ''}>${st.name}</option>`; });
      return html;
    }

    function getItemNameByUid(uid) {
      if (!uid) return '空';
      const inst = inventory.find(i => i.uid === uid);
      if (!inst) return '未知';
      const item = gameItems.find(e => e.id === inst.itemId);
      return item ? item.name : '未知';
    }

    // ===== 渲染：角色（包含全新战斗属性） =====
    function renderChars() {
      const list = document.getElementById('char-list'); list.innerHTML = '';
      const keyword = document.getElementById('search-char').value.toLowerCase();
      
      gameChars.forEach((char, index) => {
        if (char.side !== subTab.char) return;
        if (keyword && !char.name.toLowerCase().includes(keyword)) return;
        
        if (!char.skillSlots) char.skillSlots = { normal: '', skill: '', ultimate: '', followup: '', learned: '' };
        if (!char.equipment) char.equipment = { weapon: '', armor: '' };
        
        // 补齐旧数据的属性，防止报错
        if (char.hitRate === undefined) char.hitRate = 0;
        if (char.dodgeRate === undefined) char.dodgeRate = 0;
        if (char.critResist === undefined) char.critResist = 0;
        if (char.dmgIncrease === undefined) char.dmgIncrease = 0;
        if (char.dmgReduction === undefined) char.dmgReduction = 0;
        if (char.dmgTakenIncrease === undefined) char.dmgTakenIncrease = 0;
        if (char.trueDmg === undefined) char.trueDmg = 0;

        const div = document.createElement('div'); div.className = 'card';
        div.innerHTML = `
          <div class="card-header"><h3>${char.emoji} ${char.name}</h3><button class="btn-del" onclick="deleteChar(${index})">删除</button></div>
          <div class="form-grid">
            <div class="form-item"><label>姓名</label><input type="text" value="${char.name}" onchange="updateChar(${index}, 'name', this.value)"></div>
            <div class="form-item"><label>图标</label><input type="text" value="${char.emoji}" onchange="updateChar(${index}, 'emoji', this.value)"></div>
            <div class="form-item"><label>属性</label><select onchange="updateChar(${index}, 'element', this.value)">${elements.map(e => `<option value="${e}" ${char.element === e ? 'selected' : ''}>${e}</option>`).join('')}</select></div>
            
            <div class="form-item"><label>生命</label><input type="number" value="${char.maxHp}" onchange="updateChar(${index}, 'maxHp', parseInt(this.value))"></div>
            <div class="form-item"><label>攻击</label><input type="number" value="${char.atk}" onchange="updateChar(${index}, 'atk', parseInt(this.value))"></div>
            <div class="form-item"><label>防御</label><input type="number" value="${char.def}" onchange="updateChar(${index}, 'def', parseInt(this.value))"></div>
            <div class="form-item"><label>速度</label><input type="number" value="${char.speed}" onchange="updateChar(${index}, 'speed', parseInt(this.value))"></div>
            
            <div class="form-item"><label>暴击(%)</label><input type="number" step="0.01" value="${char.critRate}" onchange="updateChar(${index}, 'critRate', parseFloat(this.value))"></div>
            <div class="form-item"><label>抗暴(%)</label><input type="number" step="0.01" value="${char.critResist}" onchange="updateChar(${index}, 'critResist', parseFloat(this.value))"></div>
            <div class="form-item"><label>命中(%)</label><input type="number" step="0.01" value="${char.hitRate}" onchange="updateChar(${index}, 'hitRate', parseFloat(this.value))"></div>
            <div class="form-item"><label>闪避(%)</label><input type="number" step="0.01" value="${char.dodgeRate}" onchange="updateChar(${index}, 'dodgeRate', parseFloat(this.value))"></div>
            <div class="form-item"><label>伤害增加</label><input type="number" step="0.01" value="${char.dmgIncrease}" onchange="updateChar(${index}, 'dmgIncrease', parseFloat(this.value))"></div>
            <div class="form-item"><label>伤害减少</label><input type="number" step="0.01" value="${char.dmgReduction}" onchange="updateChar(${index}, 'dmgReduction', parseFloat(this.value))"></div>
            <div class="form-item"><label>受伤增加</label><input type="number" step="0.01" value="${char.dmgTakenIncrease}" onchange="updateChar(${index}, 'dmgTakenIncrease', parseFloat(this.value))"></div>
            <div class="form-item"><label>真实伤害</label><input type="number" value="${char.trueDmg}" onchange="updateChar(${index}, 'trueDmg', parseInt(this.value))"></div>
            
            <div class="form-item full">
              <label>装备槽</label>
              <div style="display:flex; gap:10px; margin-top:5px;">
                <button class="slot-btn ${char.equipment.weapon ? 'equipped' : ''}" style="flex:1;" onclick="openItemModal(${index}, 'weapon')">⚔️ 武器: ${getItemNameByUid(char.equipment.weapon)}</button>
                <button class="slot-btn ${char.equipment.armor ? 'equipped' : ''}" style="flex:1;" onclick="openItemModal(${index}, 'armor')">🛡️ 防具: ${getItemNameByUid(char.equipment.armor)}</button>
              </div>
            </div>
            <div class="form-item full">
              <label>技能装配</label>
              <div class="skill-slot">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;"><span style="width:70px;">普攻:</span><select style="flex:1;" onchange="updateSkillSlot(${index}, 'normal', this.value)">${getSkillOptions(char.skillSlots.normal)}</select></div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;"><span style="width:70px;">招式:</span><select style="flex:1;" onchange="updateSkillSlot(${index}, 'skill', this.value)">${getSkillOptions(char.skillSlots.skill)}</select></div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;"><span style="width:70px;">绝技:</span><select style="flex:1;" onchange="updateSkillSlot(${index}, 'ultimate', this.value)">${getSkillOptions(char.skillSlots.ultimate)}</select></div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;"><span style="width:70px; color:#e74c3c;">追打:</span><select style="flex:1; border-color:#e74c3c;" onchange="updateSkillSlot(${index}, 'followup', this.value)">${getSkillOptions(char.skillSlots.followup)}</select></div>
                <div style="display:flex; justify-content:space-between; align-items:center;"><span style="width:70px; color:#f1c40f;">学习:</span><select style="flex:1;" onchange="updateSkillSlot(${index}, 'learned', this.value)">${getSkillOptions(char.skillSlots.learned)}</select></div>
              </div>
            </div>
          </div>`;
        list.appendChild(div);
      });
    }

    // ===== 渲染：技能 =====
    function renderSkills() {
      const list = document.getElementById('skill-list'); list.innerHTML = '';
      const keyword = document.getElementById('search-skill').value.toLowerCase();
      gameSkills.forEach((skill, index) => {
        if (subTab.skill === 'active' && ['followup', 'passive'].includes(skill.type)) return;
        if (subTab.skill === 'followup' && skill.type !== 'followup') return;
        if (subTab.skill === 'passive' && skill.type !== 'passive') return;
        if (keyword && !skill.name.toLowerCase().includes(keyword)) return;

        const isPassive = skill.type === 'passive';
        const div = document.createElement('div'); div.className = 'card';
        div.innerHTML = `
          <div class="card-header"><h3>${skill.name}</h3><button class="btn-del" onclick="deleteSkill(${index})">删除</button></div>
          <div class="form-grid">
            <div class="form-item"><label>名称</label><input type="text" value="${skill.name}" onchange="updateSkill(${index}, 'name', this.value)"></div>
            <div class="form-item"><label>分类</label><select onchange="updateSkill(${index}, 'type', this.value)">${skillTypes.map(t => `<option value="${t.val}" ${skill.type === t.val ? 'selected' : ''}>${t.label}</option>`).join('')}</select></div>
            <div class="form-item" style="display:${isPassive?'none':'flex'};"><label>耗蓝</label><input type="number" value="${skill.mpCost || 0}" onchange="updateSkill(${index}, 'mpCost', parseInt(this.value))"></div>
            <div class="form-item" style="display:${isPassive?'none':'flex'};"><label>冷却</label><input type="number" value="${skill.cooldown || 0}" onchange="updateSkill(${index}, 'cooldown', parseInt(this.value))"></div>
            <div class="form-item" style="display:${isPassive?'none':'flex'};"><label>倍率</label><input type="number" step="0.1" value="${skill.multiplier || 1.0}" onchange="updateSkill(${index}, 'multiplier', parseFloat(this.value))"></div>
            <div class="form-item" style="display:${isPassive?'none':'flex'};">
              <label>附加状态</label>
              <select onchange="updateSkill(${index}, 'statusId', this.value)">${getStatusOptions(skill.statusId || '')}</select>
            </div>
            <div class="form-item" style="display:${isPassive?'none':'flex'};">
              <label>概率(%)</label>
              <input type="number" value="${skill.statusChance || 0}" onchange="updateSkill(${index}, 'statusChance', parseInt(this.value))">
            </div>
            <div class="form-item full" style="display: ${isPassive ? 'none' : 'block'}; background:#1e1e2e; border:1px solid #e74c3c; padding:10px; border-radius:4px;">
              <label style="color:#e74c3c;">连携机制</label>
              <div style="display:flex; gap:10px; margin-top:5px;">
                <input type="text" placeholder="发起" value="${skill.comboTagOut || ''}" onchange="updateSkill(${index}, 'comboTagOut', this.value)" style="flex:1;">
                <input type="text" placeholder="响应" value="${skill.comboTagIn || ''}" onchange="updateSkill(${index}, 'comboTagIn', this.value)" style="flex:1;">
                <input type="number" placeholder="次数" value="${skill.maxTriggers || 1}" onchange="updateSkill(${index}, 'maxTriggers', parseInt(this.value))" style="width:60px;">
              </div>
            </div>
            <div class="form-item full" style="display: ${isPassive ? 'block' : 'none'}; background:#1e1e2e; border:1px solid #e67e22; padding:10px; border-radius:4px;">
              <label style="color:#e67e22;">被动效果</label>
              <div style="display:flex; gap:10px; margin-top:5px;">
                <select style="flex:1;" onchange="updateSkill(${index}, 'passiveType', this.value)">${passiveTypes.map(p => `<option value="${p.val}" ${skill.passiveType === p.val ? 'selected' : ''}>${p.label}</option>`).join('')}</select>
                <input type="number" style="flex:1;" value="${skill.passiveValue || 0}" onchange="updateSkill(${index}, 'passiveValue', parseInt(this.value))">
              </div>
            </div>
          </div>`;
        list.appendChild(div);
      });
    }

    // ===== 渲染：状态 =====
    function renderStatuses() {
      const list = document.getElementById('status-list'); list.innerHTML = '';
      const keyword = document.getElementById('search-status').value.toLowerCase();
      gameStatuses.forEach((st, index) => {
        if (keyword && !st.name.toLowerCase().includes(keyword)) return;
        const div = document.createElement('div'); div.className = 'card';
        div.innerHTML = `
          <div class="card-header"><h3>${st.name}</h3><button class="btn-del" onclick="deleteStatus(${index})">删除</button></div>
          <div class="form-grid">
            <div class="form-item"><label>名称</label><input type="text" value="${st.name}" onchange="updateStatus(${index}, 'name', this.value)"></div>
            <div class="form-item"><label>持续回合</label><input type="number" value="${st.duration}" onchange="updateStatus(${index}, 'duration', parseInt(this.value))"></div>
            <div class="form-item"><label>DOT扣血</label><input type="number" value="${st.dotValue}" onchange="updateStatus(${index}, 'dotValue', parseInt(this.value))"></div>
          </div>`;
        list.appendChild(div);
      });
    }

    // ===== 渲染：物品（包含新属性） =====
    function renderItems() {
      const list = document.getElementById('item-list'); list.innerHTML = '';
      const keyword = document.getElementById('search-item').value.toLowerCase();

      gameItems.forEach((item, index) => {
        if (item.category !== subTab.item) return;
        if (keyword && !item.name.toLowerCase().includes(keyword)) return;

        const isEquipment = ['weapon', 'armor'].includes(item.category);
        const isConsumable = item.category === 'consumable';

        if (item.critRate === undefined) item.critRate = 0;
        if (item.critResist === undefined) item.critResist = 0;

        const div = document.createElement('div'); div.className = 'card';
        div.innerHTML = `
          <div class="card-header"><h3>${item.icon} ${item.name}</h3><button class="btn-del" onclick="deleteItem(${index})">删除</button></div>
          <div class="form-grid">
            <div class="form-item"><label>名称</label><input type="text" value="${item.name}" onchange="updateItem(${index}, 'name', this.value)"></div>
            <div class="form-item"><label>图标</label><input type="text" value="${item.icon}" onchange="updateItem(${index}, 'icon', this.value)"></div>
            <div class="form-item"><label>分类</label><select onchange="updateItem(${index}, 'category', this.value)">${itemCategories.map(c => `<option value="${c.val}" ${item.category === c.val ? 'selected' : ''}>${c.label}</option>`).join('')}</select></div>
            
            <div class="form-item" style="display:${isEquipment?'flex':'none'};"><label>加攻击</label><input type="number" value="${item.atk||0}" onchange="updateItem(${index}, 'atk', parseInt(this.value))"></div>
            <div class="form-item" style="display:${isEquipment?'flex':'none'};"><label>加防御</label><input type="number" value="${item.def||0}" onchange="updateItem(${index}, 'def', parseInt(this.value))"></div>
            <div class="form-item" style="display:${isEquipment?'flex':'none'};"><label>加生命</label><input type="number" value="${item.hp||0}" onchange="updateItem(${index}, 'hp', parseInt(this.value))"></div>
            
            <div class="form-item" style="display:${isEquipment?'flex':'none'};"><label>加暴击</label><input type="number" step="0.01" value="${item.critRate||0}" onchange="updateItem(${index}, 'critRate', parseFloat(this.value))"></div>
            <div class="form-item" style="display:${isEquipment?'flex':'none'};"><label>加抗暴</label><input type="number" step="0.01" value="${item.critResist||0}" onchange="updateItem(${index}, 'critResist', parseFloat(this.value))"></div>

            <div class="form-item" style="display:${isConsumable?'flex':'none'};"><label>恢复生命</label><input type="number" value="${item.hpRestore||0}" onchange="updateItem(${index}, 'hpRestore', parseInt(this.value))"></div>
          </div>`;
        list.appendChild(div);
      });
    }

    // ===== 渲染：关卡 =====
    function renderLevels() {
      const list = document.getElementById('level-list'); list.innerHTML = '';
      gameLevels.forEach((lv, index) => {
        const div = document.createElement('div'); div.className = 'card';
        div.innerHTML = `
          <div class="card-header"><h3>${lv.name}</h3><button class="btn-del" onclick="deleteLevel(${index})">删除</button></div>
          <div class="form-grid">
            <div class="form-item full"><label>关卡名称</label><input type="text" value="${lv.name}" onchange="updateLevel(${index}, 'name', this.value)"></div>
            <div class="form-item full"><label>掉落物品</label><select onchange="updateLevel(${index}, 'rewardItemId', this.value)"><option value="">(无)</option>${gameItems.map(e => `<option value="${e.id}" ${lv.rewardItemId === e.id ? 'selected' : ''}>${e.name}</option>`).join('')}</select></div>
            <div class="form-item full">
              ${[0,1,2].map(i => {
                const curEnemy = lv.enemyIds && lv.enemyIds[i] ? lv.enemyIds[i] : '';
                return `<div style="display:flex; gap:10px; margin-bottom:5px;"><span>位置 ${i+1}:</span><select style="flex:1;" onchange="updateLevelEnemy(${index}, ${i}, this.value)"><option value="">(空)</option>${gameChars.filter(c=>c.side==='enemy').map(c => `<option value="${c.id}" ${curEnemy === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}</select></div>`;
              }).join('')}
            </div>
          </div>`;
        list.appendChild(div);
      });
    }

    // ===== 弹窗及操作逻辑 =====
    let currentCharIdx = -1;
    let currentSlotType = '';

    function openItemModal(charIdx, slotType) {
      currentCharIdx = charIdx;
      currentSlotType = slotType;
      const char = gameChars[charIdx];
      document.getElementById('modal-title').innerText = `选择 ${slotType === 'weapon' ? '武器' : '防具'}`;
      
      const listDiv = document.getElementById('modal-list');
      listDiv.innerHTML = '';
      const equippedUid = char.equipment[slotType];

      if (equippedUid) {
        const inst = inventory.find(i => i.uid === equippedUid);
        const item = inst ? gameItems.find(e => e.id === inst.itemId) : null;
        if (item) {
          const row = document.createElement('div'); row.className = 'item-row';
          row.innerHTML = `<div><div style="color:#2ecc71; font-weight:bold;">[已穿戴] ${item.name}</div></div><button class="btn-action remove" onclick="removeItem()">脱除</button>`;
          listDiv.appendChild(row);
        }
      }

      inventory.forEach(inst => {
        if (inst.equippedBy !== '' && inst.equippedBy !== char.id) return;
        if (inst.uid === equippedUid) return;
        const item = gameItems.find(e => e.id === inst.itemId);
        if (!item || item.category !== slotType) return;

        const row = document.createElement('div'); row.className = 'item-row';
        row.innerHTML = `<div><div style="font-weight:bold;">${item.name}</div></div><button class="btn-action ${equippedUid ? 'replace' : ''}" onclick="wearItem('${inst.uid}')">${equippedUid ? '替换' : '穿戴'}</button>`;
        listDiv.appendChild(row);
      });

      if (listDiv.innerHTML === '') listDiv.innerHTML = '<div style="text-align:center; padding:20px;">无可用物品</div>';
      document.getElementById('equip-modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('equip-modal').style.display = 'none'; }

    function wearItem(uid) {
      const char = gameChars[currentCharIdx];
      const oldUid = char.equipment[currentSlotType];
      if (oldUid) { const oldInst = inventory.find(i => i.uid === oldUid); if (oldInst) oldInst.equippedBy = ''; }
      const newInst = inventory.find(i => i.uid === uid);
      if (newInst) newInst.equippedBy = char.id;
      char.equipment[currentSlotType] = uid;
      saveData(); renderChars(); closeModal();
    }

    function removeItem() {
      const char = gameChars[currentCharIdx];
      const oldUid = char.equipment[currentSlotType];
      if (oldUid) { const oldInst = inventory.find(i => i.uid === oldUid); if (oldInst) oldInst.equippedBy = ''; }
      char.equipment[currentSlotType] = '';
      saveData(); renderChars(); closeModal();
    }

    function saveData() {
      localStorage.setItem('my_game_data_v9', JSON.stringify(gameChars));
      localStorage.setItem('my_game_skills_v9', JSON.stringify(gameSkills));
      localStorage.setItem('my_game_statuses_v9', JSON.stringify(gameStatuses));
      localStorage.setItem('my_game_items_v9', JSON.stringify(gameItems));
      localStorage.setItem('my_game_levels_v9', JSON.stringify(gameLevels));
      localStorage.setItem('my_game_inventory_v9', JSON.stringify(inventory));

      localStorage.setItem('my_game_characters', JSON.stringify(gameChars));
      localStorage.setItem('my_game_skills_sync', JSON.stringify(gameSkills));
      localStorage.setItem('my_game_statuses_sync', JSON.stringify(gameStatuses));
      localStorage.setItem('my_game_items_sync', JSON.stringify(gameItems));
      localStorage.setItem('my_game_levels_sync', JSON.stringify(gameLevels));
      localStorage.setItem('my_game_inventory_sync', JSON.stringify(inventory));
    }

    function updateChar(index, key, value) { gameChars[index][key] = value; saveData(); }
    function updateSkillSlot(c, s, v) { gameChars[c].skillSlots[s] = v; saveData(); }
    function updateSkill(index, key, value) { gameSkills[index][key] = value; saveData(); if (key === 'name' || key === 'type') render(); }
    function updateStatus(index, key, value) { gameStatuses[index][key] = value; saveData(); }
    function updateItem(index, key, value) { gameItems[index][key] = value; saveData(); if (key === 'name' || key === 'category') render(); }
    function updateLevel(index, key, value) { gameLevels[index][key] = value; saveData(); }
    function updateLevelEnemy(lvIndex, slotIndex, enemyId) {
      if (!gameLevels[lvIndex].enemyIds) gameLevels[lvIndex].enemyIds = ['', '', ''];
      gameLevels[lvIndex].enemyIds[slotIndex] = enemyId;
      saveData();
    }

    function addChar() { gameChars.push({ id: 'char_'+Date.now(), name:'新角色', side: subTab.char, emoji:'🙂', element:'fire', maxHp:1000, atk:100, def:50, speed:10, critRate:0.1, critDmg:1.5, maxMp:50, mpPerAttack:10, hitRate:0, dodgeRate:0, critResist:0, dmgIncrease:0, dmgReduction:0, dmgTakenIncrease:0, trueDmg:0, gridX:-1, gridY:-1, skillSlots:{normal:'',skill:'',ultimate:'',followup:'',learned:''}, equipment:{weapon:'',armor:''} }); saveData(); render(); }
    function deleteChar(index) { if (confirm('确定删除？')) { gameChars.splice(index, 1); saveData(); render(); } }
    
    function addSkill() { 
      let type = 'skill';
      if (subTab.skill === 'followup') type = 'followup';
      if (subTab.skill === 'passive') type = 'passive';
      gameSkills.push({ id:'skill_'+Date.now(), name:'新技能', type:type, element:'fire', multiplier:1.0, mpCost:10, cooldown:0, targetRule:'frontRow', statusId:'', statusChance:0, comboTagOut:'', comboTagIn:'', maxTriggers:1 }); 
      saveData(); render(); 
    }
    function deleteSkill(index) { if (confirm('确定删除？')) { gameSkills.splice(index, 1); saveData(); render(); } }
    
    function addStatus() { gameStatuses.push({ id:'status_'+Date.now(), name:'新状态', type:'debuff', duration:1, statMod:'none', statValue:0, isDot:false, dotValue:0 }); saveData(); render(); }
    function deleteStatus(index) { if (confirm('确定删除？')) { gameStatuses.splice(index, 1); saveData(); render(); } }
    
    function addItem() { 
      const cat = subTab.item;
      gameItems.push({ id:'item_'+Date.now(), name:'新物品', category:cat, icon:'📦', desc:'', rarity:'white', atk:0, def:0, hp:0, critRate:0, critResist:0, hpRestore:0, mpRestore:0 }); 
      saveData(); render(); 
    }
    function deleteItem(index) { if (confirm('确定删除？')) { gameItems.splice(index, 1); saveData(); render(); } }
    
    function addLevel() { gameLevels.push({ id:'lv_'+Date.now(), name:'新关卡', enemyIds:['','',''], rewardItemId:'' }); saveData(); render(); }
    function deleteLevel(index) { if (confirm('确定删除？')) { gameLevels.splice(index, 1); saveData(); render(); } }
    
    function grantItem() {
      if (gameItems.length === 0) return alert('请先新建物品');
      const itemId = prompt("输入要发放的物品ID (如: item_sword)");
      if (itemId && gameItems.find(e => e.id === itemId)) {
        inventory.push({ uid: 'inst_' + Date.now(), itemId: itemId, equippedBy: '' });
        saveData();
        alert('发放成功，可以去角色界面穿戴了！');
      } else {
        alert('物品ID不存在');
      }
    }

    function resetData() { 
      localStorage.clear(); 
      location.href = location.href + '?t=' + Date.now(); 
    }

    render();
  </script>
</body>
</html>
