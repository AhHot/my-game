<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏配置中心</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #1a1a2e; color: #fff; padding: 15px; padding-bottom: 120px; }
    h1 { font-size: 24px; text-align: center; margin-bottom: 20px; color: #f1c40f; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab { flex: 1; padding: 12px; text-align: center; background: #16213e; border-radius: 6px; cursor: pointer; border: 1px solid #0f3460; font-size: 14px;}
    .tab.active { background: #3498db; border-color: #3498db; font-weight: bold; }
    .card { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .card-header h3 { color: #3498db; }
    .btn-del { background: #e74c3c; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; font-size: 14px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-item { display: flex; flex-direction: column; }
    .form-item.full { grid-column: span 2; }
    .form-item label { font-size: 12px; color: #aaa; margin-bottom: 4px; }
    .form-item input, .form-item select { background: #0f0f1a; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 4px; font-size: 14px; }
    .skill-slot { background: #0f0f1a; padding: 10px; border-radius: 4px; margin-top: 5px; border: 1px dashed #444; }
    .passive-box { background: #1e1e2e; padding: 10px; border-radius: 4px; border: 1px solid #e67e22; margin-top: 10px; display: none; }
    .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #16213e; padding: 15px; border-top: 1px solid #333; display: flex; flex-wrap: wrap; gap: 10px; z-index: 100; }
    .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; color: #fff; min-width: 45%; }
    .btn-sync { background: #3498db; }
    .btn-gen { background: #e67e22; }
    #output-area { width: 100%; height: 150px; margin-top: 20px; background: #000; color: #2ecc71; padding: 10px; border: 1px solid #444; border-radius: 4px; display: none; font-family: monospace; font-size: 12px; }
  </style>
</head>
<body>

  <h1>⚙️ 游戏配置中心</h1>
  
  <div class="tabs">
    <div class="tab active" onclick="switchTab('char')">👾 角色配置</div>
    <div class="tab" onclick="switchTab('skill')">⚔️ 技能配置</div>
  </div>

  <div id="char-section">
    <div id="char-list"></div>
    <button class="btn" style="background:#2ecc71; width:100%; margin-bottom:20px;" onclick="addChar()">➕ 新增角色</button>
  </div>

  <div id="skill-section" style="display:none;">
    <div id="skill-list"></div>
    <button class="btn" style="background:#2ecc71; width:100%; margin-bottom:20px;" onclick="addSkill()">➕ 新增技能</button>
  </div>

  <textarea id="output-area" readonly></textarea>

  <div class="bottom-bar">
    <button class="btn btn-sync" onclick="syncToGame()">🚀 一键同步测试</button>
    <button class="btn btn-gen" onclick="generateCode()">📦 生成代码上线</button>
  </div>

  <script>
    const DEFAULT_CHARS = [
      { id: 'p_warrior', name: '战士', side: 'player', emoji: '⚔️', element: 'fire', maxHp: 300, atk: 32, def: 18, speed: 8, critRate: 0.15, critDmg: 1.5, maxMp: 60, mpPerAttack: 15, skillSlots: { normal: 'skill_slash', skill: 'skill_fireball', ultimate: '', learned: '' } },
      { id: 'p_mage', name: '法师', side: 'player', emoji: '🔮', element: 'water', maxHp: 180, atk: 42, def: 8, speed: 6, critRate: 0.1, critDmg: 1.6, maxMp: 80, mpPerAttack: 20, skillSlots: { normal: 'skill_slash', skill: 'skill_frost_arrow', ultimate: 'skill_ice_age', learned: '' } },
      { id: 'e_skeleton', name: '骷髅兵', side: 'enemy', emoji: '💀', element: 'dark', maxHp: 240, atk: 26, def: 20, speed: 7, critRate: 0.05, critDmg: 1.4, maxMp: 40, mpPerAttack: 10, skillSlots: { normal: 'skill_dark_claw', skill: '', ultimate: '', learned: '' } }
    ];

    const DEFAULT_SKILLS = [
      { id: 'skill_slash', name: '斩击', type: 'normal', element: 'fire', multiplier: 1.0, mpCost: 0, cooldown: 0, targetRule: 'frontRow' },
      { id: 'skill_fireball', name: '火球术', type: 'skill', element: 'fire', multiplier: 2.0, mpCost: 20, cooldown: 2, targetRule: 'frontRow' },
      { id: 'skill_frost_arrow', name: '霜冻箭', type: 'skill', element: 'water', multiplier: 1.8, mpCost: 15, cooldown: 1, targetRule: 'lowestHp' },
      { id: 'skill_ice_age', name: '极寒风暴', type: 'ultimate', element: 'water', multiplier: 3.5, mpCost: 40, cooldown: 4, targetRule: 'lowestHp' },
      { id: 'skill_dark_claw', name: '暗影爪', type: 'normal', element: 'dark', multiplier: 1.0, mpCost: 0, cooldown: 0, targetRule: 'random' },
      { id: 'passive_atk_up', name: '力量强化', type: 'passive', passiveType: 'atkAdd', passiveValue: 10 } // 被动示例：攻击+10
    ];

    let gameChars = JSON.parse(localStorage.getItem('my_game_data_v3')) || DEFAULT_CHARS;
    let gameSkills = JSON.parse(localStorage.getItem('my_game_skills_v3')) || DEFAULT_SKILLS;

    const elements = ['fire', 'water', 'wind', 'light', 'dark'];
    const sides = [{ val: 'player', label: '我方' }, { val: 'enemy', label: '敌方' }];
    const skillTypes = [
      { val: 'normal', label: '普攻' },
      { val: 'skill', label: '招式' },
      { val: 'ultimate', label: '绝技' },
      { val: 'passive', label: '被动' }
    ];
    const targetRules = [
      { val: 'frontRow', label: '前排' },
      { val: 'lowestHp', label: '血量最低' },
      { val: 'random', label: '随机目标' }
    ];
    const passiveTypes = [
      { val: 'atkAdd', label: '攻击力固定加成' },
      { val: 'hpAdd', label: '生命值固定加成' },
      { val: 'defAdd', label: '防御力固定加成' },
      { val: 'speedAdd', label: '速度固定加成' }
    ];

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => {
        if (t.innerText.includes(tab === 'char' ? '角色' : '技能')) t.classList.add('active');
      });
      document.getElementById('char-section').style.display = tab === 'char' ? 'block' : 'none';
      document.getElementById('skill-section').style.display = tab === 'skill' ? 'block' : 'none';
    }

    function render() {
      renderChars();
      renderSkills();
    }

    // ★ 修改：不再限制技能类型，所有技能自由选择
    function getSkillOptions(selectedId) {
      let html = `<option value="">(空)</option>`;
      gameSkills.forEach(sk => {
        html += `<option value="${sk.id}" ${selectedId === sk.id ? 'selected' : ''}>[${sk.type}] ${sk.name}</option>`;
      });
      return html;
    }

    function renderChars() {
      const list = document.getElementById('char-list');
      list.innerHTML = '';
      
      gameChars.forEach((char, index) => {
        if (!char.skillSlots) char.skillSlots = { normal: '', skill: '', ultimate: '', learned: '' };

        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <div class="card-header">
            <h3>${char.emoji} ${char.name}</h3>
            <button class="btn-del" onclick="deleteChar(${index})">删除</button>
          </div>
          <div class="form-grid">
            <div class="form-item"><label>姓名</label><input type="text" value="${char.name}" onchange="updateChar(${index}, 'name', this.value)"></div>
            <div class="form-item"><label>图标</label><input type="text" value="${char.emoji}" onchange="updateChar(${index}, 'emoji', this.value)"></div>
            <div class="form-item">
              <label>阵营</label>
              <select onchange="updateChar(${index}, 'side', this.value)">
                ${sides.map(s => `<option value="${s.val}" ${char.side === s.val ? 'selected' : ''}>${s.label}</option>`).join('')}
              </select>
            </div>
            <div class="form-item">
              <label>属性</label>
              <select onchange="updateChar(${index}, 'element', this.value)">
                ${elements.map(e => `<option value="${e}" ${char.element === e ? 'selected' : ''}>${e}</option>`).join('')}
              </select>
            </div>
            <div class="form-item"><label>生命</label><input type="number" value="${char.maxHp}" onchange="updateChar(${index}, 'maxHp', parseInt(this.value))"></div>
            <div class="form-item"><label>攻击</label><input type="number" value="${char.atk}" onchange="updateChar(${index}, 'atk', parseInt(this.value))"></div>
            <div class="form-item"><label>防御</label><input type="number" value="${char.def}" onchange="updateChar(${index}, 'def', parseInt(this.value))"></div>
            <div class="form-item"><label>速度</label><input type="number" value="${char.speed}" onchange="updateChar(${index}, 'speed', parseInt(this.value))"></div>
            
            <div class="form-item full">
              <label>技能装配 (可自由组合)</label>
              <div class="skill-slot">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                  <span style="width:70px;">槽位1:</span>
                  <select style="flex:1;" onchange="updateSkillSlot(${index}, 'normal', this.value)">${getSkillOptions(char.skillSlots.normal)}</select>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                  <span style="width:70px;">槽位2:</span>
                  <select style="flex:1;" onchange="updateSkillSlot(${index}, 'skill', this.value)">${getSkillOptions(char.skillSlots.skill)}</select>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                  <span style="width:70px;">槽位3:</span>
                  <select style="flex:1;" onchange="updateSkillSlot(${index}, 'ultimate', this.value)">${getSkillOptions(char.skillSlots.ultimate)}</select>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <span style="width:70px; color:#f1c40f;">学习槽:</span>
                  <select style="flex:1;" onchange="updateSkillSlot(${index}, 'learned', this.value)">${getSkillOptions(char.skillSlots.learned)}</select>
                </div>
              </div>
            </div>
          </div>
        `;
        list.appendChild(div);
      });
    }

    function renderSkills() {
      const list = document.getElementById('skill-list');
      list.innerHTML = '';
      
      gameSkills.forEach((skill, index) => {
        const isPassive = skill.type === 'passive';
        
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <div class="card-header">
            <h3>${skill.name}</h3>
            <button class="btn-del" onclick="deleteSkill(${index})">删除</button>
          </div>
          <div class="form-grid">
            <div class="form-item full"><label>技能ID(不可改)</label><input type="text" value="${skill.id}" disabled style="color:#666;"></div>
            <div class="form-item"><label>技能名称</label><input type="text" value="${skill.name}" onchange="updateSkill(${index}, 'name', this.value)"></div>
            <div class="form-item">
              <label>分类</label>
              <select onchange="updateSkill(${index}, 'type', this.value)">
                ${skillTypes.map(t => `<option value="${t.val}" ${skill.type === t.val ? 'selected' : ''}>${t.label}</option>`).join('')}
              </select>
            </div>
            
            <!-- 主动技能配置区 -->
            <div class="form-item active-only" style="display: ${isPassive ? 'none' : 'flex'};">
              <label>属性</label>
              <select onchange="updateSkill(${index}, 'element', this.value)">
                ${elements.map(e => `<option value="${e}" ${skill.element === e ? 'selected' : ''}>${e}</option>`).join('')}
              </select>
            </div>
            <div class="form-item active-only" style="display: ${isPassive ? 'none' : 'flex'};"><label>耗蓝</label><input type="number" value="${skill.mpCost || 0}" onchange="updateSkill(${index}, 'mpCost', parseInt(this.value))"></div>
            <div class="form-item active-only" style="display: ${isPassive ? 'none' : 'flex'};"><label>冷却回合</label><input type="number" value="${skill.cooldown || 0}" onchange="updateSkill(${index}, 'cooldown', parseInt(this.value))"></div>
            <div class="form-item active-only" style="display: ${isPassive ? 'none' : 'flex'};"><label>伤害倍率</label><input type="number" step="0.1" value="${skill.multiplier || 1.0}" onchange="updateSkill(${index}, 'multiplier', parseFloat(this.value))"></div>
            <div class="form-item active-only" style="display: ${isPassive ? 'none' : 'flex'};">
              <label>目标</label>
              <select onchange="updateSkill(${index}, 'targetRule', this.value)">
                ${targetRules.map(r => `<option value="${r.val}" ${skill.targetRule === r.val ? 'selected' : ''}>${r.label}</option>`).join('')}
              </select>
            </div>

            <!-- 被动技能专属配置区 -->
            <div class="form-item full passive-box" style="display: ${isPassive ? 'block' : 'none'};">
              <label style="color:#e67e22; font-weight:bold;">被动效果配置</label>
              <div style="display:flex; gap:10px; margin-top:5px;">
                <select style="flex:1;" onchange="updateSkill(${index}, 'passiveType', this.value)">
                  ${passiveTypes.map(p => `<option value="${p.val}" ${skill.passiveType === p.val ? 'selected' : ''}>${p.label}</option>`).join('')}
                </select>
                <input type="number" style="flex:1;" placeholder="加成数值" value="${skill.passiveValue || 0}" onchange="updateSkill(${index}, 'passiveValue', parseInt(this.value))">
              </div>
            </div>
          </div>
        `;
        list.appendChild(div);
      });
    }

    function saveData() {
      localStorage.setItem('my_game_data_v3', JSON.stringify(gameChars));
      localStorage.setItem('my_game_skills_v3', JSON.stringify(gameSkills));
    }

    function updateChar(index, key, value) { gameChars[index][key] = value; saveData(); }
    function updateSkillSlot(charIndex, slotKey, skillId) { gameChars[charIndex].skillSlots[slotKey] = skillId; saveData(); }

    function addChar() {
      gameChars.push({
        id: 'char_' + Date.now(), name: '新角色', side: 'player', emoji: '🙂', element: 'fire',
        maxHp: 100, atk: 10, def: 10, speed: 10, critRate: 0.1, critDmg: 1.5, maxMp: 50, mpPerAttack: 10, 
        gridX: -1, gridY: -1, 
        skillSlots: { normal: '', skill: '', ultimate: '', learned: '' }
      });
      saveData(); render();
    }

    function deleteChar(index) { if (confirm('确定删除该角色吗？')) { gameChars.splice(index, 1); saveData(); render(); } }
    
    function updateSkill(index, key, value) {
      gameSkills[index][key] = value;
      saveData();
      if (key === 'name' || key === 'type') render(); // 切换类型时刷新UI
    }

    function addSkill() {
      gameSkills.push({ id: 'skill_' + Date.now(), name: '新技能', type: 'skill', element: 'fire', multiplier: 1.0, mpCost: 10, cooldown: 0, targetRule: 'frontRow' });
      saveData(); render();
    }

    function deleteSkill(index) {
      if (confirm('确定删除该技能吗？')) {
        const skillId = gameSkills[index].id;
        gameChars.forEach(c => {
          for (let k in c.skillSlots) { if (c.skillSlots[k] === skillId) c.skillSlots[k] = ''; }
        });
        gameSkills.splice(index, 1); saveData(); render();
      }
    }

    function syncToGame() {
      localStorage.setItem('my_game_characters', JSON.stringify(gameChars));
      localStorage.setItem('my_game_skills_sync', JSON.stringify(gameSkills));
      alert('✅ 同步成功！刷新游戏体验吧！');
    }

    function generateCode() {
      const output = document.getElementById('output-area');
      const skillsObj = {};
      gameSkills.forEach(sk => {
        skillsObj[sk.id] = { ...sk }; // 导出全部字段（包括被动）
        if(sk.type !== 'passive') {
          skillsObj[sk.id].cost = { mp: sk.mpCost, rage: 0 };
        }
      });
      const codeStr = `// ===== 自动生成的技能库 =====\nconst SKILLS = ${JSON.stringify(skillsObj, null, 2)};\n\n// ===== 自动生成的角色库 =====\nconst CHARACTERS = ${JSON.stringify(gameChars, null, 2)};`;
      output.value = codeStr; output.style.display = 'block'; output.scrollIntoView();
      output.select(); document.execCommand('copy');
      alert('代码已生成并自动复制！');
    }

    render();
  </script>
</body>
</html>
